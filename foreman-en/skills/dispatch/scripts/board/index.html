}

// 一团柔光：椭圆形的径向渐变
function cloud(x, y, rx, ry, color, a) {
  if (a <= 0.002) return;
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, color(a)); g.addColorStop(0.45, color(a * 0.45)); g.addColorStop(1, color(0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.283); ctx.fill();
  ctx.restore();
}

// 星云的配色：这个对话里用过的模型（席位）加上 Claude Code 自己。同一种颜色的输出先加起来，再开平方定分量（只跑过一次的小模型也留一缕颜色；
// 按任务逐个开平方的话，任务多的模型会盖过别的）。正在跑的模型还没有输出，分量至少给到最多那种的六成，干活时就看得出它的颜色。
// Claude Code 最多占四成，免得橙色又盖住一切；颜色太多会糊，席位最多取四种。
// seats: [{ key: 颜色键, out: 输出 token, running }]；返回 [{ key, w, running }]，w 加起来是 1，Claude Code 在最前
function nebulaMix(seats, ccOut, ccRunning) {
  const by = new Map([['claude', { key: 'claude', out: Math.max(0, ccOut || 0), running: !!ccRunning }]]);
  for (const s of seats) {
    const e = by.get(s.key) || { key: s.key, out: 0, running: false };
    e.out += Math.max(0, s.out || 0); e.running ||= !!s.running; by.set(s.key, e);
  }
  for (const e of by.values()) e.raw = Math.sqrt(Math.max(1, e.out));
  const top = Math.max(1, ...[...by.values()].filter((e) => e.key !== 'claude').map((e) => e.raw));
  for (const e of by.values()) if (e.key !== 'claude' && e.running) e.raw = Math.max(e.raw, 0.6 * top);
  const cc = by.get('claude'), others = [...by.values()].filter((e) => e !== cc).sort((a, b) => b.raw - a.raw).slice(0, 4);
  if (!others.length) return [{ key: 'claude', w: 1, running: cc.running }];
  const sum = others.reduce((s, e) => s + e.raw, 0), ccW = Math.min(0.4, cc.raw / (cc.raw + sum));
  return [{ key: 'claude', w: ccW, running: cc.running }, ...others.map((e) => ({ key: e.key, w: (1 - ccW) * e.raw / sum, running: e.running }))];
}

// 单对话的配色：车道上的任务（不含 Claude Code 席的报告），数据一变才重算
const MIX = { ver: -1, busy: null, mix: null };
function boardMix(t) {
  // Claude Code 算不算在干活：它的车道最近 90 秒有动静（host 记录的状态在对话还开着时一直是 running，不能用）
  const cc = B.laneById.get('cc'), last = cc?.events.at(-1), busy = !!last && t - last.ts < 90000;
  if (MIX.ver === B.version && MIX.busy === busy && MIX.mix) return MIX.mix;
  const seats = [], host = cc && latest(cc);
  for (const lane of B.lanes) {
    if (lane.id === 'cc' || lane.ghost) continue;
    for (const r of lane.runs) if (r.kind !== 'answer' && r.model) seats.push({ key: avatarFor(r.model, r.agent_type), out: usageOf(r)?.output ?? 0, running: r.status === 'running' });
  }
  Object.assign(MIX, { ver: B.version, busy, mix: nebulaMix(seats, host ? usageOf(host)?.output ?? 0 : 0, busy) });
  return MIX.mix;
}

// 交织的几团彩色星云：每种颜色按分量分成一到三团，摆在核心周围不同的角度和远近，各自慢慢漂；叠加混色，重叠的地方颜色自然混在一起。
// 正在跑的模型那几团亮一些，历史上用过的淡一些。(x, y) 是中心，R 是半径，flat 是上下压扁的比例，fade 是整体透明度；
// spread 是几团离中心多远（1 是绕着核心摆开，小于 1 往中心收拢、互相叠在一起），size 是每团的大小
// 近乎白色、灰色的颜色（ChatGPT、认不出的模型）当星云色叠多了是一层灰雾，把画面洗灰：这几种淡一半
const PALE = new Set(['chatgpt', 'unknown']);

const lobesOf = (m) => 1 + Math.round(2 * Math.sqrt(m.w));

function drawMixNebula(x, y, R, flat, mix, fade, seed = 0, { spread = 1, size = 1, cap = Infinity } = {}) {
  const sec = performance.now() / 1000, prev = ctx.globalCompositeOperation;
  const total = mix.reduce((sum, m) => sum + lobesOf(m) * lobeAlpha(m), 0), scale = total > cap ? cap / total : 1;
  ctx.globalCompositeOperation = 'lighter';
  mix.forEach((m, i) => {

    const home = (i / mix.length) * 6.283 + rand() * 0.6;
    for (let j = 0; j < lobes; j++) {
      const ang = home + (j - (lobes - 1) / 2) * 0.85 + rand() * 0.35 + sec * (0.01 + 0.01 * rand()) * dir, r = R * spread * (0.3 + 0.32 * rand());
      const rx = R * size * (0.36 + 0.3 * rand()) * (0.8 + 0.5 * Math.sqrt(m.w)), a = fade * scale * lobeAlpha(m);
      cloud(x + Math.cos(ang) * r, y + Math.sin(ang) * r * flat, rx, rx * (0.55 + 0.25 * rand()) * Math.max(flat, 0.6), (al) => rgba(m.key, al), a);
    }
  });
  ctx.globalCompositeOperation = prev;
}

function drawNebula(L, P, t, rates) {
  if (!LOOK.nebula) return;
  const c = L.core;
  // 打底的星云按这个对话用过的模型上色（和宇宙里小星系的盘面一样，08-uni-galaxy.js）；偏上那团白光留着做层次
  drawMixNebula(c.cx, c.cy, c.R * 1.15, 0.8, boardMix(t), 1);

}

// 宇宙尘：在世界里缓慢漂移，绕回；六成撒在光束区（刻度带右边到产出列之间）
const DUST = (() => {
  const rand = rng(50311), list = [];
  for (let i = 0; i < 220; i++) {
    const gap = rand() < 0.6;
    list.push({ x0: gap ? WL.bandX + WL.bandW + rand() * (WL.outX - WL.bandX - WL.bandW) : rand() * WL.W, y0: rand(), vx: (rand() - 0.3) * 6, vy: (rand() - 0.5) * 3,

function drawDust(L) {

  const sec = performance.now() / 1000;

    const span = d.gap ? WL.outX - WL.bandX - WL.bandW : WL.W, left = d.gap ? WL.bandX + WL.bandW : 0;
    const x = left + ((((d.x0 - left + d.vx * sec) % span) + span) % span), y = ((((d.y0 * L.H + d.vy * sec) % L.H) + L.H) % L.H);
    ctx.fillStyle = `rgba(236,236,242,${(d.a * (0.6 + 0.4 * Math.sin(sec * 0.7 + d.ph))).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, d.r * FX.lw, 0, 6.283); ctx.fill();

}

// 星系核心：中心亮核、两道倾斜的轨道环（上面有光点在走）、闪烁的星点；画在核心网上面。
// 配色和宇宙里的小星系一样（08-uni-galaxy.js）：亮核是 Claude Code 的暖色，星点六成白、四成取出场模型的颜色（pal：
// Claude Code 加上正在跑的席位），飞入时交过来的橙色亮核落地后还是橙色
const TWINKLE = (() => {
  const rand = rng(90127), tints = rng(90128), list = [];
  for (let i = 0; i < 70; i++) { const a = rand() * 6.283, r = Math.sqrt(rand()); list.push({ a, r, s: 0.8 + rand() * 1.6, f: 0.8 + rand() * 2.5, ph: rand() * 6.28, tint: tints() }); }
  return list;
})();
const starWhite = (a) => `rgba(248,248,252,${a})`;
const starColor = (tint, pal) => (tint < 0.6 || !pal.length ? starWhite : pal[Math.floor(tint * 10) % pal.length]);

function drawGalaxy(c, intensity, pal = []) {
  if (!LOOK.galaxy) return;
  const sec = performance.now() / 1000;
  ctx.save();
  ctx.beginPath(); ctx.rect(c.cx - c.R * 2, c.cy - c.R * 1.5, c.clipX - (c.cx - c.R * 2), c.R * 3); ctx.clip();
  // 轨道环
  for (const [tilt, rx, ry, spin, a] of [[0.32, 0.8, 0.22, 0.03, 0.24], [-0.6, 0.62, 0.17, -0.045, 0.19]]) {
    ctx.save();
    ctx.translate(c.cx, c.cy); ctx.rotate(tilt + Math.sin(sec * 0.05) * 0.06);
    ctx.strokeStyle = `rgba(235,235,242,${a})`; ctx.lineWidth = 0.8 * FX.lw;
    ctx.beginPath(); ctx.ellipse(0, 0, c.R * rx, c.R * ry, 0, 0, 6.283); ctx.stroke();
    // 每道环上三颗光点：第一颗取出场模型的颜色（两道环取调色板里不同的两个），另两颗白色
    for (let j = 0; j < 3; j++) {
      const th = sec * spin * 6.283 + j * 2.09;
      glowDot(Math.cos(th) * c.R * rx, Math.sin(th) * c.R * ry, 1.5, j ? starWhite : starColor(spin > 0 ? 0.6 : 0.7, pal), 0.8);
    }
    ctx.restore();
  }
  // 闪烁的星点
  for (const s of TWINKLE) {
    const a = 0.25 + 0.6 * Math.max(0, Math.sin(sec * s.f + s.ph));
    ctx.fillStyle = starColor(s.tint, pal)(a.toFixed(3));
    ctx.beginPath(); ctx.arc(c.cx + Math.cos(s.a) * s.r * c.R * 0.92, c.cy + Math.sin(s.a) * s.r * c.R * 0.92, s.s * FX.lw * 0.7, 0, 6.283); ctx.fill();
  }

  const g = ctx.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, c.R * 0.28);
  g.addColorStop(0, `rgba(255,244,232,${0.35 + 0.25 * intensity})`); g.addColorStop(0.25, rgba('claude', 0.14 + 0.1 * intensity)); g.addColorStop(1, rgba('claude', 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.cx, c.cy, c.R * 0.28, 0, 6.283); ctx.fill();
  // 节拍（04-life.js 的 beatsAt）：亮核另闪一团光，不跟着输出强度封顶
  const beat = FX.beat?.env || 0;
  if (beat > 0.01) {
    const f = ctx.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, c.R * 0.34);
    f.addColorStop(0, `rgba(255,246,236,${0.6 * beat})`); f.addColorStop(0.3, rgba('claude', 0.28 * beat)); f.addColorStop(1, rgba('claude', 0));
    ctx.fillStyle = f; ctx.beginPath(); ctx.arc(c.cx, c.cy, c.R * 0.34, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

// ---- 08-fx.js
'use strict';
// 画布层，全部用世界坐标画，和卡片层同一个缩放平移：
// 核心网（token 的来源）、竖直刻度带、核心网 → 卡片的汇流线、Claude Code ↔ 席位穿过核心的交互光线、
// 席位 → 产出框的放射线带（上下和两边的框一样高）、Claude Code → 顶上产出框的弧线。

// cv 画弧线区（星云、尘埃、核心网、中心星系），ov 画其余的光线、刻度带和标签：切换时前者炸开、后者只淡入淡出
const FX = { cv: $('fx'), ov: { cv: $('fxo') }, web: null, webR: 0, layout: null, lw: 1, burst: null };
FX.ov.ctx = FX.ov.cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
// 宇宙层画在自己的画布上（08-uni-draw.js 里临时把 ctx 换过去），画星点、光晕的工具函数两边共用
let ctx = FX.cv.getContext('2d');
const UFX = { cv: $('ufx') };
UFX.ctx = UFX.cv.getContext('2d');
const FX_LIFE = 2.6, FX_PULSE = 2.4, FX_MAX_LABELS = 16;
const LABEL_KINDS = new Set(['read', 'edit', 'search', 'web', 'image']);
const HI = (a) => `rgba(245,245,248,${a})`; // 星光白
const tintOf = (laneId) => { const l = B.laneById.get(laneId), r = l && latest(l); const key = r ? avatarFor(r.model, r.agent_type) : 'claude'; return (a) => rgba(key, a); };
const ageOf = (ev, t) => (t - ev.ts) / 1000 / (B.clock.mode === 'replay' ? B.clock.speed : 1);
const ease = (u) => u * u * (3 - 2 * u);
const cubicAt = (c, u) => { const v = 1 - u; return [0, 1].map((i) => v * v * v * c[0][i] + 3 * v * v * u * c[1][i] + 3 * v * u * u * c[2][i] + u * u * u * c[3][i]); };

function glowDot(x, y, r, color, a = 1) {
  r *= FX.lw;
  // 柔光进了辉光层（1/3 分辨率）会被摊薄，画得大一些、亮一些，放大合上去以后和原来的光晕差不多显眼
  const g = glowCtx(), soft = g !== ctx;
  g.fillStyle = color((soft ? 0.42 : 0.2) * a); g.beginPath(); g.arc(x, y, r * (soft ? 3.6 : 2.8), 0, 6.283); g.fill();
  ctx.fillStyle = HI(0.9 * a); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
}

// ---- 辉光层 ----
// 看板的两层画布（弧线区、上面那层）画的时候，光点外面那圈柔光不直接画上去，先画进一张 1/3 分辨率的离屏画布；
// 整层画完后放大、用叠加（lighter）合上去：低分辨率放大自带柔边，再从它缩出一张 1/6 的叠一次，外面多一圈淡淡的光晕。
// 不用 ctx.filter 做模糊：冷着色器缓存时滤镜很慢（特别是第一次飞进长对话时）。
// 宇宙层也复用这两级，再叠更宽的辉光。?glow=0 关掉，用来对比和量帧
const GLOW = { off: Q.get('glow') === '0', on: false, layers: new WeakMap() };
function glowBuffer() {
  const cv = document.createElement('canvas');
  return { cv, ctx: cv.getContext('2d') };
}
function glowBegin(target) {
  if (GLOW.off) return;
  // 飞入飞出时同一帧会画不同分辨率的层；各自留一份缓冲，避免反复调整尺寸、重分配位图。
  let layer = GLOW.layers.get(target.canvas);

  for (const [buf, w, h] of [[a, W, H], [b, Math.ceil(W / 2), Math.ceil(H / 2)]]) {

}

// 核心网：三层长弧线和散点，建一次 Path2D，每帧旋转。每层的弧线分进六个桶：一半留白，另一半按当前各模型的颜色上色，像一团星云
const WEB_BUCKETS = 6;
function buildWeb(R) {
  const rand = rng(20261022);
  const layer = (count, rMin, rMax, specks) => {
    const paths = Array.from({ length: WEB_BUCKETS }, () => new Path2D()), dots = [];
    for (let i = 0; i < count; i++) {
      const p = paths[rand() < 0.5 ? 0 : 1 + Math.floor(rand() * (WEB_BUCKETS - 1))];
      const a1 = rand() * Math.PI * 2, a2 = a1 + 1.1 + rand() * 2.3, r = R * (rMin + rand() * (rMax - rMin));
      const x1 = r * Math.cos(a1), y1 = r * Math.sin(a1), x2 = r * Math.cos(a2), y2 = r * Math.sin(a2), bend = (rand() - 0.5) * 0.9;

  FX.web = [[layer(170, 0.55, 1, 90), 0.15, 0.55, 0.008], [layer(120, 0.4, 0.9, 60), 0.27, 0.5, -0.013], [layer(46, 0.25, 0.7, 30), 0.4, 0.7, 0.02]];
  FX.webR = R;
}

// 当前出场的模型（Claude Code 和各席）的颜色，核心网和星云按它上色
function webPalette() {
  const keys = [...new Set(B.lanes.filter((l) => l.runs.length).map((l) => { const r = latest(l); return avatarFor(r.model, r.agent_type); }))];

// 星系的星点按它上色：Claude Code 加上此刻正在跑的席位，和宇宙里小星系的规则一样（08-uni-galaxy.js 的 drawGalaxyOf）。
// 在不在跑用 drawFx 这一帧已经算好的活跃程度（live），不再逐条车道重算状态
function starPalette(t, lanes, live) {

function drawCore(c, intensity, pal) {
  if (!FX.web || FX.webR !== c.R) buildWeb(c.R);
  const sec = performance.now() / 1000;
  ctx.save();
  ctx.beginPath(); ctx.rect(c.cx - c.R * 2, c.cy - c.R * 1.5, c.clipX - (c.cx - c.R * 2), c.R * 3); ctx.clip();
  for (const [i, [{ paths, dots }, alpha, width, speed]] of FX.web.entries()) {
    ctx.save();
    ctx.translate(c.cx, c.cy);
    // 炸开时各层带着多转的角度甩出来，越往后越慢；线条先亮再回落到平常（FX.burst，见 burstOf）
    // 节拍让线条亮一下：乘在亮度上，对话正忙、输出强度已经很高时也看得出来
    const b = FX.burst, boost = (b ? 1 + 1.6 * b.boost : 1) * (1 + 1.2 * (FX.beat?.env || 0));
    ctx.rotate(Math.sin(sec * speed) * 0.35 + sec * speed * 0.2 + Math.sign(speed) * (FX.kick || 0) * Math.abs(speed) / 0.02 + (b ? Math.sign(speed) * 2.4 * b.spin : 0));
    // 最外面那层是远景：平时贴预先画好的半分辨率图（看着虚、远），炸开时照常一条条画
    if (i === 0 && !b && farLayer(c.R, FX.web[0], pal)) {
      ctx.globalAlpha = Math.min(1, ctx.globalAlpha * (0.6 + 0.4 * intensity) * FAR.dim * boost);
      ctx.drawImage(FAR.cv, -FAR.half, -FAR.half, FAR.half * 2, FAR.half * 2);
      ctx.restore();
      continue;
    }
    ctx.lineWidth = width * FX.lw;
    paths.forEach((p, j) => {
      const col = j && pal.length ? pal[(j - 1) % pal.length] : HI;
      ctx.strokeStyle = col(alpha * (j && pal.length ? 1.6 : 1) * (0.6 + 0.4 * intensity) * boost); ctx.stroke(p);
    });
    ctx.fillStyle = HI(0.5);
    const d = 1.3 * FX.lw;
    for (const [x, y] of dots) ctx.fillRect(x, y, d, d);
    ctx.restore();
  }
  ctx.restore();
}

// 远景层：核心网最外面一层（弧线最多、最淡）预先画成一张图，每帧只按当前角度贴上去。
// 按屏幕分辨率的一半画，放大贴上去自带柔边，看着在后面、有景深；比每帧描 170 条弧线省。
// 出场模型的颜色变了、或者缩放档位变了（线宽和分辨率跟着变）才重画；亮度随输出强弱的变化在贴图时乘上去
const FAR = { cv: document.createElement('canvas'), key: '', half: 0, dim: 0.85 };
FAR.ctx = FAR.cv.getContext('2d');
function farLayer(R, [{ paths, dots }, alpha, width], pal) {
  const dpr = devicePixelRatio || 1, s = Math.min(1.2, Math.max(0.15, 0.5 * VIEW.k * dpr));
  const key = `${R}|${pal.key}|${Math.round(Math.log(s) / Math.log(1.5))}|${Math.round(Math.log(FX.lw) / Math.log(1.3))}`;
  if (FAR.key === key) return true;
  const size = Math.ceil(2 * R * 1.05 * s), g = FAR.ctx;
  if (size > 4096) return false;
  FAR.cv.width = FAR.cv.height = size; FAR.half = size / 2 / s; FAR.key = key;
  g.setTransform(s, 0, 0, s, size / 2, size / 2);
  g.lineWidth = width * FX.lw;
  paths.forEach((p, j) => { g.strokeStyle = (j && pal.length ? pal[(j - 1) % pal.length] : HI)(alpha * (j && pal.length ? 1.6 : 1)); g.stroke(p); });
  g.fillStyle = HI(0.5);
  const d = 1.3 * FX.lw;
  for (const [x, y] of dots) g.fillRect(x, y, d, d);
  return true;
}

// 竖直刻度带：半透明深底、两侧各一条双线导轨、发光的刻度、来回扫的亮线；组头和卡片都在带里。
// 带子上下伸出屏幕、两头渐隐；卡片滚动时刻度跟着走，像一卷胶片
function vfade(b, rgb, a, edge = 0.16) {
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(edge, `rgba(${rgb},${a})`); g.addColorStop(1 - edge, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  return g;
}
// a：展开程度（0–1，见 08-life.js 的 bandReveal）；没展开完时从中间往上下打开
function drawBand(b, t, a = 1) {
  if (a <= 0.01) return;
  ctx.save();
  if (a < 1) {
    const mid = b.y + b.h / 2, h = b.h * ease(a);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.beginPath(); ctx.rect(b.x - 20, mid - h / 2, b.w + 40, h); ctx.clip();
  }
  // 深底：横向两边稍亮，竖向两头渐隐（先横向渐变填，再用竖向渐变的透明度叠一次）
  ctx.fillStyle = vfade(b, '9,9,11', 0.85); ctx.fillRect(b.x, b.y, b.w, b.h);
  // 双线导轨：外线亮、内线暗
  ctx.lineWidth = FX.lw;
  ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + b.h); ctx.moveTo(b.x + b.w, b.y); ctx.lineTo(b.x + b.w, b.y + b.h);
  ctx.strokeStyle = vfade(b, '215,215,225', 0.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x + 3.5, b.y); ctx.lineTo(b.x + 3.5, b.y + b.h); ctx.moveTo(b.x + b.w - 3.5, b.y); ctx.lineTo(b.x + b.w - 3.5, b.y + b.h);
  ctx.strokeStyle = vfade(b, '200,200,212', 0.16); ctx.lineWidth = 0.6 * FX.lw; ctx.stroke();
  // 刻度：先画一遍宽而淡的当光晕，再画细线；滚动时跟着卡片一起往上走
  const shift = REEL.overflow ? ((REEL.s % 30) + 30) % 30 : 0;
  ctx.beginPath();
  for (let y = b.y - shift, i = 0; y <= b.y + b.h; y += 6, i++) {
    if (y < b.y) continue;
    const len = i % 5 ? 3 : 8;
    ctx.moveTo(b.x, y); ctx.lineTo(b.x + len, y); ctx.moveTo(b.x + b.w - len, y); ctx.lineTo(b.x + b.w, y);
  }
  ctx.strokeStyle = vfade(b, '225,225,235', 0.1); ctx.lineWidth = 2.4 * FX.lw; ctx.stroke();
  ctx.strokeStyle = vfade(b, '215,215,225', 0.45); ctx.lineWidth = 0.6 * FX.lw; ctx.stroke();
  const p = 0.2 + 0.6 * (Math.sin(performance.now() / 2600) + 1) / 2, sy = b.y + p * b.h;
  const grad = ctx.createLinearGradient(0, sy - 30, 0, sy + 30);
  grad.addColorStop(0, HI(0)); grad.addColorStop(0.5, HI(0.05)); grad.addColorStop(1, HI(0));
  ctx.fillStyle = grad; ctx.fillRect(b.x, sy - 30, b.w, 60);
  ctx.strokeStyle = HI(0.55); ctx.lineWidth = 1.2 * FX.lw;
  ctx.beginPath(); ctx.moveTo(b.x, sy); ctx.lineTo(b.x + 16, sy); ctx.moveTo(b.x + b.w - 16, sy); ctx.lineTo(b.x + b.w, sy); ctx.stroke();
  ctx.restore();
}

// 卡片接口（世界坐标）：token 在左边（Claude Code 在右边）上部，交互在下部；折叠起来的组落在组头上
function portsOf(L) {
  const P = new Map(), c = L.cc;
  // Claude Code 卡片离场时（L.ccAway），连到它的光线跟着淡掉
  P.set('cc', { tok: [c.x + c.w, c.y + c.h * 0.3], link: [c.x + c.w, c.y + c.h * 0.72], out: [c.x + c.w * 0.65, c.y], card: c, vis: 1 - (L.ccAway || 0) });
  for (const g of L.groups) for (const lane of g.lanes) {
    const row = L.rows.get(lane.id);
    if (row) P.set(lane.id, { tok: [row.card.x, row.card.y + row.card.h * 0.3], link: [row.card.x, row.card.y + row.card.h * 0.72], card: row.card, outbox: row.out, visible: true, vis: row.vis });
    else P.set(lane.id, { tok: [L.band.x, g.head.y + 5], link: [L.band.x, g.head.y + 5], visible: false, vis: g.vis });
  }
  return P;
}

// 切换中弧线区怎么画：以星系亮核此刻的位置为中心，按炸开的进度 p 缩放（先快后慢），带着多转的角度和更亮的线条
function burstOf(T) {
  const p = reduceMotion.matches ? 1 : T.p;
  const s = 1 - Math.pow(1 - p, 4);
  return { p, s, wx: (T.cx - VIEW.tx) / VIEW.k, wy: (T.cy - VIEW.ty) / VIEW.k, spin: Math.pow(1 - s, 2), boost: Math.pow(1 - p, 2) };
}
// 炸开的一瞬：亮核处一团白光很快散开；底下一团暖色的光散得慢一些，把星系亮核的橙色交给弧线区的中心（飞出时倒过来，收拢成亮核）
function drawFlash(b, R) {
  const glow = (a, r, inner) => {
    if (a < 0.01) return;
    const g = ctx.createRadialGradient(b.wx, b.wy, 0, b.wx, b.wy, r);
    g.addColorStop(0, inner(a)); g.addColorStop(0.3, rgba('claude', 0.5 * a)); g.addColorStop(1, rgba('claude', 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.wx, b.wy, r, 0, 6.283); ctx.fill();
  };
  const on = b.p <= 0 ? 0 : Math.min(1, b.p * 20);
  glow(0.7 * on * Math.exp(-b.p * 2.4), R * 0.32 * (0.45 + 0.55 * b.s), (a) => rgba('claude', a));
  glow(0.9 * on * Math.exp(-b.p * 6), R * (0.1 + 0.5 * b.s), HI);
}
function sizeCanvas(cv, w, h, dpr) {
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = `${w}px`; cv.style.height = `${h}px`;
  }
}

function drawFx(t, L) {
  const dpr = devicePixelRatio || 1, { cw: w, ch: h } = viewBox(), T = FLYFX;
  // 弧线区是星云、柔光和尘埃，限制像素量；上层的文字和交互线条仍按设备像素画。
  const baseDpr = Math.min(dpr, 1.5);
  sizeCanvas(FX.cv, w, h, baseDpr); sizeCanvas(FX.ov.cv, w, h, dpr);
  ctx.setTransform(baseDpr, 0, 0, baseDpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const fit = fitGoal();
  // 看板的星空跟着界面一起淡入（宇宙层有自己的星空）
  if (T) ctx.globalAlpha = T.rest;
  drawStars(w, h, fit);
  ctx.globalAlpha = 1;
  ctx.setTransform(baseDpr * VIEW.k, 0, 0, baseDpr * VIEW.k, baseDpr * VIEW.tx, baseDpr * VIEW.ty);
  FX.layout = L;
  FX.lw = Math.pow(fit.k / VIEW.k, 0.6);
  const P = portsOf(L);
  const lanes = [B.laneById.get('cc'), ...seatLanes(t)].filter((l) => l && latest(l) && P.has(l.id));
  const rates = new Map(lanes.map((l) => [l.id, rateAt(l, t)]));
  const total = smooth('total', glow([...rates.values()].reduce((a, b) => a + b, 0)));
  // 节拍（04-life.js 的 beatsAt）：再算上输出突然加快（08-surge.js）；转动被推一把按屏幕时间累加，减少动态效果时不推
  const beat = FX.beat = beatsAt(t), ms = performance.now(), dt = Math.min(0.1, (ms - (FX.kickAt || ms)) / 1000);
  for (const lane of lanes) { const age = surgeAge(lane.id); if (age != null && age < BEAT.window) { const e = 0.45 * Math.exp(-age * BEAT.decay); beat.env = Math.max(beat.env, e); beat.lanes.set(lane.id, Math.max(beat.lanes.get(lane.id) || 0, e)); } }
  FX.kickAt = ms;
  if (!reduceMotion.matches) FX.kick = (FX.kick || 0) + dt * 1.0 * beat.env;
  // 每个模型的活跃程度（0–1）平滑过渡，互联网光线和输出通道共用
  const live = new Map(lanes.map((l) => [l.id, smooth(`live|${l.id}`, laneActive(l, t) ? 1 : 0)]));
  // 刻度带的展开程度也平滑（最后一组离开时慢慢收起）
  const pal = webPalette(), bandA = smooth('band', bandReveal(L, t));
  // 刻度带没出现时，核心网和星系按本来的圆形完整画（不在刻度带左边切掉）；刻度带展开时一起收回去
  // 切换中跟着界面一起：界面淡出时弧线区先恢复成完整的圆再收拢，淡入时才在刻度带左边切掉（不然收拢的圆上会有一道硬边）
  L.core.clipX += (1 - (T ? bandA * T.rest : bandA)) * L.core.R * 1.3;
  // 弧线区：切换中以星系亮核为中心按炸开的进度缩放；线宽和散点不跟着缩到看不见，小的时候是一团细亮的丝
  const burst = T ? burstOf(T) : null, lw = FX.lw;
  if (!burst || burst.s > 0.002) {
    glowBegin(ctx);
    ctx.save();
    if (burst) {
      ctx.translate(burst.wx, burst.wy); ctx.scale(burst.s, burst.s); ctx.translate(-L.core.cx, -L.core.cy);
      FX.burst = burst; FX.lw = lw * Math.pow(burst.s, -0.7);
    }
    try {
      drawNebula(L, P, t, rates, pal);
      drawDust(L);
      drawCore(L.core, total, pal);
      drawGalaxy(L.core, total, starPalette(t, lanes, live));
    } finally { ctx.restore(); FX.burst = null; FX.lw = lw; glowFlush(ctx); }
  }
  if (burst) drawFlash(burst, L.core.R);
  // 中心亮核的星芒：飞入时从星系亮核的星芒接过来（08-uni-glow.js）
  if (ULOOK.on) boardCoreFlare(L.core, total, T, burst);
  // 其余的画在上面那层画布上，切换时整层淡入淡出（applyShare）
  const base = ctx;
  ctx = FX.ov.ctx;
  try {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.setTransform(dpr * VIEW.k, 0, 0, dpr * VIEW.k, dpr * VIEW.tx, dpr * VIEW.ty);
    glowBegin(ctx);
    drawOverlay(t, L, P, lanes, rates, live, bandA, burst);
  } finally { glowFlush(ctx); ctx = base; }
}

// 上面那层：核心网到卡片的汇流线、刻度带、席位到产出框的光带、产出框、状态、标签、交互光线。
// 切换中（burst）弧线区在亮核此刻的位置、按炸开的进度缩放：连到弧线区的光线（汇流线、交互光线）和核心附近的标签
// 都以这个位置和大小为准，跟着弧线区移动、被拉长，和滚动刻度带时一样一直粘在弧线区上
function drawOverlay(t, L, P, lanes, rates, live, bandA, burst = null) {
  const core = burst ? { ...L.core, cx: burst.wx, cy: burst.wy, R: L.core.R * Math.max(0.05, burst.s) } : L.core;
  // 输出突然加快的脉冲（08-surge.js）：切换中、定格（?t=）时不放
  trackSurges(rates, !!burst || B.params.t != null, t);
  const pulses = [...recentPulses(t), ...surgePulses(lanes)];
  // 滚到刻度带两头的席位跟着渐隐，它的光线也一起淡掉
  // 还没被光点拉到的卡片、正在离开的组，光线也跟着淡入淡出
  L.arrive = arrivals(t);
  const fadeOf = (id) => (P.get(id).vis ?? 1) * (L.arrive.get(id)?.card ?? 1) * (1 - (L.rows.get(id)?.leave || 0)) * dimOf(id);
  const each = (fn) => { for (const lane of lanes) { const v = fadeOf(lane.id); if (v < 0.02) continue; ctx.globalAlpha = v; fn(lane); } ctx.globalAlpha = 1; };
  each((lane) => drawBundle(core, lane, P.get(lane.id), smooth(`bI|${lane.id}`, glow(rates.get(lane.id) || 0)), live.get(lane.id), surgeAge(lane.id)));
  each((lane) => { const age = surgeAge(lane.id); if (age != null && age < SURGE_CORE) drawSurgeCore(core, lane.id, age); });
  drawBand(L.band, t, bandA);
  each((lane) => { if (lane.id !== 'cc' && P.get(lane.id).visible) drawRibbon(lane, P.get(lane.id), t, rates.get(lane.id) || 0, pulses, live.get(lane.id)); });
  ctx.globalAlpha = P.get('cc').vis;
  drawCCOut(P.get('cc'), L.ccOut, pulses, rates.get('cc') || 0, live.get('cc') || 0, t);
  ctx.globalAlpha = 1;
  drawOutLife(L, P, t);
  drawStates(L, t);
  drawTags(L, t, rates);
  each((lane) => { if (lane.id !== 'cc') drawLink(core, lane, P.get('cc'), P.get(lane.id), t, pulses); });
  drawLife(L, t);
  const others = [];
  for (const lab of recentLabels(t).reverse()) drawLabel(lab, core, P, others);
  drawNotes(core, t);
}

// ---- 08-labels.js
'use strict';
// 脉冲、文件名光点和说明框（世界坐标；文件名的字号按屏幕固定，像地图上的地名）。

// 直播里一件事第一次出现在页面上的时刻（毫秒），事件脉冲和文件名标签共用。事件要过一会儿才到页面（看板服务每秒推一次；
// Claude Code 的工具调用要等整条回复生成完才写进记录），按事件自己的时刻算，到的时候光束已经走了一半、文件名已经淡了，
// 所以直播时都从第一次看到起算，和节拍一样（04-life.js 的 BEAT）。连上服务时开头那一批（服务发 synced 之前，以及之后算的第一帧）
// 和晚到 SEEN.late 秒以上的返回 null（旧的，不放）。每帧第一次调用时更新连接状态，同一帧里再调用用同一个判断
const SEEN = { late: 120, map: new Map(), hello: undefined, synced: false, frame: null, old: true };
function seenAt(key, ts, t) {
  if (SEEN.frame !== t) {
    SEEN.frame = t;
    if (SEEN.hello !== B.hello) { SEEN.hello = B.hello; SEEN.map.clear(); SEEN.synced = false; }
    SEEN.old = !B.synced || !SEEN.synced;
    if (B.synced) SEEN.synced = true;
    for (const [k, v] of SEEN.map) if (v.ts <= t - SEEN.late * 1000) SEEN.map.delete(k);
  }
  if (!SEEN.map.has(key)) SEEN.map.set(key, { ts, at: SEEN.old || ts <= t - SEEN.late * 1000 ? null : t });
  return SEEN.map.get(key).at;
}

// 脉冲：Claude Code 派活（dir 1）、结果回来或被读取（dir -1）；产出（写文件、交报告、结束，out）。
// 没有 Claude Code 记录时，用任务的开始和结束代替派活和结果回来，交互光线照样有反应。
// 直播时从第一次看到起算（seenAt），回放照旧按事件的时刻。同一条车道同一类、同时出现的几件事只放一道：几道一样的光束叠在一起
// 会变成一条过亮的白条。直播里"同时"是同一帧第一次看到（Claude Code 一条回复里并行改的几个文件时刻各不相同，却一起到页面），
// 回放里是同一个时刻（Codex 一次报的几个文件改动）
function recentPulses(t) {
  const out = [], cc = B.laneById.get('cc'), live = B.clock.mode !== 'replay', once = new Set(), from = t - SEEN.late * 1000;
  const hasLinks = !!(cc && cc.events.some((e) => e.target && e.target.length));
  const add = (pulse, ts) => {
    let age = ageOf({ ts }, t);
    if (live ? ts <= from : age > FX_PULSE) return;
    const kind = `${pulse.lane}|${pulse.out ? 'out' : pulse.dir}`;
    let when = ts;
    if (live) {
      const at = seenAt(`p|${kind}|${ts}`, ts, t);
      if (at == null) return;
      when = at; age = (t - at) / 1000;
    }
    if (once.has(`${kind}|${when}`)) return;
    once.add(`${kind}|${when}`);
    if (age >= 0 && age <= FX_PULSE) out.push({ ...pulse, age });
  };
  for (const lane of B.lanes) {
    for (let i = lane.events.length - 1; i >= 0; i--) {
      const ev = lane.events[i];
      if (ev.ts > t) continue;
      if (live ? ev.ts <= from : ageOf(ev, t) > FX_PULSE) break;
      if (lane.id === 'cc' && ev.target) for (const id of ev.target) add({ lane: id, dir: ev.k === 'dispatch' ? 1 : -1 }, ev.ts);
      if (ev.k === 'edit' || ev.k === 'report' || ev.k === 'end') add({ lane: lane.id, out: true }, ev.ts);
    }
    if (!hasLinks && lane.id !== 'cc') for (const r of lane.runs) {
      if (r.started_at <= t) add({ lane: lane.id, dir: 1 }, r.started_at);
      if (r.ended_at != null && r.ended_at <= t) add({ lane: lane.id, dir: -1 }, r.ended_at);
    }
  }
  return out;
}

// 文件名标签：和脉冲一样，直播时从第一次看到起算（seenAt），晚到的改文件光束跑过去时也看得到改的是哪个文件
function recentLabels(t) {
  const list = [], live = B.clock.mode !== 'replay', from = t - SEEN.late * 1000;
  for (const lane of B.lanes) {
    for (let i = lane.events.length - 1; i >= 0; i--) {
      const ev = lane.events[i];
      if (ev.ts > t) continue;
      let age = ageOf(ev, t);
      if (live ? ev.ts <= from : age > FX_LIFE) break;
      if (!LABEL_KINDS.has(ev.k) || !ev.t) continue;
      if (live) { const at = seenAt(`l|${lane.id}|${ev.k}|${ev.ts}|${ev.t}`, ev.ts, t); if (at == null) continue; age = (t - at) / 1000; }
      if (age <= FX_LIFE) list.push({ ev, lane: lane.id, age });
    }
  }
  return list.sort((a, b) => a.age - b.age).slice(0, FX_MAX_LABELS);
}

function labelText(ev) {
  if (ev.k === 'edit') return `✎ ${baseName(editParts(ev.t).path)}`;
  if (ev.k === 'read' || ev.k === 'image') return baseName(ev.t);
  const s = String(ev.t).replace(/^https?:\/\//, '');
  return s.length > 28 ? `${s.slice(0, 27)}…` : s;
}

// 出生点：核心网里偏向目标卡片那一侧；第一次出现时选一个不和正在显示的文件名重叠的位置，之后记住（相对圆心、以半径为单位）
const LABEL_POS = new Map();
function labelSpot(key, side, others) {
  let spot = LABEL_POS.get(key);
  if (!spot) {
    const rand = rng(hash(key));
    for (let i = 0; i < 10; i++) {
      const ang = side + (rand() - 0.5) * 2.4, rad = 0.15 + rand() * 0.6;
      spot = { dx: Math.cos(ang) * rad, dy: Math.sin(ang) * rad };
      if (!others.some((o) => Math.abs(o.dx - spot.dx) < 0.4 && Math.abs(o.dy - spot.dy) < 0.07)) break;
    }
    LABEL_POS.set(key, spot);
    if (LABEL_POS.size > 300) LABEL_POS.delete(LABEL_POS.keys().next().value);
  }
  return spot;
}

function drawLabel(L, c, P, others) {
  const p = P.get(L.lane);
  if (!p) return;
  const side = Math.atan2(p.tok[1] - c.cy, p.tok[0] - c.cx);
  const spot = labelSpot(`${L.ev.run}|${L.ev.ts}|${L.ev.k}|${L.ev.t}`, side, others);
  if (L.age < 1.2) others.push(spot);
  const sx = c.cx + spot.dx * c.R, sy = c.cy + spot.dy * c.R;
  const color = tintOf(L.lane), a = L.age, edit = L.ev.k === 'edit', u1 = 1 / VIEW.k;
  if (a < 1.2 && sx < c.clipX) {
    const alpha = Math.min(1, a / 0.2) * (a > 0.9 ? 1 - (a - 0.9) / 0.3 : 1);
    const scale = (a > 0.9 ? 1 - ((a - 0.9) / 0.3) * 0.7 : 1) * u1, text = labelText(L.ev);
    ctx.save();
    ctx.translate(sx, sy); ctx.scale(scale, scale);
    ctx.font = `${edit ? '600 ' : ''}11px ui-monospace, Consolas, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 底色用这个文件所属模型的颜色（压在深底上，白字照样看得清），边框同色
    const w = ctx.measureText(text).width, x0 = -w / 2 - 5, bw = w + 10;
    ctx.fillStyle = `rgba(6,6,7,${0.82 * alpha})`; ctx.fillRect(x0, -8, bw, 16);
    ctx.fillStyle = color(0.42 * alpha); ctx.fillRect(x0, -8, bw, 16);
    ctx.strokeStyle = color(0.85 * alpha); ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, -7.5, bw - 1, 15);
    ctx.fillStyle = HI(alpha * 0.96);
    ctx.fillText(text, 0, 0.5);
    ctx.restore();
  }
  if (a > 0.9) {
    const u = Math.min(1, Math.max(0, (a - 1.05) / (FX_LIFE - 1.05)));
    const dx = p.tok[0] - sx, curve = [[sx, sy], [sx + dx * 0.35, sy], [p.tok[0] - dx * 0.3, p.tok[1]], p.tok];
    if (u < 1) { const [x, y] = cubicAt(curve, ease(u)); tintDot(x, y, edit ? 2.4 : 1.8, color); }
  }
}

// 文件名缩成的光点：整颗都是模型的颜色（外圈柔光、实心亮核，正中一点白）
function tintDot(x, y, r, color) {
  r *= FX.lw;
  ctx.fillStyle = color(0.28); ctx.beginPath(); ctx.arc(x, y, r * 3, 0, 6.283); ctx.fill();
  ctx.fillStyle = color(1); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.fillStyle = HI(0.75); ctx.beginPath(); ctx.arc(x, y, r * 0.4, 0, 6.283); ctx.fill();
}

// 说明框：Claude Code 续接几个席位（讨论第 2 轮交叉挑错）时，在核心网上方说明谁的方案交给了谁
function drawNotes(c, t) {
  // 有派发计划时交叉挑错由流程动效（08-life.js）画，这里只管没有计划记录的旧任务
  if (plansAt(t).some((p) => p.round > 1)) return;
  const cc = B.laneById.get('cc');
  const targets = [];
  let age = null;
  if (cc) for (let i = cc.events.length - 1; i >= 0; i--) {
    const ev = cc.events[i], a = ageOf(ev, t);
    if (a < 0) continue;
    if (a > 6) break;
    if (ev.k === 'dispatch' && /^resume\b/.test(ev.t || '') && ev.target) { targets.push(...ev.target); age = a; }
  }
  if (!targets.length) for (const lane of seatLanes(t)) for (const r of lane.runs) {
    const a = ageOf({ ts: r.started_at }, t);
    if ((r.round || 1) >= 2 && a >= 0 && a <= 6) { targets.push(lane.id); age = age == null ? a : Math.min(age, a); }
  }
  if (!targets.length) return;
  const round = Math.max(...targets.map((id) => latest(B.laneById.get(id))?.round || 2));
  const head = `ROUND ${round} · CROSS-CRITIQUE`, body = `anonymized round ${round - 1} plans → ${[...new Set(targets)].map(laneModel).join(', ')}`;
  ctx.save();
  ctx.globalAlpha = Math.min(1, age / 0.3, (6 - age) / 1.2);
  ctx.font = '8px ui-monospace, Consolas, monospace';
  const w = Math.min(c.clipX - 40, ctx.measureText(body).width + 16), x = Math.max(10, c.cx - w / 2), y = c.cy - c.R * 0.82;
  ctx.fillStyle = 'rgba(6,6,7,.9)'; ctx.fillRect(x, y, w, 28);
  ctx.strokeStyle = 'rgba(60,60,68,1)'; ctx.lineWidth = 0.6 * FX.lw; ctx.strokeRect(x, y, w, 28);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(92,92,102,1)'; ctx.font = '6px ui-monospace, Consolas, monospace'; ctx.fillText(head, x + 6, y + 8);
  ctx.fillStyle = HI(1); ctx.font = '8px ui-monospace, Consolas, monospace'; ctx.fillText(body, x + 6, y + 19, w - 12);
  ctx.restore();
}

// ---- 08-life.js
'use strict';
// 派发流程动效（世界坐标，画在光束上面）。都按记录里的时刻算"过去了几秒"，回放、停在某一刻都一样：
//  ① 建计划：Claude Code 产出框亮一圈，按席位顺序射出光点，把席位卡"拉"出来（卡片在光点到达时才淡入）
//  ② 准入闸：计划建好到 Claude Code 席交报告之间，刻度带入口有一道闸；报告封成六边形印记飞进产出框，闸随之打开
//  ③ 交叉挑错：上一轮各家的方案从产出框收回核心，褪成白色（匿名），再按各席续接的时刻分发出去
//  ④ 裁决：产出框里的观点变成光点，接受的汇进 Claude Code 产出框，部分接受的半亮，拒绝的落下散掉；一轮记完，产出框扫过一道光

const LIFE = { lead: 0.35, stagger: 0.18, comet: 0.9, seal: 0.9 };
const arriveAt = (i) => LIFE.lead + i * LIFE.stagger + LIFE.comet; // 第 i 席的光点到卡片时，离建计划过去几秒
const seatTint = (s) => (a) => rgba(avatarFor(s.model, null), a);
const rowOf = (L, plan, seat) => L.rows.get(seatLaneId(plan, seat));

// 字号按屏幕固定的小标签（深底）
function hudText(text, x, y, color, a, size = 10.5, align = 'center') {
  if (a <= 0.01) return;
  ctx.save();
  ctx.translate(x, y); ctx.scale(1 / VIEW.k, 1 / VIEW.k); ctx.globalAlpha = Math.min(1, a);
  ctx.font = `${size}px ui-monospace, Consolas, monospace`; ctx.textBaseline = 'middle'; ctx.textAlign = align;
  const w = ctx.measureText(text).width, left = align === 'right' ? -w : align === 'left' ? 0 : -w / 2;
  ctx.fillStyle = 'rgba(7,7,9,.8)'; ctx.fillRect(left - 6, -size * 0.85, w + 12, size * 1.7);
  ctx.fillStyle = color; ctx.fillText(text, 0, 0.5);
  ctx.restore();
}

// 一颗带尾巴的光点沿曲线走：u 是头的位置（0–1），尾巴往回拖
function comet(q, u, color, size = 2.4, tail = 9) {
  for (let k = tail; k >= 0; k--) {
    const uu = u - k * 0.028;
    if (uu < 0 || uu > 1) continue;
    const [x, y] = cubicAt(q, ease(uu));
    glowDot(x, y, size * (1 - k / (tail + 2)), color, (1 - k / (tail + 1)) * (k ? 0.55 : 1));
  }
}

function ring(x, y, u, color, r0 = 6, r1 = 34) {
  if (u < 0 || u > 1) return;
  ctx.strokeStyle = color(0.8 * (1 - u)); ctx.lineWidth = (1.6 - u) * FX.lw;
  ctx.beginPath(); ctx.arc(x, y, r0 + (r1 - r0) * ease(u), 0, 6.283); ctx.stroke();
}

// 刚建好计划时卡片和产出框的淡入（光点到达时才出现）：车道 id → { card, out } 两个 0–1 的系数
function arrivals(t) {
  const out = new Map();
  for (const p of plansAt(t)) {
    const age = secSince(p.ev.ts, t);
    if (age > arriveAt(p.seats.length) + 1) continue;
    p.seats.forEach((s, i) => out.set(seatLaneId(p.id, s.seat), { card: clamp01((age - arriveAt(i)) / 0.35), out: clamp01((age - arriveAt(i) - 0.3) / 0.35) }));
  }
  // 不是按计划第 1 轮拉出来的：没有计划的任务由 Claude Code 产出框射出的光点拉出来（drawDispatchBirth），
  // 讨论续接（离开后下一轮回来的）在交叉挑错的光点送到时淡入
  for (const e of dispatchEntries(t)) {
    if (out.has(e.lane.id)) continue;
    const lag = e.plan ? -0.15 : LIFE.comet;
    out.set(e.lane.id, { card: clamp01((e.age - lag) / 0.35), out: clamp01((e.age - lag - 0.3) / 0.35) });
  }
  return out;
}

// 最近两秒内进场、又不是按计划第 1 轮拉出来的席位
function dispatchEntries(t) {
  const list = [];
  for (const lane of B.lanes) {
    if (lane.id === 'cc') continue;
    const at = enteredAt(lane, t), r = runAt(lane, t);
    if (at == null || r.plan && (r.round || 1) === 1) continue;
    const age = secSince(at, t);
    if (age >= 0 && age < LIFE.comet + 1.2) list.push({ lane, age, plan: !!r.plan });
  }
  return list;
}

// 没有计划的任务：Claude Code 的产出框收成光点，射出一颗光点把这一席的卡片拉出来
function drawDispatchBirth(L, t) {
  const box = L.ccOut, sx = box.x + box.w / 2, sy = box.y + box.h / 2;
  for (const e of dispatchEntries(t)) {
    const row = L.rows.get(e.lane.id);
    if (e.plan || !row) continue;
    const c = row.card, ex = c.x + c.w, ey = c.y + c.h / 2, color = tintOf(e.lane.id);
    const q = [[sx, sy], [sx - 150, sy + 30], [ex + 220, ey], [ex, ey]], u = (e.age - LIFE.lead * 0.5) / LIFE.comet;
    if (u > 0 && u <= 1) { strokeCubic(q); ctx.strokeStyle = color(0.16 * (1 - u)); ctx.lineWidth = 1.2 * FX.lw; ctx.stroke(); comet(q, u, color); }
    ring(ex, ey, (u - 1) / 0.45, color);
  }
}

// 离开的组（结果都被 Claude Code 读走了）：卡片溶解成一团模型颜色的光点，先散开一点，再沿弧线飞进 Claude Code 卡片，
// 到的时候 Claude Code 卡片的入口亮一下
function drawLeave(L) {
  const cc = L.cc, port = [cc.x + cc.w, cc.y + cc.h * 0.5];
  let arrive = 0;
  for (const g of L.groups) {
    if (!g.leave || g.collapsed) continue;
    const k = clamp01(g.leave);
    for (const lane of g.lanes) {
      const row = L.rows.get(lane.id);
      if (!row || lane.ghost) continue;
      const c = row.card, color = tintOf(lane.id), rand = rng(hash(`leave|${lane.id}`));
      if (k < 0.25) { ctx.strokeStyle = color(0.8 * (1 - k / 0.25)); ctx.lineWidth = 1.5 * FX.lw; ctx.strokeRect(c.x, c.y, c.w, c.h); }
      for (let i = 0; i < 34; i++) {
        const x0 = c.x + rand() * c.w, y0 = c.y + rand() * c.h, delay = rand() * 0.3, s = 1.1 + rand() * 1.8, lift = 30 + rand() * 70;
        const sx = x0 + (rand() - 0.5) * 40, sy = y0 + (rand() - 0.5) * 30, flash = rand();
        const u = clamp01((k - delay) / (1 - delay)), e = ease(u);
        // 前 20% 原地散开，之后沿二次曲线飞向 Claude Code 卡片的入口（控制点在两头中间偏上，划出一道弧）
        const spread = clamp01(u / 0.2), fly = ease(clamp01((u - 0.2) / 0.8));
        const ax = x0 + (sx - x0) * spread, ay = y0 + (sy - y0) * spread, mx = (ax + port[0]) / 2, my = Math.min(ay, port[1]) - lift;
        const x = (1 - fly) ** 2 * ax + 2 * (1 - fly) * fly * mx + fly ** 2 * port[0], y = (1 - fly) ** 2 * ay + 2 * (1 - fly) * fly * my + fly ** 2 * port[1];
        const a = (0.5 + 0.5 * flash) * row.vis * (u < 1 ? 1 - 0.6 * e ** 4 : 0);
        if (a <= 0) continue;
        if (i % 5 === 0) glowDot(x, y, s * (1 - 0.4 * fly), color, a);
        else { ctx.fillStyle = i % 4 ? color(a) : HI(a); ctx.beginPath(); ctx.arc(x, y, s * (1 - 0.4 * fly) * FX.lw, 0, 6.283); ctx.fill(); }
      }
    }
    arrive = Math.max(arrive, k);
  }
  if (arrive > 0.6) ring(port[0], port[1], (arrive - 0.6) / 0.4, tintOf('cc'), 6, 40);
}

// ① 建计划
function drawPlanBirth(p, L, t) {
  // Claude Code 的产出框这时正缩成一颗大光点（08-outlife.js），光点从它中心射出去
  const age = secSince(p.ev.ts, t), box = L.ccOut;
  if (age < 0 || age > arriveAt(p.seats.length) + 0.8) return;
  hudText(TEXT.plan(p.module, p.ev.cell || '', p.seats.length), box.x + box.w / 2, box.y - 14, HI(0.95), clamp01(age / 0.2) * clamp01((arriveAt(p.seats.length) + 0.8 - age) / 0.6));
  p.seats.forEach((s, i) => {
    const row = rowOf(L, p.id, s.seat);
    if (!row) return;
    const c = row.card, ex = c.x + c.w, ey = c.y + c.h / 2, sx = box.x + box.w / 2, sy = box.y + box.h / 2;
    const q = [[sx, sy], [sx - 150, sy + 30], [ex + 220, ey], [ex, ey]], u = (age - LIFE.lead - i * LIFE.stagger) / LIFE.comet, color = seatTint(s);
    if (u > 0 && u <= 1) {
      strokeCubic(q); ctx.strokeStyle = color(0.16 * (1 - u)); ctx.lineWidth = 1.2 * FX.lw; ctx.stroke();
      comet(q, u, color);
    }
    ring(ex, ey, (u - 1) / 0.45, color);
  });
}

// ② 准入闸和 Claude Code 席的报告印记
function hexPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; ctx[i ? 'lineTo' : 'moveTo'](x + r * Math.cos(a), y + r * Math.sin(a)); }
  ctx.closePath();
}

function drawGate(p, L, t) {
  if (!p.ev.host) return;
  const h1 = p.hosts.find((h) => (h.round || 1) === 1), open = h1 ? secSince(h1.started_at, t) - LIFE.seal : -1;
  if (open > 1.2) return;
  const rows = p.seats.map((s) => rowOf(L, p.id, s.seat)).filter(Boolean);
  if (!rows.length) return;
  const last = rows[rows.length - 1].card, y0 = rows[0].card.y - 4, y1 = last.y + last.h + 4, x = L.band.x - 58, mid = (y0 + y1) / 2; // 刻度数字左边
  const fall = clamp01(secSince(p.ev.ts, t) / 0.6), u = open < 0 ? 0 : ease(clamp01(open / 1.2)), a = (open < 0 ? 0.55 + 0.2 * Math.sin(performance.now() / 300) : 1 - u) * fall;
  const half = (mid - y0) * fall, shift = u * (mid - y0);
  ctx.save();
  for (const [from, dir] of [[mid, -1], [mid, 1]]) {
    const top = from + dir * shift, bot = top + dir * half;
    // 两道竖栏（先画一遍宽而淡的当光晕）和横档
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.moveTo(x - 5, top); ctx.lineTo(x - 5, bot);
    ctx.strokeStyle = HI(a * 0.12); ctx.lineWidth = 6 * FX.lw; ctx.stroke();
    ctx.strokeStyle = HI(a * 0.85); ctx.lineWidth = 1.8 * FX.lw; ctx.stroke();
    ctx.strokeStyle = HI(a * 0.5); ctx.lineWidth = 1.2 * FX.lw; ctx.beginPath();
    for (let y = top; dir < 0 ? y > bot : y < bot; y += dir * 8) { ctx.moveTo(x - 9, y); ctx.lineTo(x + 4, y); }
    ctx.stroke();
  }
  if (open < 0) {
    ctx.fillStyle = 'rgba(7,7,9,.9)'; ctx.fillRect(x - 9, mid - 6, 14, 12);
    ctx.strokeStyle = HI(a); ctx.lineWidth = FX.lw; ctx.strokeRect(x - 7, mid - 2, 10, 8);
    ctx.beginPath(); ctx.arc(x - 2, mid - 2, 3, Math.PI, 0); ctx.stroke();
  }
  ctx.restore();
  hudText(open < 0 ? TEXT.gateWaiting : TEXT.gateOpen, x - 16, mid, HI(0.9), (open < 0 ? 1 : 1 - u) * fall, 10.5, 'right');
}

function drawSeal(h, L, t) {
  const age = secSince(h.started_at, t);
  if (age < 0 || age > LIFE.seal + 0.7) return;
  const cc = L.cc, box = L.ccOut, from = [cc.x + cc.w + 14, cc.y + cc.h * 0.3], to = [box.x + 14, box.y + box.h / 2], color = tintOf('cc');
  const q = [from, [from[0] + 180, from[1] - 220], [to[0] - 420, to[1] + 40], to];
  const grow = clamp01(age / 0.25), u = clamp01((age - 0.25) / (LIFE.seal - 0.25)), [x, y] = age < 0.25 ? from : cubicAt(q, ease(u));
  if (age <= LIFE.seal) {
    if (u > 0) { strokeCubic(q); ctx.strokeStyle = color(0.18 * (1 - u)); ctx.lineWidth = FX.lw; ctx.stroke(); }
    const r = 9 * ease(grow) * FX.lw;
    ctx.fillStyle = color(0.25); hexPath(x, y, r * 1.8); ctx.fill();
    ctx.fillStyle = 'rgba(10,10,12,.9)'; hexPath(x, y, r); ctx.fill();
    ctx.strokeStyle = color(1); ctx.lineWidth = 1.4 * FX.lw; hexPath(x, y, r); ctx.stroke();
    ctx.strokeStyle = HI(0.85); ctx.lineWidth = 0.7 * FX.lw;
    for (const k of [0.3, 0.55]) { ctx.beginPath(); ctx.arc(x, y + r * 0.15, r * k, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    hudText(TEXT.hostSealed(h.round || 1), x, y - 22 * FX.lw, color(1), grow * (1 - u * 0.6));
  }
  ring(to[0], to[1], (age - LIFE.seal) / 0.6, color, 4, 26);
}

// ③ 交叉挑错：第 R 轮从 Claude Code 席交报告的时刻起算（没有就从最早续接的前一点起算）
function drawShuffle(p, L, t) {
  const c = L.core, speed = B.clock.mode === 'replay' ? B.clock.speed : 1;
  for (let R = 2; R <= p.round; R++) {
    const host = p.hosts.find((h) => (h.round || 1) === R), resumes = p.runs.filter((r) => (r.round || 1) === R);
    if (!resumes.length && !host) continue;
    const anchor = host ? host.started_at : Math.min(...resumes.map((r) => r.started_at)) - 2.4 * 1000 * speed, a = secSince(anchor, t);
    const arrive = resumes.map((r) => Math.max(2.4, (r.started_at - anchor) / 1000 / speed));
    if (a < 0 || a > Math.max(2.6, ...arrive) + 0.6) continue;
    // 来源：上一轮各席的方案已经被 Claude Code 读走了，所以都从 Claude Code 卡片出来（它自己的也匿名混进去）
    const src = p.seats.map(seatTint);
    if (p.ev.host) src.push(tintOf('cc'));
    const n = src.length, cc = L.cc, port = [cc.x + cc.w, cc.y + cc.h * 0.72];
    src.forEach((col, j) => {
      const q = [port, [port[0] + 120, port[1] + (j - n / 2) * 14], [c.cx - c.R * 0.35, c.cy + 40], [c.cx, c.cy]];
      const u = (a - j * 0.06) / 1.0;
      if (u > 0 && u < 1) comet(q, u, col, 2.2, 6);
      if (a >= 1 && a < 2.4) {
        const m = clamp01((a - 1) / 0.8), ang = (j / n) * 6.283 + (a - 1) * 3.2, rad = (16 + 10 * Math.sin(a * 2 + j)) * FX.lw;
        const x = c.cx + Math.cos(ang) * rad, y = c.cy + Math.sin(ang) * rad;
        glowDot(x, y, 2.2, col, 1 - m); glowDot(x, y, 2.2, HI, m);
      }
    });
    hudText(TEXT.crossCheck(R, String.fromCharCode(64 + n)), c.cx, c.cy - 44 * FX.lw, HI(0.95), clamp01((a - 0.9) / 0.3) * clamp01((Math.max(...arrive, 2.4) + 0.4 - a) / 0.5));
    resumes.forEach((r, i) => {
      const row = L.rows.get(r.lane || r.id);
      if (!row) return;
      const port = [row.card.x, row.card.y + row.card.h * 0.72], dep = arrive[i] - 0.8, u = (a - dep) / 0.8;
      const q = [[c.cx, c.cy], [c.cx + c.R * 0.45, c.cy], [port[0] - 160, port[1]], port];
      for (let k = 0; k < n - 1; k++) { const uu = u - k * 0.07; if (uu > 0 && uu < 1) { const [x, y] = cubicAt(q, ease(uu)); glowDot(x, y, k ? 1.6 : 2.3, HI, 1); } }
      ring(port[0], port[1], (u - 1) / 0.5, HI, 4, 22);
    });
  }
}

// ④ 裁决和决策记录：各席的方案已经在 Claude Code 手里，观点从 Claude Code 卡片顶上出发——
// 接受的带着那一席的颜色升进 Claude Code 的产出框（决策记录），部分接受的半亮，拒绝的走到半路落下散掉
function drawJudge(p, L, t) {
  const box = L.ccOut, cc = L.cc;
  let flash = 0;
  for (const v of p.verdicts) {
    const age = secSince(v.ts, t);
    if (age < 0 || age > 2.8) continue;
    const color = tintOf(v.lane), items = [...v.a.map(() => 'a'), ...v.p.map(() => 'p'), ...v.r.map(() => 'r')];
    items.forEach((kind, j) => {
      const u = (age - 0.1 - j * 0.09) / 1.1;
      if (u < 0 || u > 1) return;
      const sx = cc.x + 20 + (j * 19) % (cc.w - 40), tx = box.x + 14 + (j * 23) % (box.w - 28), ty = box.y + box.h / 2;
      const q = [[sx, cc.y], [sx, cc.y - Math.max(80, cc.y - box.y) * 0.8], [tx - 260, ty], [tx, ty]];
      if (kind === 'r') {
        if (u < 0.35) { comet(q, u, (a) => `rgba(150,150,160,${a})`, 1.6, 3); return; }
        const [x0, y0] = cubicAt(q, ease(0.35)), w = (u - 0.35) / 0.65;
        ctx.fillStyle = `rgba(150,150,160,${(0.8 * (1 - w)).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(x0 + (j % 2 ? 1 : -1) * w * 16, y0 + ease(w) * 80, 1.8 * FX.lw * (1 - w * 0.5), 0, 6.283); ctx.fill();
        return;
      }
      comet(q, u, color, kind === 'a' ? 2.3 : 1.5, kind === 'a' ? 6 : 3);
      if (u > 0.92) flash = Math.max(flash, 1);
    });
  }
  if (flash) { ctx.strokeStyle = HI(0.5); ctx.lineWidth = 1.5 * FX.lw; ctx.strokeRect(box.x - 2, box.y - 2, box.w + 4, box.h + 4); }
  if (p.record == null) return;
  const a = secSince(p.record, t) - 1.2;
  if (a < 0 || a > 1.8) return;
  const x = box.x + box.w * ease(clamp01(a / 1.0)), fade = clamp01((1.8 - a) / 0.6);
  const g = ctx.createLinearGradient(x - 24, 0, x, 0);
  g.addColorStop(0, HI(0)); g.addColorStop(1, HI(0.35 * fade));
  ctx.fillStyle = g; ctx.fillRect(Math.max(box.x, x - 24), box.y, Math.min(24, x - box.x), box.h);
  ctx.strokeStyle = HI(0.9 * fade); ctx.lineWidth = 1.2 * FX.lw; ctx.beginPath(); ctx.moveTo(x, box.y - 3); ctx.lineTo(x, box.y + box.h + 3); ctx.stroke();
  hudText(TEXT.decisionWritten, box.x + box.w / 2, box.y - 14, HI(0.95), fade);
}

// Claude Code 卡片离场（04-life.js 的 ccAway）：前 40% 卡片缩小淡掉，中心聚起一颗光点；后 60% 光点拖着尾巴沿弧线飞进
// 弧线区中央的亮核，到的时候亮核那里散开一圈。回来时倒着放：亮核亮一圈，光点飞到卡片的位置，再长成卡片
function drawCcAway(L) {
  const k = L.ccAway || 0;
  if (k <= 0 || k >= 1) return;
  const c = L.cc, sx = c.x + c.w / 2, sy = c.y + c.h / 2, ex = L.core.cx, ey = L.core.cy, color = tintOf('cc');
  const shrink = clamp01(k / 0.4), fly = clamp01((k - 0.4) / 0.6);
  if (fly <= 0) { glowDot(sx, sy, 1.6 + 2.4 * shrink, color, shrink); return; }
  // 离开时从卡片飞向亮核，回来时从亮核飞向卡片：尾巴总在头的后面
  const out = [[sx, sy], [sx + 70, sy - 110], [ex - 140, ey - 90], [ex, ey]];
  const q = L.ccLeaving ? out : [...out].reverse(), u = L.ccLeaving ? fly : 1 - fly;
  comet(q, u, color, 4 - 1.6 * fly, 12);
  ring(ex, ey, (L.ccLeaving ? fly - 0.8 : 1 - fly) / 0.2, color, 4, 46);
}

function drawLife(L, t) {
  drawDispatchBirth(L, t);
  drawLeave(L);
  drawCcAway(L);
  for (const p of plansAt(t)) {
    drawGate(p, L, t);
    drawPlanBirth(p, L, t);
    for (const h of p.hosts) drawSeal(h, L, t);
    drawShuffle(p, L, t);
    drawJudge(p, L, t);
  }
}

// 刻度带跟着席位卡出现：没有派出任何席位时不画；第一张卡快到时从中间往上下展开（0–1）。
// 按计划拉出来的卡以光点到达的时刻为准，没有计划记录的任务以它启动的时刻为准
function bandReveal(L, t) {
  if (!L.rows.size) return 0;
  let a = 0;
  for (const g of L.groups) for (const lane of g.lanes) {
    const run = lane.ghost ? null : lane.runs[0], planId = lane.ghost ? lane.plan : run && run.plan;
    const ev = planId && B.life.find((e) => e.k === 'fplan' && e.plan === planId);
    const i = ev ? (ev.seats || []).findIndex((s) => s.seat === (lane.ghost ? lane.seat.seat : run.seat)) : -1;
    const since = ev && i >= 0 ? secSince(ev.ts, t) - arriveAt(i) + 0.45 : secSince(laneT0(lane), t);
    a = Math.max(a, clamp01(since / 0.45));
    if (a >= 1) return 1;
  }
  return a;
}

// ---- 08-outbeam.js
'use strict';
// 产出光路（卡片 → 产出框）的几种样式。光路由两条边界曲线 E0、E1 围成（卡片一端宽、产出框一端窄），
// 各样式在这个形状里画；只有对话活跃时才流动，产出事件（ages）让一道亮带从卡片扫到产出框。

const OUT_STYLES = [
  ['fibers', '光纤'], ['particles', '粒子流'], ['tube', '光管'], ['curtain', '光幕'], ['rays', '放射线'],
];
// 选定的样式是粒子流；URL 里的 out= 仍可临时换成别的样式做对比
const OUT = { style: new URLSearchParams(location.search).get('out') || 'particles' };

const lerp2 = (a, b, v) => [a[0] + (b[0] - a[0]) * v, a[1] + (b[1] - a[1]) * v];
const lerpCurve = (E0, E1, v) => E0.map((p, i) => lerp2(p, E1[i], v));
const at = (E0, E1, u, v) => lerp2(cubicAt(E0, u), cubicAt(E1, u), v);
// 粒子流通道里的细弧线：九条，两端固定在通道里的同一位置，中间两个控制点慢慢起伏、互相交错。
// 起伏按通道宽度的比例算（在两条边之间的位置 v 上摆动），通道横着展开（Claude Code 从卡片顶边出来）也一样起伏
const FIBERS = 9;
function fiber(E0, E1, f, sec) {
  const v = (f + 0.5) / FIBERS, v1 = v + 0.45 * Math.sin(sec * 0.45 + f * 1.7), v2 = v + 0.6 * Math.sin(sec * 0.36 + f * 2.9);
  return [lerp2(E0[0], E1[0], v), lerp2(E0[1], E1[1], v1), lerp2(E0[2], E1[2], v2), lerp2(E0[3], E1[3], v)];
}

// 产出脉冲（粒子流）：每条细弧线上亮起一截光束，白色的芯、外面一圈淡淡的车道颜色，尾巴渐隐，很快沿弧线跑到产出框。
// 各条线的出发时刻、光束长短和亮度都略有不同（按车道定，每次一样），不是齐刷刷的一排
const STREAK = { dur: 0.85, len: 0.2, n: 10 };
function drawStreaks(E0, E1, color, age, sec, seed) {
  const g = glowCtx(), soft = g !== ctx, rand = rng(seed + 17);
  g.save(); ctx.save();
  for (let f = 0; f < FIBERS; f++) {
    const q = fiber(E0, E1, f, sec), lag = 0.08 * rand(), len = STREAK.len * (0.55 + 0.9 * rand()), lit = 0.6 + 0.4 * rand();
    const head = ease(clamp01((age / STREAK.dur - lag) / (1 - 0.08))) * (1 + len), tail = head - len;
    if (head <= 0 || tail >= 1) continue;
    const u0 = Math.max(0, tail), u1 = Math.min(1, head), fade = lit * (1 - clamp01((tail - 0.75) / 0.25));
    const pts = [];
    for (let i = 0; i <= STREAK.n; i++) pts.push(cubicAt(q, u0 + (u1 - u0) * i / STREAK.n));
    const trace = (c) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); };
    // 外圈：车道颜色的柔光（有辉光层时画进辉光层）
    trace(g); g.strokeStyle = color((soft ? 0.2 : 0.1) * fade); g.lineWidth = (soft ? 4 : 2.8) * FX.lw; g.lineCap = 'round'; g.stroke();
    // 芯：从尾巴的透明经淡淡的车道颜色到头上的白
    const [hx, hy] = pts[pts.length - 1], [tx, ty] = pts[0], grad = ctx.createLinearGradient(tx, ty, hx, hy);
    grad.addColorStop(0, HI(0)); grad.addColorStop(0.6, color(0.35 * fade)); grad.addColorStop(0.92, HI(0.8 * fade)); grad.addColorStop(1, HI(fade));
    trace(ctx); ctx.strokeStyle = grad; ctx.lineWidth = 1.5 * FX.lw; ctx.lineCap = 'round'; ctx.stroke();
  }
  ctx.restore(); g.restore();
}

function tracePath(E0, E1, n = 28) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const [x, y] = cubicAt(E0, i / n); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  for (let i = n; i >= 0; i--) { const [x, y] = cubicAt(E1, i / n); ctx.lineTo(x, y); }
  ctx.closePath();
}

function drawOutBeam(E0, E1, color, I, live, seed, ages) {
  const style = OUT.style, act = 0.2 + (0.3 + 0.5 * I) * live, sec = performance.now() / 1000, flow = flowPhase(`out|${seed}`, 0.18 + 0.5 * I);
  const a0 = E0[0], a1 = E0[3];
  ctx.save();
  if (style === 'rays') {
    const paths = [];
    for (let i = 0; i < 13; i++) paths.push(lerpCurve(E0, E1, (i + 0.5) / 13));
    drawCone(paths, color, I, live, seed, []);
  } else if (style === 'fibers') {
    // 五条光纤：最外两条贴着边，中间三条；柔光 + 细线，活跃时光点沿纤维走
    for (let f = 0; f < 5; f++) {
      const q = lerpCurve(E0, E1, f / 4);
      const g = ctx.createLinearGradient(a0[0], a0[1], a1[0], a1[1]);
      g.addColorStop(0, HI(0.2 + 0.35 * act)); g.addColorStop(0.5, color(0.12 + 0.3 * act)); g.addColorStop(1, color(0.3 + 0.45 * act));
      strokeCubic(q);
      ctx.strokeStyle = color(0.05 + 0.1 * act); ctx.lineWidth = 4 * FX.lw; ctx.stroke();
      ctx.strokeStyle = g; ctx.lineWidth = 1.1 * FX.lw; ctx.stroke();
      if (live) for (let j = 0; j < 2; j++) {
        const u = ((flow * (0.8 + f * 0.07) + f * 0.21 + j * 0.5) % 1);
        const [x, y] = cubicAt(q, u);
        glowDot(x, y, 1.6 + 0.8 * I, color, Math.min(1, u * 6, (1 - u) * 6));
      }
    }
  } else if (style === 'particles') {
    // 星河：通道里几条像核心网那样的细弧线（慢慢起伏、互相交错），上面漂着放慢的光点；没有输出时整条通道不画
    // 有多少：强度定粒子数，边界上那一颗按小数部分半透明；整条通道再乘上活跃程度和"有没有输出"，淡入淡出而不是整批出现
    const rand = rng(seed), want = 20 + 32 * I, pres = clamp01(I / 0.06) * live, n = pres > 0.005 ? Math.ceil(want) : 0, drift = flowPhase(`cloud|${seed}`, 0.05 + 0.14 * I);
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * pres;
    if (n) {
      const g = ctx.createLinearGradient(a0[0], a0[1], a1[0], a1[1]);
      g.addColorStop(0, HI(0.08 + 0.2 * I)); g.addColorStop(0.5, color(0.12 + 0.26 * I)); g.addColorStop(1, color(0.16 + 0.34 * I));
      ctx.strokeStyle = g; ctx.lineWidth = 0.8 * FX.lw;
      for (let f = 0; f < FIBERS; f++) { strokeCubic(fiber(E0, E1, f, sec)); ctx.stroke(); }
    }
    for (let i = 0; i < n; i++) {
      const v = 0.08 + rand() * 0.84, ph = rand(), sp = 0.6 + rand() * 0.8;
      const u = (drift * sp + ph) % 1, [x, y] = at(E0, E1, u, v + Math.sin(sec * 2 + ph * 9) * 0.03);
      const a = Math.min(1, u * 5, (1 - u) * 5) * (0.5 + 0.5 * act) * clamp01(want - i);
      ctx.fillStyle = i % 3 ? color(0.7 * a) : HI(0.75 * a);
      const r = (1.3 + rand() * 1.3) * FX.lw;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      // 每三颗里有一颗带一圈淡淡的柔光，远看也看得出在流动；不要太亮，几条光路叠在一起会糊成一片
      if (i % 3 === 0) { const g = glowCtx(), soft = g !== ctx; g.fillStyle = color((soft ? 0.16 : 0.08) * a); g.beginPath(); g.arc(x, y, r * (soft ? 2.8 : 2.4), 0, 6.283); g.fill(); }
    }
    ctx.globalAlpha = ga;
  } else if (style === 'tube') {
    // 光管：一道柔和的锥形光，中间一条亮芯，活跃时光点沿亮芯流动
    tracePath(E0, E1);
    const g = ctx.createLinearGradient(a0[0], a0[1], a1[0], a1[1]);
    g.addColorStop(0, HI(0.03 + 0.05 * act)); g.addColorStop(0.5, color(0.04 + 0.06 * act)); g.addColorStop(1, color(0.1 + 0.14 * act));
    ctx.fillStyle = g; ctx.fill();
    const core = lerpCurve(E0, E1, 0.5);
    strokeCubic(core);
    ctx.strokeStyle = color(0.08 + 0.16 * act); ctx.lineWidth = 7 * FX.lw; ctx.stroke();
    ctx.strokeStyle = HI(0.25 + 0.5 * act); ctx.lineWidth = 1.2 * FX.lw; ctx.stroke();
    if (live) for (let j = 0; j < 3; j++) {
      const u = (flow + j / 3) % 1, [x, y] = cubicAt(core, u);
      glowDot(x, y, 2 + I, color, Math.min(1, u * 6, (1 - u) * 6));
    }
  } else if (style === 'curtain') {
    // 光幕：渐变填充的漏斗，边缘两条细线；活跃时一道光泽从卡片扫向产出框
    tracePath(E0, E1);
    const g = ctx.createLinearGradient(a0[0], a0[1], a1[0], a1[1]);
    g.addColorStop(0, HI(0.06 + 0.06 * act)); g.addColorStop(0.6, color(0.06 + 0.1 * act)); g.addColorStop(1, color(0.14 + 0.2 * act));
    ctx.fillStyle = g; ctx.fill();
    if (live) {
      const s = (flow * 0.8) % 1, sh = ctx.createLinearGradient(a0[0], a0[1], a1[0], a1[1]);
      sh.addColorStop(Math.max(0, s - 0.12), HI(0)); sh.addColorStop(s, HI(0.12 + 0.18 * I)); sh.addColorStop(Math.min(1, s + 0.12), HI(0));
      ctx.fillStyle = sh; ctx.fill();
    }
    ctx.strokeStyle = color(0.25 + 0.35 * act); ctx.lineWidth = 0.8 * FX.lw;
    strokeCubic(E0); ctx.stroke(); strokeCubic(E1); ctx.stroke();
  }
  // 产出脉冲：从卡片走到产出框；粒子流里每条细弧线亮起一截光束跑过去，其他样式是一道横跨光路的亮带
  for (const age of ages) {
    if (style === 'particles') { drawStreaks(E0, E1, color, age, sec, seed); continue; }
    const u = ease(Math.min(1, age / 1.3)), a = 1 - Math.min(1, age / 1.3);
    const [x0, y0] = cubicAt(E0, u), [x1, y1] = cubicAt(E1, u);
    ctx.strokeStyle = HI(0.9 * a); ctx.lineWidth = 1.8 * FX.lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
}

// ---- 08-outlife.js
'use strict';
// 产出框的光效（显隐阶段见 04-life.js 的 outLife / ccLife）：
//  汇聚：框还没出现时，产出框的位置有一团光，越汇越大，周围绕着几颗小光点，粒子通道收进这团光里
//  展开：有了实际输出，一个亮框从光团里撑开到产出框的大小
//  收起：被读走时框缩成一颗大光点——席位的飞进 Claude Code 卡片；Claude Code 的在用户发下一条消息时往上飞走，
//        建了派发计划时就地化开，分成拉起席位卡的那几道光（08-life.js 的建计划动效）

const anchorOf = (box) => [box.x + 18, box.y + box.h / 2];
const clusterR = (grow) => 3 + 10 * grow;

// 一团正在汇聚的光：柔光、亮核、绕圈的小光点
function drawCluster(x, y, grow, color, seed) {
  const r = clusterR(grow) * FX.lw, sec = performance.now() / 1000, rand = rng(seed);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.8);
  g.addColorStop(0, color(0.3 + 0.2 * grow)); g.addColorStop(0.3, color(0.1 + 0.08 * grow)); g.addColorStop(1, color(0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.8, 0, 6.283); ctx.fill();
  ctx.fillStyle = HI(0.7); ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, 6.283); ctx.fill();
  for (let i = 0, n = 5 + Math.round(9 * grow); i < n; i++) {
    const ang = rand() * 6.283 + sec * (0.6 + rand() * 0.9) * (i % 2 ? 1 : -1), d = r * (0.9 + rand() * 1.6);
    glowDot(x + Math.cos(ang) * d, y + Math.sin(ang) * d * 0.7, 0.9 + rand() * 0.7, color, 0.3 + 0.35 * rand());
  }
}

// 交接：框出现时光团不一下子消失，一边淡掉一边缩进框的左边（框同时从这里长出来，04-life.js 的 outLook）
function drawHandoff(box, life, color, seed) {
  const u = clamp01(life.age / OUT_HANDOFF);
  if (u >= 1) return;
  const e = ease(u), ga = ctx.globalAlpha;
  ctx.globalAlpha = ga * (1 - e);
  drawCluster(...anchorOf(box), (life.grow ?? 0.5) * (1 - 0.7 * e), color, seed);
  ctx.globalAlpha = ga;
}

// 亮框从光团撑开到框的大小
function drawUnfold(box, age, color) {
  const u = clamp01(age / 0.5);
  if (u >= 1) return;
  const [ax, ay] = anchorOf(box), e = ease(u);
  const x = ax + (box.x - ax) * e, y = ay + (box.y - ay) * e, w = (box.w) * e, h = box.h * e;
  ctx.strokeStyle = HI(0.9 * (1 - u)); ctx.lineWidth = (2 - u) * FX.lw; ctx.strokeRect(x, y, Math.max(1, w), Math.max(1, h));
  ctx.fillStyle = color(0.25 * (1 - u)); ctx.fillRect(x, y, Math.max(1, w), Math.max(1, h));
}

// 收起：0–0.35 秒框缩成一颗大光点；之后光点沿 path 飞走（path 为空就原地化开）
function drawCollapse(box, age, color, path) {
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2, grow = clamp01(age / 0.35);
  if (age < 0.35 || !path) {
    const fade = path ? 1 : clamp01(1 - (age - 0.35) / 0.6);
    if (fade <= 0) return;
    const r = (3 + 7 * ease(grow)) * FX.lw;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3);
    g.addColorStop(0, HI(0.95 * fade)); g.addColorStop(0.3, color(0.6 * fade)); g.addColorStop(1, color(0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 3, 0, 6.283); ctx.fill();
    return;
  }
  const u = (age - 0.35) / (OUT_COLLAPSE - 0.45);
  if (u <= 1) comet([[cx, cy], ...path.slice(1)], u, color, 4.2, 12);
  const end = path[3];
  ring(end[0], end[1], (u - 1) / 0.25 + 0.02, color, 8, 46);
}

function drawOutLife(L, P, t) {
  const ccCard = L.cc, ccIn = [ccCard.x + ccCard.w, ccCard.y + ccCard.h * 0.5];
  for (const g of L.groups) for (const lane of g.lanes) {
    const row = L.rows.get(lane.id);
    if (!row || lane.ghost || row.vis < 0.02) continue;
    const life = outLife(lane, t), color = tintOf(lane.id), box = row.out;
    ctx.globalAlpha = row.vis;
    if (life.phase === 'gather') drawCluster(...anchorOf(box), life.grow, color, lane.seed);
    else if (life.phase === 'show') { drawHandoff(box, life, color, lane.seed); drawUnfold(box, life.age, color); }
    else if (life.phase === 'collapse') {
      // 飞回 Claude Code 卡片：先往左上绕过刻度带，再落到卡片右边
      const c = [box.x + box.w / 2, box.y + box.h / 2];
      drawCollapse(box, life.age, color, [c, [box.x - 260, box.y - 120], [ccIn[0] + 320, ccIn[1] - 200], ccIn]);
    }
  }
  ctx.globalAlpha = L.ccDim; // 席位的产出框滚过来时，Claude Code 的产出框连同光效一起变暗
  const life = ccLife(t), box = L.ccOut, color = tintOf('cc');
  if (life.phase === 'gather') drawCluster(...anchorOf(box), life.grow, color, 77);
  else if (life.phase === 'show') { drawHandoff(box, life, color, 77); drawUnfold(box, life.age, color); }
  else if (life.phase === 'collapse') {
    const c = [box.x + box.w / 2, box.y + box.h / 2], top = (L.vis ? L.vis.top : 0) - 80;
    // 建计划时化成拉起席位的光、安静收起时就地散开；用户发下一条消息时往上飞走
    drawCollapse(box, life.age, color, life.kind === 'plan' || life.kind === 'quiet' ? null : [c, [c[0], c[1] - 40], [c[0] + 30, top + 60], [c[0] + 40, top]]);
  }
  ctx.globalAlpha = 1;
}

// 粒子通道收在哪里：框在时收进框的左边（整个高度），框不在时收进那团光
function outTarget(box, life) {
  if (life.phase === 'show') return { x: box.x + 2, y: box.y + box.h / 2, half: box.h / 2 - 2, box: true };
  const [x, y] = anchorOf(box);
  return { x, y, half: clusterR(life.grow || 0.3) * 0.8, box: false };
}

// ---- 08-smooth.js
'use strict';
// 统一平滑：光路的显隐、亮度、宽度和终点不再按开/关直接切换，而是每帧往目标值靠过去（约 0.8 秒走完九成）。
// 时间突然跳的时候（?t= 停在固定时刻、刚打开页面、回放跳时间、画布停画了一阵）直接取目标值，截图和定位不受影响。

const SMOOTH = { vals: new Map(), lastT: null, lastMs: 0, k: 1 };

// 流动和旋转的相位按帧累加（速度 × 这一帧隔了多久）。直接用"时间 × 当前速度"的话，
// 时间是几千秒，速度稍微变小相位就往回退一大截，看上去就是倒流、倒转
const FLOW = new Map();
function flowPhase(key, speed) {
  const ms = performance.now(), f = FLOW.get(key);
  if (!f) { FLOW.set(key, { ms, p: 0 }); return 0; }
  f.p += speed * Math.min(0.1, (ms - f.ms) / 1000); // 画布停画了一阵再回来时不跳
  f.ms = ms;
  return f.p;
}
const SMOOTH_TAU = 0.35; // 秒：时间常数，越大过渡越慢

// 每次画画布前调用：按这一帧和上一帧隔了多久算靠拢的比例
function smoothFrame(t) {
  const ms = performance.now(), dt = SMOOTH.lastMs ? (ms - SMOOTH.lastMs) / 1000 : Infinity;
  // 记录时间走得和墙上时间对不上（不是连续播放），或者两帧隔太久，就当成跳了
  const jump = SMOOTH.lastT == null || B.clock.frozenAt != null || dt > 0.5 || Math.abs(secSince(SMOOTH.lastT, t) - dt) > 1;
  SMOOTH.k = jump ? 1 : 1 - Math.exp(-dt / SMOOTH_TAU);
  SMOOTH.lastT = t;
  SMOOTH.lastMs = ms;
}

// key 这个量的平滑值。第一次出现时从 from 开始（显隐类默认从 0 淡入；位置类传目标值本身，免得从原点飞过来）
function smooth(key, target, from = 0) {
  const v = SMOOTH.vals.has(key) ? SMOOTH.vals.get(key) : SMOOTH.k >= 1 ? target : from;
  const next = SMOOTH.k >= 1 ? target : v + (target - v) * SMOOTH.k;
  SMOOTH.vals.set(key, Math.abs(next - target) < 1e-4 ? target : next);
  return next;
}

// 位置：和 smooth 一样往目标靠，但一下跳得比 snap 还远的（刻度带绕圈时从顶上回到底下）直接到位
function smoothY(key, y, snap) {
  const v = SMOOTH.vals.get(key);
  if (v != null && Math.abs(v - y) > snap) { SMOOTH.vals.set(key, y); return y; }
  return smooth(key, y, y);
}

// 输出通道的终点（光团和输出框之间切换时）平滑挪过去。按相对产出框的位置平滑：刻度带滚动时框在动，
// 按绝对坐标平滑会拖在后面，卡片从顶上绕回底下时还会横扫过整个屏幕
function smoothTarget(id, tg, box) {
  const dx = smooth(`tgx|${id}`, tg.x - box.x, tg.x - box.x), dy = smooth(`tgy|${id}`, tg.y - box.y, tg.y - box.y);
  return { ...tg, x: box.x + dx, y: box.y + dy, half: smooth(`tgh|${id}`, tg.half, tg.half) };
}

// ---- 08-states.js
'use strict';
// 模块状态的画布动效（卡片上的边框和颜色在 06-states.js / board.css）：
//  排队等服务：三颗琥珀光点绕着卡片边框转；
//  失败（失败、额度用完、卡死、中断）：结束那一刻从卡片中心炸开一圈红色冲击波，带几颗火星；
//  被取消：灰色星尘从卡片上往上飘散。

const ST_AMBER = (a) => `rgba(255,186,90,${a})`, ST_RED = (a) => `rgba(255,92,80,${a})`, ST_GREY = (a) => `rgba(170,170,182,${a})`;
const FAIL_SEC = 1.8, CANCEL_SEC = 2.6, GAP_SEC = 1.6;

// 卡片边框上的一点：u 从 0 到 1 绕一圈
function perimeter(b, u) {
  const p = 2 * (b.w + b.h), d = (((u % 1) + 1) % 1) * p;
  if (d < b.w) return [b.x + d, b.y];
  if (d < b.w + b.h) return [b.x + b.w, b.y + d - b.w];
  if (d < 2 * b.w + b.h) return [b.x + b.w - (d - b.w - b.h), b.y + b.h];
  return [b.x, b.y + b.h - (d - 2 * b.w - b.h)];
}

function drawGapLaunch(L, lane, r, row, t) {
  const age = secSince(r.started_at, t);
  if (age < 0 || age >= GAP_SEC) return;
  const p = plansAt(t).find((x) => x.id === r.plan);
  if (!p) return;
  // 席位都在刻度带同一列里，卡片又在画布上层：从各席卡片右侧出发，往右绕出一段弧，再从右侧汇进补漏席
  const to = [row.card.x + row.card.w, row.card.y + row.card.h / 2], color = tintOf(lane.id);
  for (const s of p.seats) {
    if (s.seat === r.seat) continue;
    const from = L.rows.get(seatLaneId(p.id, s.seat));
    if (!from) continue;
    const a = [from.card.x + from.card.w, from.card.y + from.card.h / 2], reach = 70 + Math.abs(a[1] - to[1]) * 0.25;
    for (let k = 0; k < 7; k++) {
      const u = clamp01(age / GAP_SEC * 1.3 - k * 0.035), e = ease(u);
      if (u <= 0 || u >= 1) continue;
      const x = a[0] + (to[0] - a[0]) * e + Math.sin(e * Math.PI) * reach, y = a[1] + (to[1] - a[1]) * e;
      glowDot(x, y, 3.2 - k * 0.35, color, 1 - k * 0.13);
    }
  }
  if (age > GAP_SEC * 0.75) ring(to[0] - row.card.w / 2, to[1], (age - GAP_SEC * 0.75) / (GAP_SEC * 0.25), color, 8, 70);
}

function drawStates(L, t) {
  const sec = performance.now() / 1000;
  for (const g of L.groups) for (const lane of g.lanes) {
    if (lane.ghost) continue;
    const row = L.rows.get(lane.id);
    if (!row || row.vis < 0.02) continue;
    const live = lane.runs.filter((x) => x.started_at <= t && x.kind !== 'answer'), r = live[live.length - 1], fate = fateAt(lane, r, t);
    if (r && GAP_ROLE.test(r.role || '') && fate !== 'queued') drawGapLaunch(L, lane, r, row, t);
    if (!fate || fate === 'running' || fate === 'done') continue;
    const b = row.card, cx = b.x + b.w / 2, cy = b.y + b.h / 2, rand = rng(lane.seed);
    ctx.globalAlpha = row.vis * (1 - (row.leave || 0));
    if (fate === 'queued') {
      for (let i = 0; i < 3; i++) {
        const [x, y] = perimeter(b, sec * 0.12 + i / 3);
        glowDot(x, y, 2.4, ST_AMBER, 0.95);
      }
    } else if (fate === 'failed') {
      const age = secSince(r.ended_at, t);
      if (age >= 0 && age < FAIL_SEC) {
        const u = age / FAIL_SEC, e = ease(Math.min(1, u * 1.4));
        ctx.lineWidth = (2.4 - 2 * u) * FX.lw; ctx.strokeStyle = ST_RED(0.85 * (1 - u));
        ctx.beginPath(); ctx.ellipse(cx, cy, b.w * (0.3 + 0.9 * e), b.h * (0.3 + 0.9 * e), 0, 0, 6.283); ctx.stroke();
        for (let i = 0; i < 12; i++) {
          const a = rand() * 6.283, d = (20 + rand() * 70) * e;
          glowDot(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.7, 1 + rand(), ST_RED, 1 - u);
        }
      }
    } else if (fate === 'cancelled') {
      const age = secSince(r.ended_at, t);
      if (age >= 0 && age < CANCEL_SEC) {
        const u = age / CANCEL_SEC;
        for (let i = 0; i < 22; i++) {
          const x0 = b.x + rand() * b.w, y0 = b.y + rand() * b.h, rise = (18 + rand() * 40) * ease(u), sway = Math.sin(sec * (0.8 + rand()) + i) * 6 * u;
          glowDot(x0 + sway, y0 - rise, 0.8 + rand() * 0.8, ST_GREY, (1 - u) * (0.4 + 0.6 * rand()));
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

// ---- 08-surge.js
'use strict';
// 输出突然加快时的脉冲：弧线区中心先闪一圈，一道亮光沿这条车道的汇流线从弧线区传到卡片，再沿光带从卡片传到产出框。
// Claude Code：速度和它最近几秒的平均（指数平滑，约 4 秒）比，一下子高出一截（高出 60% 以上、至少多 15 tok/s）就算一次加速。
// 它的用量按一条条消息记，速度本来就一跳一跳的。
// 席位：不看速度。一次请求的输出摊在整次请求里，请求进行中的实时估速又从 0 平滑升起，几乎不会"一下子高出一截"，
// 所以改成每报上来一份有输出的用量（一次请求跑完）就放一次，强度按这一份的 token 数（小请求也不低于 0.55，弧线区中心那一圈要看得出）。还没有这种用量的席位（第一份还没到，
// 或者是旧版本留下的、只有整轮总数或字数的记录）照旧看速度。直播里用量到页面要晚一会儿，按它到的那一刻放；
// 连上服务时开头那一批（服务发 synced 之前，以及之后算的第一帧，和 04-life.js 的节拍一样）是旧的，不放。
// 同一条车道 6 秒内只放一次。切换动画中、要求减少动效时不放。
const SURGE = new Map(); // 车道 id → { base: 平滑后的速度, at: 上次更新（屏幕秒）, t0: 这次脉冲开始（屏幕秒）, k: 强度 0.4–1, used: 已经看过的最新用量的时刻, synced }
SURGE.hello = undefined; // 上一次看到的连接（B.hello）：重连后开头那一批又是旧的
const SURGE_CORE = 0.45, SURGE_BUNDLE = 1.05, SURGE_RIBBON = 1.3;
const SURGE_TOTAL = SURGE_BUNDLE + SURGE_RIBBON;

// 这条车道 t 以前最新的一份有输出的分段用量（整轮总数不算：它不是一次请求）
function latestOutput(lane, t) {
  for (let i = lane.events.length - 1; i >= 0; i--) {
    const ev = lane.events[i];
    if (ev.ts <= t && ev.k === 'usage' && !ev.tot && ev.u?.out > 0) return ev;
  }
  return null;
}

function trackSurges(rates, quiet, t) {
  const now = performance.now() / 1000, live = B.clock.mode !== 'replay';
  if (live && SURGE.hello !== B.hello) { SURGE.hello = B.hello; for (const s of SURGE.values()) s.synced = false; }
  for (const [id, rate] of rates) {
    let s = SURGE.get(id);
    const lane = B.laneById.get(id), usage = id === 'cc' || !lane ? null : latestOutput(lane, t);
    if (!s) { SURGE.set(id, { base: rate, at: now, born: now, t0: -Infinity, k: 0, used: usage?.ts ?? -Infinity, synced: !live || B.synced }); continue; }
    const dt = Math.min(1, Math.max(0, now - s.at));
    s.at = now;
    const fire = (k) => { if (!quiet && !reduceMotion.matches && now - s.t0 > 6) { s.t0 = now; s.k = k; } };
    if (usage) {
      if (usage.ts > s.used) { s.used = usage.ts; if (s.synced) fire(0.55 + 0.45 * clamp01(usage.u.out / 600)); }
    // 按速度判断要有一段平均：刚打开页面（条目刚建）的头 4 秒，平均速度只有一个样本，不放
    } else if (s.synced && now - s.born > 4 && rate > s.base * 1.6 && rate - s.base >= 15) fire(0.4 + 0.6 * clamp01((rate - s.base) / 80));
    // 开头那一批还没收完时平均速度直接跟上：断开一阵再连上，补回来的用量会让速度一下子回来，不算加快
    s.base = s.synced ? s.base + (rate - s.base) * (1 - Math.exp(-dt / 4)) : rate;
    if (live && B.synced) s.synced = true;
  }
  for (const id of [...SURGE.keys()]) if (!rates.has(id)) SURGE.delete(id);
}
// 这条车道的脉冲走了多少屏幕秒；没有正在走的返回 null
function surgeAge(id) {
  const s = SURGE.get(id);
  if (!s) return null;
  const age = performance.now() / 1000 - s.t0;
  return age >= 0 && age < SURGE_TOTAL ? age : null;
}
const surgeK = (id) => SURGE.get(id)?.k ?? 0;

// ① 弧线区中心闪一下：一团车道颜色的光，外面一圈往外扩
function drawSurgeCore(c, id, age) {
  const u = age / SURGE_CORE, k = surgeK(id), color = tintOf(id);
  if (u >= 1) return;
  const r = c.R * (0.12 + 0.3 * ease(u)), g = ctx.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, r);
  g.addColorStop(0, HI(0.55 * k * (1 - u))); g.addColorStop(0.35, color(0.35 * k * (1 - u))); g.addColorStop(1, color(0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.cx, c.cy, r, 0, 6.283); ctx.fill();
  ring(c.cx, c.cy, u, color, c.R * 0.08, c.R * 0.55);
}
// ② 汇流线上的亮光：沿一条曲线从弧线区（u = 0）走到卡片（u = 1），拖一小段尾巴
function drawSurgeAlong(q, age, color, k) {
  const u = ease(clamp01((age - SURGE_CORE * 0.4) / (SURGE_BUNDLE - SURGE_CORE * 0.4)));
  if (u <= 0 || u >= 1) return;
  ctx.beginPath();
  for (let j = 0; j <= 6; j++) { const [x, y] = cubicAt(q, Math.max(0, u - 0.08 + j * 0.08 / 6)); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.strokeStyle = HI(0.85 * k * (1 - 0.3 * u)); ctx.lineWidth = 1.7 * FX.lw; ctx.stroke();
  const [hx, hy] = cubicAt(q, u);
  glowDot(hx, hy, 2.2, color, k);
}
// ③ 卡片到产出框：交给光带自己的脉冲（drawCone 的 pulseAges），这里换算成光带上的时刻
function surgePulses(lanes) {
  const out = [];
  for (const lane of lanes) {
    const age = surgeAge(lane.id);
    if (age != null && age > SURGE_BUNDLE) out.push({ lane: lane.id, out: true, age: age - SURGE_BUNDLE });
  }
  return out;
}

// ---- 08-tags.js
'use strict';
// 光束区里的状态标签：每个席位的粒子流中间一个小 HUD 标签，写着它此刻在做什么和速度。
// 字号按屏幕固定（像地图上的地名）；有新动作时亮一下，运行中保持半亮，结束后几秒内淡出。

const TAG_KINDS = new Set(['read', 'search', 'web', 'edit', 'cmd', 'msg', 'think', 'answer', 'report', 'queued', 'error', 'end', 'plan', 'image']);
const clipText = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);

function tagText(ev) {
  const t = ev.t || '';
  switch (ev.k) {
    case 'read': return `▸ reading ${baseName(t)}`;
    case 'search': return `⌕ ${t}`;
    case 'web': return `⌁ ${t.replace(/^https?:\/\//, '')}`;
    case 'edit': return `✎ editing ${baseName(editParts(t).path)}`;
    case 'cmd': return `$ ${t}`;
    case 'msg': return `◆ ${t}`;
    case 'think': return '✻ thinking';
    case 'answer': return `✎ writing answer · ${ev.n || 0} chars`;
    case 'report': return '◆ report submitted';
    case 'queued': return '… queued at provider';
    case 'error': return `✗ ${t}`;
    case 'end': return `● finished · ${t}`;
    case 'plan': return `plan ${t}`;
    case 'image': return `▣ ${baseName(t)}`;
    default: return '';
  }
}

function drawTags(L, t, rates) {
  for (const [id, row] of L.rows) {
    const lane = B.laneById.get(id);
    if (!lane || !latest(lane)) continue;
    // 只看这一轮任务的事件（续接回来时不再显示上一轮的"finished"）
    let ev = null;
    const cur = runAt(lane, t);
    for (let i = lane.events.length - 1; i >= 0; i--) { const e = lane.events[i]; if (e.ts <= t && TAG_KINDS.has(e.k) && (!cur || e.run === cur.id)) { ev = e; break; } }
    if (!ev) continue;
    const active = laneActive(lane, t), age = ageOf(ev, t);
    const alpha = (active ? 0.55 + 0.45 * Math.max(0, 1 - age / 2.5) : Math.max(0, 1 - age / 4)) * row.vis * (L.arrive?.get(id)?.card ?? 1) * (1 - (row.leave || 0));
    if (alpha <= 0.01) continue;
    const rate = rates.get(id) || 0;
    const text = clipText(tagText(ev), 40) + (active && rate >= 1 ? `  ·  ≈ ${Math.round(rate)} tok/s` : '');
    const color = tintOf(id), s = 1 / VIEW.k;
    const x = (row.card.x + row.card.w + row.out.x) / 2, y = row.card.y + row.card.h / 2;
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = alpha;
    ctx.font = '10.5px ui-monospace, Consolas, monospace';
    const w = ctx.measureText(text).width + 22, h = 18, x0 = -w / 2, y0 = -h / 2, cs = 5;
    ctx.fillStyle = 'rgba(7,7,9,.8)'; ctx.fillRect(x0, y0, w, h);
    ctx.strokeStyle = 'rgba(170,170,182,.18)'; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    // 四角括号（模型颜色）
    ctx.strokeStyle = color(0.85); ctx.lineWidth = 1;
    ctx.beginPath();
    for (const [cx, cy, dx, dy] of [[x0, y0, 1, 1], [x0 + w, y0, -1, 1], [x0, y0 + h, 1, -1], [x0 + w, y0 + h, -1, -1]]) {
      ctx.moveTo(cx + dx * cs, cy + 0.5 * dy); ctx.lineTo(cx + 0.5 * dx, cy + 0.5 * dy); ctx.lineTo(cx + 0.5 * dx, cy + dy * cs);
    }
