// ---- 03-timeline.js
'use strict';
// 车道事件 → 对话流的行，照 watch 的时间线：模型说的话是节点（◆），读、搜、改、命令挂在竖线下面，
// 两句话之间超过 3 个动作折叠成一行；最新的思考单独放在卡片底行。

const MAX_ACTIONS = 3;
const hhmm = (ts) => { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const baseName = (p) => String(p || '').replace(/\\/g, '/').split('/').filter(Boolean).pop() || String(p || '');
const EDIT_MARKS = { update: '✎', write: '✎', add: '+', delete: '−' };

function editParts(t) {
  const m = /^(\w+)\s+(.*)$/.exec(String(t || ''));
  return m ? { kind: m[1], path: m[2] } : { kind: 'update', path: String(t || '') };
}

const laneModel = (id) => { const l = B.laneById.get(id); const r = l && l.runs[l.runs.length - 1]; return r ? shortModel(r.model) : id; };
const shortModel = (m) => String(m || '').split('/').pop();

const displayPoints = () => B.clock.mode === 'replay' ? B.hello?.replay?.time_map : null;
const currentRun = (lane, t) => lane.id === 'cc' ? latest(lane) : lane.runs.filter((r) => r.started_at <= t).at(-1);
const roundOf = (lane, t) => { const r = currentRun(lane, t); return r ? Display.roundOf(Display.displayRun(r).meta, new Map(lane.runs.map((x) => [x.id, x]))) : 1; };
function laneElapsed(lane, t, total = false) {
  const runs = lane.runs.filter((r) => r.started_at <= t && r.kind !== 'answer');
  const last = lane.events.filter((e) => e.run === 'cc' && e.ts <= t).at(-1);
  const activity = last ? last.original_ts ?? Display.recordedTime(last.ts, displayPoints()) : null;
  return (total ? runs : runs.slice(-1)).reduce((n, r) => n + Display.elapsedOf(r, t, displayPoints(), activity), 0);
}
// 同一批已到达的事件可供状态、动画和终端重复使用；时间跨过下一条事件才需要重新投影。
const LIVE_STATES = new WeakMap();
function liveState(lane, r, t) {
  const events = lane.events, hit = LIVE_STATES.get(lane);
  // 跨车道的目标名也来自 B，因此数据版本变化时要重新取。
  if (hit?.run === r && hit.events === events && hit.ver === lane.ver && hit.version === B.version
    && t >= hit.from && t < hit.to) return hit.state;
  const state = { speech: null, thought: null, recent: [], kinds: {}, api: {} };
  const byAid = new Map();
  let seq = 0, command = null;
  let from = -Infinity, to = Infinity;
  for (const ev of events) {
    if (ev.ts > t) { to = ev.ts; break; }
    from = ev.ts;
    if (ev.run !== r.id) continue;
    seq++;
    if (ev.k === 'req') state.api = { req: ev.original_ts ?? Display.recordedTime(ev.ts, displayPoints()) };
    else if (ev.k === 'queued') state.api.queued = true;
    else if (ev.k === 'think' || ev.k === 'answer') {
      state.api.queued = false; state.api.answering = ev.k === 'answer';
      if (ev.t) state.thought = { text: Display.thoughtLine(ev.t), seq };
    } else if (ev.k === 'msg') state.speech = { text: ev.t, seq };
    // 并行命令按编号配对；旧记录没有编号时仍挂到最近一条命令。
    else if (ev.k === 'cmd_done') { const action = ev.aid != null ? byAid.get(ev.aid) : command; if (action && ev.ok === false) action.tag = '✗ failed'; }
    else {
      const line = lineOf(ev);
      if (!line || !line.cls.startsWith('act') || ['end', 'report'].includes(ev.k)) continue;
      const kind = ({ cmd: 'command', read: 'read', search: 'search', web: 'search', edit: 'edit', image: 'image' })[ev.k] || 'other';
      const action = { kind, text: line.text };
      if (ev.k === 'cmd') { command = action; if (ev.aid != null) byAid.set(ev.aid, action); }
      state.recent.push(action); state.kinds[kind] = (state.kinds[kind] || 0) + 1;
    }
  }
  if (!state.api.req && r.queued && !state.speech && !state.recent.length) state.api.queued = true;
  LIVE_STATES.set(lane, { run: r, events, ver: lane.ver, version: B.version, from, to, state });
  return state;
}
// 已经结束的任务，状态只随"后来有没有续接"变：直播时按任务对象缓存（任务记录一更新，页面就换成新对象）。
// 正在跑的才需要扫这一轮的事件看是在排队、思考还是回答；结束了的不扫
const SEAT_STATES = new WeakMap();
function seatStatus(lane, r, t) {
  if (!r) return { style: Display.outcomeStyle({ status: 'not_started' }), right: ['not started'], kind: 'not_started' };
  const ended = r.ended_at != null && r.ended_at <= t, resumed = ended && lane.runs.some((x) => x.parent === r.id && x.started_at <= t);
  const cache = ended && B.clock.mode === 'live', hit = cache && SEAT_STATES.get(r);
  if (hit && hit.resumed === resumed) return hit.state;
  const run = Display.displayRun(r);
  const result = ended || r.kind === 'answer' ? run.result : { status: 'running' };
  const outcome = Display.resultOutcome(result, run.meta);
  outcome.resumed = resumed;
  const meta = { ...run.meta, started_at: r.original_started_at ?? Display.recordedTime(r.started_at, displayPoints()),
    ended_at: ended ? r.original_ended_at ?? Display.recordedTime(r.ended_at, displayPoints()) : null,
    submitted_at: r.submitted_at ?? r.original_started_at ?? run.meta.submitted_at };
  const state = Display.seatState(meta, result, outcome.running ? liveState(lane, r, t).api : {}, Display.recordedTime(t, displayPoints()), undefined, outcome);
  if (cache) SEAT_STATES.set(r, { resumed, state });
  return state;
}

// 用量保留在结尾，JSON 报告只在完成时显示，避免重复正文。
function lineOf(ev) {
  const t = ev.t || '';
  switch (ev.k) {
    case 'prompt': return { cls: 'user', text: t };
    case 'msg': return { cls: 'node', text: t };
    case 'report': return null;
    case 'end': return { cls: ev.t === 'done' ? 'node' : 'node bad', text: Display.D.statusName(t) };
    case 'cmd': return { cls: 'act', text: Display.commandAction({ command: t, plain: true }).text, cmd: true, kind: 'command' };
    case 'read': case 'search': return { cls: 'act', text: Display.commandAction({ category: ev.k, label: t }).text, kind: ev.k };
    case 'web': return { cls: 'act', text: `◎ ${t}`, kind: 'search' };
    case 'edit': { const e = editParts(t); return { cls: 'act', text: `${EDIT_MARKS[e.kind] || '✎'} ${e.path}`, kind: 'edit' }; }
    case 'plan': return { cls: 'node', text: `◇ plan ${t}` };
    case 'image': return { cls: 'act', text: ev.viewed ? `◉ ${Display.D.watchImageViewed(t)}` : `▣ ${Display.D.watchImage(t)}`, kind: 'image' };
    case 'req': { const r = B.runs.get(ev.run); return { cls: 'node', text: Display.D.watchApiRequest(t, r?.effort, ev.n) }; }
    case 'queued': return { cls: 'node', text: `⋯ ${Display.D.watchApiQueued}` };
    case 'retry': return { cls: 'act bad', text: `⚠ ${Display.D.watchApiRetry(t, ev.n)}` };
    case 'error': { const a = Display.errorAction(t); return { cls: 'act bad', text: `${a.mark} ${a.text}` }; }
    case 'tool': return { cls: 'act', text: `· ${t}` };
    case 'dispatch': return { cls: 'act link', text: `⇢ ${t}${targets(ev)}` };
    case 'collect': return { cls: 'act link', text: `⇠ ${t || 'read results'}${targets(ev)}` };
    case 'returned': return { cls: 'act link', text: `⇠ result back${targets(ev)}` };
    default: return null;
  }
}
const targets = (ev) => (ev.target && ev.target.length ? ` → ${ev.target.map(laneModel).join(', ')}` : '');

// 对话流：到时刻 t 为止的行。open 为真时返回全部，否则只要最后 limit 行。
function timeline(lane, t, { open = false, limit = 6 } = {}) {
  const byAid = new Map(), entries = [];
  let lastCmd = null;
  // 并行命令按轮次和编号配对；旧记录没有编号时保留最近命令的老做法。
  // 先配对再折叠，上一段折起后才收到的失败也能露出来。
  for (const ev of lane.events) {
    if (ev.ts > t) break;
    if (ev.k === 'cmd_done') {
      const command = ev.aid != null ? byAid.get(`${ev.run}:${ev.aid}`) : lastCmd;
      if (command && ev.ok === false) { command.text += '  ✗ failed'; command.cls += ' bad'; }
      continue;
    }
    const line = lineOf(ev);
    if (line?.cmd) { lastCmd = line; if (ev.aid != null) byAid.set(`${ev.run}:${ev.aid}`, line); }
    entries.push({ ev, line });
  }
  const lines = [];
  let block = [];
  const flush = (closed) => {
    if (block.length > MAX_ACTIONS) {
      // 已经过去的一段留前几条（和 watch 一样），正在进行的一段留最新几条
      const kept = closed ? block.slice(0, MAX_ACTIONS) : block.slice(-MAX_ACTIONS);
      const folded = closed ? block.slice(MAX_ACTIONS) : block.slice(0, -MAX_ACTIONS), foldedLines = [];
      let counts = {};
      const pushFold = () => { if (Object.keys(counts).length) foldedLines.push({ cls: 'act fold', text: Display.foldText(counts) }); };
      // 和终端一样，失败动作单独显示，前后的折叠各自计数。
      for (const line of folded) {
        if (line.cmd && line.cls.includes(' bad')) { pushFold(); foldedLines.push(line); counts = {}; }
        else counts[line.kind || 'other'] = (counts[line.kind || 'other'] || 0) + 1;
      }
      pushFold();
      lines.push(...(closed ? [...kept, ...foldedLines] : [...foldedLines, ...kept]));
    } else lines.push(...block);
    block = [];
  };
  for (const { ev, line } of entries) {
    if (ev.k === 'end') {
      const r = lane.runs.find((r) => r.id === ev.run);
      if (r) {
        flush(true);
        const st = seatStatus(lane, r, t), run = Display.displayRun(r);
        lines.push({ ts: ev.original_ts ?? Display.recordedTime(ev.ts, displayPoints()), cls: 'node', text: `└ ${st.style.mark} ${st.right.filter(Boolean).join(' ')}` });
        const usage = Display.usageLine(run.result, run.meta);
        if (usage) lines.push({ cls: 'act', text: usage });
        lines.push(...conclusion(r));
        continue;
      }
    }
    if (!line) continue;
    line.ts = ev.original_ts ?? Display.recordedTime(ev.ts, displayPoints());
    if (line.cls.startsWith('act')) block.push(line);
    else { flush(true); lines.push(line); }
  }
  flush(false);
  return open ? lines : lines.slice(-limit);
}

// 终端区的颜色和终端一致：用和 format.mjs 一样的颜色代码调 display.mjs，fillTerm（06-cards.js）再把颜色代码换成带色的片段
const TERM_C = Object.fromEntries([['dim', '2'], ['bold', '1'], ['red', '31'], ['green', '32'], ['yellow', '33'], ['cyan', '36']]
  .map(([key, code]) => [key, (s) => (s === '' ? s : `\x1b[${code}m${s}\x1b[0m`)]));
function conclusion(r, width = Infinity) {
  const run = Display.displayRun(r), o = Display.resultOutcome(run.result, run.meta);
  return Display.finalLines(run, run.result, run.meta.participant === 'host' || o.ok || o.partial, width, TERM_C)
    .map((text) => ({ ts: r.original_ended_at ?? r.ended_at, cls: 'plain', text }));
}

// 卡片底行：最新的思考或正在写的回答，过了 90 秒（记录时间）就不再显示
function thinkingLine(lane, t) {
  for (let i = lane.events.length - 1; i >= 0; i--) {
    const ev = lane.events[i];
    if (ev.ts > t) continue;
    if (t - ev.ts > 90000) return '';
    if (ev.k === 'think') return ev.t ? `✻ ${ev.t}` : '✻ thinking…';
    if (ev.k === 'answer') return `✎ writing answer · ${ev.n || 0} chars`;
    if (ev.k === 'msg' || ev.k === 'end' || ev.k === 'report') return '';
  }
  return '';
}

// 计划里还没启动的席位：排着队、或者计划刚建好（30 分钟内）且从没排过队时画成虚影；
// 排过队又离开了队列（取消、过期、派发失败）或者放了很久还没人启动，就不再画，免得这一组永远留在画面上
const PLAN_IDLE = 30 * 60000; // 记录时间
function seatWaiting(plan, seat, since, t) {

'use strict';

  for (const ev of B.life) {

// 相关的光路短暂变宽（08-fx.js 的 drawFx 和 08-beams.js 用）。派出和交回最明显，读走结果、记下裁决次之，Claude Code 回一句话最轻。
// 按记录时间算，回放、暂停、拖动时间线时和直播一样；几下叠在一起取最大值，离上一下不到 0.8 屏幕秒、又不比它强的就并掉
// （同一次派出既有 Claude Code 的派出动作、又有那一席的任务启动，只算一下），事件密时不会一直闪。
// 直播里事件要过一会儿才送到页面：看板服务每秒推一次；Claude Code 一条回复里的文字和工具调用要等整条（包括后面的工具调用）
// 生成完才一起写进记录，工具调用前的那句话会晚几秒到几十秒。按记录时刻算的话到的时候已经暗了：直播时一下从页面第一次看到它起算，
// 到的时候正好最亮。连上服务（打开页面、换对话、重连）后开头那一批是旧事件（服务发 synced 之前，01-state.js），不算；
// 之后新到的都算，晚了 BEAT.late 秒以上的除外。回放照旧按记录时刻。返回 { env: 整体强度 0–1, lanes: 车道 id → 这条车道的强度 }
const BEAT = { window: 1.2, decay: 4.5, merge: 0.8, late: 120, seen: new Map(), hello: undefined, synced: false, kinds: { dispatch: 0.9, result: 0.8, collect: 0.6, verdict: 0.6, msg: 0.45 } };
function beatsAt(t) {
  const live = B.clock.mode !== 'replay', from = t - recMs(BEAT.window + (live ? BEAT.late : 0)), list = [];
  // 每次连上都会先收到新的 hello：上一次连接记下的不用了
  if (live && BEAT.hello !== B.hello) { BEAT.hello = B.hello; BEAT.seen.clear(); BEAT.synced = false; }
  // 收完开头那一批以后第一次算时，已经在的也都是旧的：那一批和 synced 常常一起到，中间不一定画过一帧
  const old = !B.synced || !BEAT.synced;
  if (live && B.synced) BEAT.synced = true;
  const add = (ts, kind, lanes) => {
    if (!(ts > from && ts <= t)) return;
    let at = ts;
    if (live) {
      const key = `${kind}|${lanes[0]}|${ts}`;
      if (!BEAT.seen.has(key)) BEAT.seen.set(key, { ts, at: old || t - ts > recMs(BEAT.late) ? -Infinity : t });
      at = BEAT.seen.get(key).at;
    }
    if (at > t - recMs(BEAT.window)) list.push({ ts: at, s: BEAT.kinds[kind], lanes });
  };
  // 记到看的范围以外为止（服务整份重发某个任务的事件时，范围里的不会再算一次）
  for (const [key, v] of BEAT.seen) if (v.ts <= from) BEAT.seen.delete(key);
  const cc = B.laneById.get('cc');
  if (cc) for (let i = cc.events.length - 1; i >= 0 && cc.events[i].ts > from; i--) {
    const e = cc.events[i];
    if (e.k === 'msg') add(e.ts, 'msg', ['cc']);
    else if (e.k === 'dispatch' || e.k === 'collect') add(e.ts, e.k, ['cc', ...(e.target || [])]);
  }
  for (const lane of B.lanes) {
    if (lane.id === 'cc' || lane.ghost) continue;
    for (const r of lane.runs) { if (r.kind === 'answer') continue; add(r.started_at, 'dispatch', [lane.id]); if (r.ended_at != null) add(r.ended_at, 'result', [lane.id]); }
  }
  for (const v of B.life) if (v.k === 'verdict' && v.lane) add(v.ts, 'verdict', [v.lane]);
  list.sort((a, b) => a.ts - b.ts);
  const out = { env: 0, lanes: new Map() };
  let last = -Infinity, lastS = 0;
  for (const b of list) {
    // 各条车道自己的光路照样跟着每一下变宽；并掉的只是整体那一下闪
    const e = b.s * Math.exp(-secSince(b.ts, t) * BEAT.decay);
    for (const id of b.lanes) out.lanes.set(id, Math.max(out.lanes.get(id) || 0, e));
    if (secSince(last, b.ts) < BEAT.merge && b.s <= lastS) continue;
    last = b.ts; lastS = b.s;
    out.env = Math.max(out.env, e);
  }
  return out;
}

// ---- 04-rates.js
'use strict';
// token 速度和用量。各家记录用量的粒度都很粗，速度一律是估算（页面上写成 ≈）：
// - 有分段用量的：输出摊到上一份用量到这一份之间；同轮有分段时忽略整轮总量；
// - 流式字数（pi、API）：最后一份用量之后的字数增量 ÷ 4 当作 token；
// - 回放时还知道每个任务最后的总用量：没被上面两种算到的部分，摊到这个任务各个事件之间的空档上（"回放估算"）。
// 已知的局限：直播的估速只在命令执行期间暂停；pi、opencode 读文件、搜索这类工具没有开始事件，执行期间仍按样本估（通常只有几百毫秒）。

const WINDOW = 10000, SEG_MAX = 90000, GAP_MAX = 300000, CHARS_PER_TOKEN = 4;
const FINAL = new Map(); // run id → 回放结束时的 run 消息（总用量）
const FINAL_EV = new Map(); // 车道 id → 回放的全部事件（估算速度用，不随回放进度变化）
const SEG_RUN = new WeakMap(); // 分段归属供任务内去重和直播采样，不增加对外字段

// 画面仍用压缩时钟；统计窗口插值回原始时间，倍速只改变播放调度。
function recordTime(t) {
  const points = B.clock.mode === 'replay' ? B.hello?.replay?.time_map : null;
  if (!points?.length) return t;
  let lo = 0, hi = points.length;
  while (lo < hi) { const mid = (lo + hi) >>> 1; if (points[mid][0] <= t) lo = mid + 1; else hi = mid; }
  const a = points[Math.max(0, lo - 1)], b = points[lo];
  return b && t >= a[0] ? a[1] + (t - a[0]) * (b[1] - a[1]) / (b[0] - a[0]) : a[1] + t - a[0];
}

// 回放：取一次结束时的快照，拿到每个任务最后的用量
function loadFinals() {
  if (window.__BOARD_FIXTURE__ || B.clock.mode !== 'replay' || loadFinals.started) return;
  loadFinals.started = true;
  const gen = loadFinals.gen, q = scopeQuery();
  // from 只对明细流有意义（从宇宙层当时的时刻接着放）；快照带上它会被回放服务拒绝
  q.delete('from');
  q.set('t', '100000000');
  fetch(`snapshot?${q}`).then((r) => r.json()).then((s) => {
    if (gen !== loadFinals.gen) return; // 回来时已经换了对话：丢掉
    for (const r of s.runs) FINAL.set(r.id, r);
    for (const ev of s.events) { const id = ev.lane || ev.run; if (!FINAL_EV.has(id)) FINAL_EV.set(id, []); FINAL_EV.get(id).push(ev); }
    for (const list of FINAL_EV.values()) list.sort((a, b) => a.ts - b.ts);
    for (const lane of B.lanes) lane.segs = null;
    // 补齐的是历史用量，不是输出加快：加速脉冲的基线从补齐后的速度重新算（08-surge.js）
    if (typeof SURGE !== 'undefined') SURGE.clear();
    B.version++;
  }).catch(() => {});
}

// 用量统一成 { input(未命中缓存), cached, cache_write, output }；v1 的 input 含缓存部分
function usageOf(r) {
  if (r?.usage_unattributed) return null;
  const u = r && r.usage;
  if (!u) return null;
  if ('cache_write' in u) return { input: u.input || 0, cached: u.cached || 0, cache_write: u.cache_write || 0, output: u.output || 0 };
  return { input: Math.max(0, (u.input || 0) - (u.cached || 0)), cached: u.cached || 0, cache_write: 0, output: u.output || 0 };
}

// 事件未保留命令 ID，按任务计数，所有并行命令结束才恢复生成。
// [from, to) 和命令时段有没有重叠。同一个任务的命令时段按开始时间排好、互不重叠（commandSpans 把嵌套的命令并成一段），
// 结束时间也就跟着有序：二分找最后一个在 to 之前开始的，看它是不是过了 from。逐个比较在命令多的长任务里是平方级
function overlapsCommand(spans, from, to) {
  let lo = 0, hi = spans.length;
  while (lo < hi) { const mid = (lo + hi) >>> 1; if (spans[mid].a < to) lo = mid + 1; else hi = mid; }
  return lo > 0 && spans[lo - 1].b > from;
}

// 同一份事件（没有新增）重复算命令时段很费：按数组缓存，条数或首尾变了才重算
const SPANS = new WeakMap();
function cachedSpans(events) {
  const hit = SPANS.get(events);
  if (hit && hit.n === events.length && hit.first === events[0] && hit.last === events.at(-1)) return hit.spans;
  const spans = commandSpans(events);
  SPANS.set(events, { n: events.length, first: events[0], last: events.at(-1), spans });
  return spans;
}
function commandSpans(events) {
  const spans = new Map(), counts = new Map();
  for (const ev of events) {
    const count = counts.get(ev.run) || 0;
    if (ev.k === 'cmd') {
      if (!count) {
        if (!spans.has(ev.run)) spans.set(ev.run, []);
        spans.get(ev.run).push({ a: ev.ts, b: Infinity });
      }
      counts.set(ev.run, count + 1);
    } else if (ev.k === 'cmd_done' && count > 0) {
      counts.set(ev.run, count - 1);
      if (count === 1) spans.get(ev.run).at(-1).b = ev.ts;
    }
  }
  return spans;
}

// 一条车道的输出分段：[{ a, b, tokens }]，a/b 是记录时间（毫秒）
function segments(lane) {
  const live = B.clock.mode === 'live';
  let events = FINAL_EV.get(lane.id) || (live ? lane.rate_events ?? lane.events : lane.events);
  const outputs = new Map(lane.runs.map((r) => [r.id, r.usage_unattributed ? 0 : FINAL.get(r.id)?.usage?.output ?? (r.ended_at != null ? r.usage?.output : null)]));
  const outputKey = JSON.stringify([...outputs]);
  // 分段还依赖车道上的任务（续接的任务会陆续出现），任务数变了也要重算
  const ver = `${FINAL_EV.has(lane.id) ? events.length : (lane.ver || 0)}|${lane.runs.length}`;
  // 最终用量晚于事件到达，上限更新后也要重算。
  if (lane.segs && lane.segsAt === ver && lane.segsUsage === outputKey) return lane.segs;
  if (!live) events = events.map((e) => ({ ...e, ts: e.original_ts ?? e.ts }));
  const segs = [];
  const lastUsage = new Map(), turnUsage = new Map(), usageSegs = new Map(), lastChars = {};
  const turns = new Map(), stepTurns = new Set();
  // 先看整轮，迟到的分段也能替换排在它前面的累计总量。
  for (const ev of events) {
    if (ev.k === 'turn') turns.set(ev.run, (turns.get(ev.run) || 0) + 1);
    else if (ev.k === 'usage' && !ev.tot && ev.u?.out != null) stepTurns.add(`${ev.run}:${turns.get(ev.run) || 0}`);
  }
  turns.clear();
  const usageEnds = new Map(events.filter((e) => e.k === 'usage' && e.u?.out != null).map((e) => [e.run, e.usage_to ?? e.ts]));
  const commands = cachedSpans(events);
  const byRun = new Map();
  for (const ev of events) if (ev.k !== 'usage') {
    if (!byRun.has(ev.run)) byRun.set(ev.run, []);
    byRun.get(ev.run).push(ev);
  }
  const counted = new Map(); // run id → 已经由分段用量或字数算到的 token
  const starts = new Map(lane.runs.map((r) => [r.id, !live ? r.original_started_at ?? r.started_at : r.started_at]));
  // 按任务内事件的空档摊开，去掉命令时间后，单个空档最多算 GAP_MAX。
  // 推理模型一次请求里可以长时间不出事件（只在想），按 60 秒截断会把生成时间算少、速度估高（实测一个 Codex 记录高 84%）；
  // 命令时间已经单独扣掉，这里只防真正的空闲（比如排队、等人），所以放宽到 5 分钟
  const spread = (run, a, b, tokens, est) => {
    if (!(tokens > 0) || !(b > a)) return;
    counted.set(run, (counted.get(run) || 0) + tokens);
    // 按任务分桶并直接定位区间，长会话不能为每份用量重新扫描全部历史。
    const own = byRun.get(run) || [], times = [a];
    let lo = 0, hi = own.length;
    while (lo < hi) { const mid = (lo + hi) >>> 1; if (own[mid].ts <= a) lo = mid + 1; else hi = mid; }
    for (let i = lo; i < own.length && own[i].ts < b; i++) times.push(own[i].ts);
    times.push(b);
    const gaps = [];
    for (let i = 1; i < times.length; i++) if (times[i] > times[i - 1]) gaps.push({ b: times[i], w: Math.min(times[i] - times[i - 1], GAP_MAX) });
    const runCommands = commands.get(run) || [];
    let active = gaps.filter((g) => !overlapsCommand(runCommands, g.b - g.w, g.b));
    if (!active.length) active = gaps; // 全被命令覆盖时仍保留原来的 token 摊分。
    if (est) {
      // 只补本任务未覆盖的区间；重叠分段按并集扣掉，其他任务不参与。
      const covered = segs.filter((s) => SEG_RUN.get(s) === run).sort((x, y) => x.a - y.a), uncovered = [];
      for (const g of active) {
        let a = g.b - g.w;
        for (const s of covered) {
          if (s.b <= a) continue;
          if (s.a >= g.b) break;
          if (s.a > a) uncovered.push({ b: s.a, w: s.a - a });
          a = Math.max(a, s.b);
        }
        if (a < g.b) uncovered.push({ b: g.b, w: g.b - a });
      }
      if (!uncovered.length && covered.length) {
        const total = covered.reduce((sum, s) => sum + s.tokens, 0);
        for (const s of covered) { s.tokens += tokens * s.tokens / total; s.est = true; }
        return;
      }
      active = uncovered;
    }
    const total = active.reduce((s, g) => s + g.w, 0);
    for (const g of active) {
      const s = { a: g.b - g.w, b: g.b, tokens: (tokens * g.w) / total, est };
      SEG_RUN.set(s, run); segs.push(s);
    }
  };
  for (const ev of events) {
    if (ev.k === 'turn') { turns.set(ev.run, (turns.get(ev.run) || 0) + 1); turnUsage.set(ev.run, 0); }
    else if (ev.k === 'usage' && ev.u && ev.u.out != null) {
      if (ev.tot && stepTurns.has(`${ev.run}:${turns.get(ev.run) || 0}`)) continue;
      const before = counted.get(ev.run) || 0, limit = outputs.get(ev.run);
      const tokens = ev.tot ? Math.max(0, Math.min(ev.u.out - (turnUsage.get(ev.run) || 0), limit == null ? Infinity : limit - before)) : ev.u.out;
      const end = ev.usage_to ?? ev.ts;
      const prev = lastUsage.get(ev.run) ?? ev.usage_from ?? (lane.id === 'cc' ? end - 20000 : starts.get(ev.run) ?? end - 20000);
      const previous = usageSegs.get(ev.run);
      if (tokens > 0 && end <= prev && previous?.length) {
        // 同时收到的用量共用上一份生成区间，不能丢 token 或制造极短分段。
        const duration = previous.reduce((n, s) => n + s.b - s.a, 0);
        for (const s of previous) s.tokens += tokens * (s.b - s.a) / duration;
        counted.set(ev.run, before + tokens);
      } else {
        const at = segs.length, from = end <= prev ? starts.get(ev.run) ?? end - 20000 : prev;
        spread(ev.run, lane.id === 'cc' ? Math.max(from, end - SEG_MAX) : from, end, tokens, false);
        if (segs.length > at) usageSegs.set(ev.run, segs.slice(at));
      }
      turnUsage.set(ev.run, (turnUsage.get(ev.run) || 0) + (counted.get(ev.run) || 0) - before);
      lastUsage.set(ev.run, Math.max(lastUsage.get(ev.run) ?? end, end));
    } else if ((ev.k === 'think' || ev.k === 'answer') && ev.n != null) {
      const key = `${ev.run}:${ev.k}`, prev = lastChars[key];
      // 用量覆盖此前的字数估算，跨过用量边界的字数也不带到下一段。
      if (prev && prev.ts >= (usageEnds.get(ev.run) ?? -Infinity) && ev.n > prev.n) spread(ev.run, prev.ts, ev.ts, (ev.n - prev.n) / CHARS_PER_TOKEN, false);
      lastChars[key] = { ts: ev.ts, n: ev.n };
    }
  }
  // 回放估算只补尚未覆盖的生成区间，全部覆盖时增加 token 而不增加时长。
  for (const r of lane.runs) {
    const f = usageOf(FINAL.get(r.id));
    if (!f) continue;
    const rest = f.output - (counted.get(r.id) || 0);
    const final = FINAL.get(r.id), end = final.original_ended_at ?? final.ended_at ?? r.original_ended_at ?? r.ended_at;
    if (rest > 0 && end != null) spread(r.id, starts.get(r.id), end, rest, true);
  }
  segs.sort((x, y) => x.a - y.a);
  lane.segs = segs;
  lane.segsAt = ver;
  lane.segsUsage = outputKey;
  return segs;
}

function rateSample(lane, runs, t) {
  const ids = new Set(runs.map((r) => r.id));
  let tokens = 0, ms = 0;
  for (const s of segments(lane)) {
    if (s.est || s.b > t || !ids.has(SEG_RUN.get(s))) continue;
    tokens += s.tokens; ms += s.b - s.a;
  }
  return { tokens, ms };
}

// 直播在最近一份用量之后只补速度，不回填分段、总量或平均速度。
// 车道上每个在跑的任务从哪一刻起按实时估速算（最后一个回合开始或最后一次用量以后），和问的是哪个时刻无关：
// 事件（车道的事件版本号 lane.ver、条数和首尾）和任务都没变就沿用，速度曲线每个点都要问一次。没有起点（还没开始回合、这一轮已经交了总数、起点之后有字数估算）的不列
const LIVE_STARTS = new WeakMap();
function liveStarts(lane, rateEvents) {
  const hit = LIVE_STARTS.get(lane);
  if (hit && hit.events === rateEvents && hit.ver === lane.ver && hit.n === rateEvents.length && hit.first === rateEvents[0] && hit.last === rateEvents.at(-1)
    && hit.runs === lane.runs.length) return hit.map;
  const map = new Map();
  for (const r of lane.runs) {
    if (r.status !== 'running') continue;
    const events = rateEvents.filter((e) => e.run === r.id);
    const at = events.findLastIndex((e) => e.k === 'turn'), turn = events[at], usage = events.findLast((e) => e.k === 'usage' && e.u?.out != null);
    // 结束标记可能不在末条用量，迟到的分段不能重新开启估速。
    if (!turn || events.slice(at + 1).some((e) => e.k === 'usage' && (e.tot || e.end))) continue;
    const from = Math.max(turn.ts, usage?.ts ?? -Infinity);
    if (events.some((e) => e.ts >= from && (e.k === 'think' || e.k === 'answer') && e.n != null)) continue;
    map.set(r.id, from);
  }
  LIVE_STARTS.set(lane, { events: rateEvents, ver: lane.ver, n: rateEvents.length, first: rateEvents[0], last: rateEvents.at(-1), runs: lane.runs.length, map });
  return map;
}

function liveRate(lane, t, win = WINDOW) {
  if (B.clock.mode !== 'live' || B.clock.frozenAt != null || lane.id === 'cc') return 0;
  // 先看 t 时有没有在跑的任务：速度曲线对每个点都调一次，结束了的车道不必再扫事件
  const open = lane.runs.filter((r) => r.status === 'running' && r.started_at <= t && (r.ended_at == null || r.ended_at > t));
  if (!open.length) return 0;
  const rateEvents = lane.rate_events ?? lane.events, commands = cachedSpans(rateEvents), starts = liveStarts(lane, rateEvents);
  let rate = 0;
  for (const r of open) {
    const from = starts.get(r.id);
    if (from == null || from > t) continue;
    const busy = commands.get(r.id) || [];
    if (busy.some((c) => c.a <= t && c.b > t)) continue;
    const sample = rateSample(lane, lane.runs.filter((x) => x.model === r.model && x.started_at <= t), t);
    if (!sample.ms && r.model) {
      for (const other of B.lanes) {
        if (other === lane) continue;
        const peer = rateSample(other, other.runs.filter((x) => x.model === r.model && x.started_at <= t), t);
        sample.tokens += peer.tokens; sample.ms += peer.ms;
      }
    }
    if (!sample.ms) continue;
    const a = Math.max(from, t - win);
    let active = t - a;
    for (const c of busy) active -= Math.max(0, Math.min(c.b, t) - Math.max(c.a, a));
    rate += (sample.tokens / (sample.ms / 1000)) * active / win;
  }
  return rate;
}

// 时刻 t 前 WINDOW 内的平均输出速度（token/秒）
function rateAt(lane, t, win = WINDOW) {
  return recordRate(lane, recordTime(t), win);
}

function recordRate(lane, t, win = WINDOW) {
  let tokens = 0;
  for (const s of segments(lane)) {
    if (s.a >= t) break;
    const lo = Math.max(s.a, t - win), hi = Math.min(s.b, t);
    if (hi > lo) tokens += (s.tokens * (hi - lo)) / (s.b - s.a);
  }
  return tokens / (win / 1000) + liveRate(lane, t, win);
}

// 速度曲线：从这条车道第一轮开始到最后一轮结束（还在跑的画到现在），n 个点。结束以后曲线停住，

  const W = fitWidth(r.width, r.height), k = Math.min(r.width / W, r.height / VIEW.H) * 0.97;
  return { k, tx: (r.width - W * k) / 2, ty: (r.height - VIEW.H * k) / 2 };
}
function fitView(now = false) { VIEW.auto = true; VIEW.goal = fitGoal(); if (now) Object.assign(VIEW, VIEW.goal); }
const kFit = () => fitGoal().k;

function zoomAt(sx, sy, factor) {
  const g = VIEW.goal || { k: VIEW.k, tx: VIEW.tx, ty: VIEW.ty }, kf = kFit();
  const k = Math.max(kf * 0.6, Math.min(kf * 10, g.k * factor)), f = k / g.k;
  VIEW.goal = { k, tx: sx - (sx - g.tx) * f, ty: sy - (sy - g.ty) * f };
  VIEW.auto = false;
}
function zoomToBox(b) {
  const r = viewEl.getBoundingClientRect(), k = Math.min((r.height * 0.62) / b.h, (r.width * 0.4) / b.w);
  // 只有点卡片飞过去才可能是"卡片间的移动"（newViewGoal）；滚轮、键盘缩放始终绕鼠标或中心走
  VIEW.goal = { k, tx: r.width / 2 - (b.x + b.w / 2) * k, ty: r.height / 2 - (b.y + b.h / 2) * k, hop: true };
  VIEW.auto = false;
}

// 从 a 到 b 走到 u（0–1）时的镜头：缩放按对数插值（放大十倍和缩小十倍一样匀速，不会开头猛冲、结尾磨蹭）。
// a 到 b 是绕一个不动点的缩放（滚轮缩放时就是鼠标下那一点），中间每一步也绕它缩放，那一点在屏幕上始终不动；
// 缩放几乎不变（纯平移）时直接平移
function viewAt(a, b, u) {
  const k = Math.exp(Math.log(a.k) + (Math.log(b.k) - Math.log(a.k)) * u);
  if (Math.abs(Math.log(b.k / a.k)) < 1e-3) return { k, tx: a.tx + (b.tx - a.tx) * u, ty: a.ty + (b.ty - a.ty) * u };
  const sx = (b.tx * a.k - a.tx * b.k) / (a.k - b.k), sy = (b.ty * a.k - a.ty * b.k) / (a.k - b.k), f = k / a.k;
  return { k, tx: sx - (sx - a.tx) * f, ty: sy - (sy - a.ty) * f };
}
// 平常跟着目标走的快慢：时间常数（秒），约等于原来 60 帧时每帧挪 22%；按真实经过的时间算，帧率高低不影响快慢
const VIEW_TAU = 0.067;
// 点卡片时两个近景之间（缩放都在适配的 1.2 倍以上、差不多大）挪动超过视图宽度的 0.25（放大看着一张卡片、再点旁边的另一张），
// 改成定时 0.7 秒的移动，中途先拉远再推近，看得出是从哪里挪到哪里；拉远 10% 起，每挪一个视图宽度多 10%，最多 30%。
// 滚轮缩放不走这里：放大以后滚一格的平移也会超过 0.25 个视图宽，拉远会让鼠标下那一点跑掉
const VIEW_HOP = { dur: 700, min: 0.25 };
function newViewGoal(g, ms) {
  VIEW.seen = g; VIEW.hop = null;
  const kf = kFit(), far = Math.hypot(g.tx - VIEW.tx, g.ty - VIEW.ty) / (viewBox().cw || 1);
  if (g.hop && VIEW.k > kf * 1.2 && g.k > kf * 1.2 && Math.abs(Math.log(g.k / VIEW.k)) < 0.3 && far > VIEW_HOP.min)
    VIEW.hop = { from: { k: VIEW.k, tx: VIEW.tx, ty: VIEW.ty }, t0: ms, depth: Math.min(0.3, 0.1 + 0.1 * far) };
}

// 每帧把当前变换往目标挪一点（像地图那样平滑）；返回是否还在动
function stepView(H) {
  if (H !== VIEW.H) { VIEW.H = H; if (VIEW.auto) VIEW.goal = fitGoal(); }
  const g = VIEW.goal, ms = performance.now();
  let moving = false;
  if (g) {
    // 新目标：从这一刻的镜头出发（正在拉远的那一下也从它此刻的样子接着走，不跳）
    if (g !== VIEW.seen) { newViewGoal(g, ms); VIEW.stepAt = ms - 16; }
    const dt = Math.min(0.1, (ms - VIEW.stepAt) / 1000);
    VIEW.stepAt = ms;
    if (VIEW.hop) {
      const h = VIEW.hop, u = clamp01((ms - h.t0) / VIEW_HOP.dur), e = ease(u), v = viewAt(h.from, g, e);
      // 拉远：绕视图中心缩小，中途最远，两头不变
      const f = 1 - h.depth * Math.sin(Math.PI * e), cx = viewBox().cw / 2, cy = viewBox().ch / 2;
      Object.assign(VIEW, { k: v.k * f, tx: cx - (cx - v.tx) * f, ty: cy - (cy - v.ty) * f });
      moving = u < 1;
    } else {
      Object.assign(VIEW, viewAt(VIEW, g, 1 - Math.exp(-dt / VIEW_TAU)));
      moving = Math.abs(g.k - VIEW.k) > g.k * 0.001 || Math.abs(g.tx - VIEW.tx) > 0.3 || Math.abs(g.ty - VIEW.ty) > 0.3;
    }
    if (!moving) { Object.assign(VIEW, { k: g.k, tx: g.tx, ty: g.ty }); VIEW.goal = null; VIEW.hop = null; }
  }
  worldEl.style.transform = `translate(${VIEW.tx}px, ${VIEW.ty}px) scale(${VIEW.k})`;
  // 显示档位看卡片在屏幕上有多高
  const px = WL.cardH * VIEW.k, lod = px < 150 ? 0 : px < 270 ? 1 : 2;
  if (worldEl.dataset.lod !== String(lod)) { worldEl.dataset.lod = lod; worldEl.className = `lod${lod}`; UI.ver++; }
  setText($('zoom-val'), `${Math.round((VIEW.k / kFit()) * 100)}%`);
  return moving;
}

// ---- 交互：滚轮缩放（以鼠标为中心）、按住左键拖动、单击卡片飞过去、双击空白复位 ----
const drag = { on: false, x: 0, y: 0, moved: 0, target: null };
viewEl.addEventListener('wheel', (e) => {
  if (!boardInput()) { e.preventDefault(); return; }
  e.preventDefault();
  const r = viewEl.getBoundingClientRect(), sx = e.clientX - r.left;
  // 刻度带和产出列上：滚轮快速滚动卡片；其他地方：缩放
  if (reelZone(sx)) { if (REEL.overflow) REEL.s += e.deltaY * 0.9; else REEL.off -= e.deltaY * 0.9; }
  else if (!boardWheelOut(e)) zoomAt(sx, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
  wake();
}, { passive: false });
viewEl.addEventListener('pointermove', (e) => { if (!drag.on && boardInput()) REEL.hover = reelZone(e.clientX - viewEl.getBoundingClientRect().left); });
viewEl.addEventListener('pointerleave', () => { REEL.hover = false; });
viewEl.addEventListener('pointerdown', (e) => {
  if (!boardInput() || e.button !== 0 || e.target.closest('#hud')) return;
  Object.assign(drag, { on: true, x: e.clientX, y: e.clientY, moved: 0, target: e.target.closest('.card, .ghead') });
  viewEl.setPointerCapture(e.pointerId);
});
viewEl.addEventListener('pointermove', (e) => {
  if (!drag.on) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.moved > 4) {
    viewEl.classList.add('dragging');
    const g = VIEW.goal || VIEW;
    VIEW.goal = null; VIEW.auto = false;
    VIEW.tx = g.tx + dx; VIEW.ty = g.ty + dy; VIEW.k = g.k;
    wake();
  }
});
viewEl.addEventListener('pointerup', () => {
  if (drag.on && drag.moved <= 4 && drag.target) {
    if (drag.target.classList.contains('ghead')) toggleGroup(drag.target.dataset.key);
    else { const box = boxOf(drag.target.dataset.lane); if (box) zoomToBox(box); }
  }
  drag.on = false;
  viewEl.classList.remove('dragging');
  wake();
});
viewEl.addEventListener('dblclick', (e) => { if (boardInput() && !e.target.closest('.card, #hud')) { fitView(); wake(); } });
// 复位按钮和 0 / + / - 键：在宇宙层管星图的镜头，在看板管看板的
$('fit').addEventListener('click', () => { if (inUniverse()) uniFit(); else if (boardInput()) fitView(); wake(); });
addEventListener('keydown', (e) => {
  if (inUniverse()) {
    const w = viewEl.clientWidth / 2, h = viewEl.clientHeight / 2;
    if (e.key === '0' || e.key === 'Home') uniFit();
    else if (e.key === '+' || e.key === '=') uniZoomAt(w, h, 1.3);
    else if (e.key === '-') uniZoomAt(w, h, 1 / 1.3);
    else return;
    wake(); return;
  }
  if (!boardInput()) return;
  if (e.key === '0' || e.key === 'Home') fitView();
  else if (e.key === '+' || e.key === '=') zoomAt(viewEl.clientWidth / 2, viewEl.clientHeight / 2, 1.3);
  else if (e.key === '-') zoomAt(viewEl.clientWidth / 2, viewEl.clientHeight / 2, 1 / 1.3);
  else return;
  wake();
});
// 视图区域大小变了（窗口缩放、用量面板随模型数量变高变矮）就重新适配，缓动过去
// 视图大小变了：先作废这一帧量好的尺寸（viewBox），再按新尺寸重新适配
new ResizeObserver(() => { VIEWBOX.frame = -1; if (VIEW.auto) fitView(); wake(); }).observe(viewEl);

// 折叠或展开一组：记下组头现在的位置，排版时让它停在原处展开（鼠标移开后整体再慢慢回正）
function toggleGroup(key) {
  const g = FX.layout && FX.layout.groups.find((x) => x.key === key);
  if (g) REEL.anchor = { key, y: g.head.y };
  if (!UI.collapsed.delete(key)) UI.collapsed.add(key);
  UI.ver++; wake();
}

// 单击卡片时飞到这张卡片，放大到详情档位
function boxOf(id) {
  const L = FX.layout;
  if (!L) return null;
  return id === 'cc' ? L.cc : L.rows.get(id)?.card || null;
}

// ---- 06-cards.js
'use strict';
// 世界里的 DOM：Claude Code 卡片、席位卡片、产出框、组头。按车道 id 复用元素，只改变了的文字和位置。

const CHANNEL = { 'codex cli': 'Codex CLI', 'opencode cli': 'Opencode CLI', 'pi cli': 'Pi CLI', 'agy cli': 'Agy CLI', 'codebuddy cli': 'CodeBuddy CLI', api: 'API', host: 'Claude Code' };
// 用量表悬停时其余车道压暗的程度（卡片、产出框、光线共用）
const dimOf = (id) => (UI.hot && id !== UI.hot ? 0.32 : 1);
const place = (el, b) => { const s = el.style, x = `${b.x}px`, y = `${b.y}px`; if (s.left !== x) s.left = x; if (s.top !== y) s.top = y; };

function cardShell(id) {
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.lane = id;
  el.innerHTML = '<img class="av" alt=""><div class="hd"><div class="model"></div><div class="st"></div><div class="tl"></div><div class="rate"></div></div><ol class="term"></ol><div class="think"></div>';
  worldEl.append(el);
  return el;
}

function fillCard(el, lane, t) {
  const r = currentRun(lane, t) || latest(lane), key = avatarFor(r.model, r.agent_type), st = laneStatus(lane, t), s = laneStats(lane, t), isCC = lane.id === 'cc';
  el.style.setProperty('--tint', rgba(key));
  el.classList.toggle('hot', UI.hot === lane.id); el.classList.toggle('dim', dimOf(lane.id) < 1);
  el.classList.toggle('running', st.running);
  const img = el.querySelector('.av');
  if (img.dataset.key !== key) { img.src = avatarSrc(key); img.alt = look(key).name; img.dataset.key = key; }
  setText(el.querySelector('.model'), isCC ? 'Claude Code' : `${shortModel(r.model) || look(key).name}${r.effort ? ` ${r.effort}` : ''}`);
  el.querySelector('.model').title = Display.modelLabel(Display.displayRun(r).meta);
  const stEl = el.querySelector('.st');
  setText(stEl, `${st.mark} ${st.word} ${Display.clock(laneElapsed(lane, t) * 1000)}`);
  if (stEl.dataset.tone !== st.tone) stEl.dataset.tone = st.tone;
  const round = roundOf(lane, t);
  setText(el.querySelector('.tl'), isCC ? [shortModel(r.model), r.title].filter(Boolean).join(' · ')
    : [r.kind, r.role ? `[${r.role}]` : null, r.title, r.level, round > 1 ? `round ${round}` : null].filter(Boolean).join(' · '));
  const rate = el.querySelector('.rate'), sig = `${Math.round(s.rate)}|${s.avg == null ? '—' : Math.round(s.avg)}|${s.output}`;
  rate.title = s.usage_unattributed ? TEXT.usageUnattributed : `now ≈ ${Math.round(s.rate)} tok/s · gen avg ≈ ${s.avg != null ? Math.round(s.avg) : '—'} · out ${s.output == null ? '—' : fmtTok(s.output)}`;
  if (rate.dataset.sig !== sig) {
    rate.dataset.sig = sig;
    rate.innerHTML = '';
    const now = document.createElement('span');
    now.className = 'now';
    now.textContent = `now ≈ ${Math.round(s.rate)} tok/s`;
    rate.append(now, ` · gen avg ≈ ${s.avg != null ? Math.round(s.avg) : '—'} · out ${s.output == null ? '—' : fmtTok(s.output)}`);
  }
  // 详情档位给完整的对话流（最近 40 行），摘要档位给最后几行
  const lod = VIEW_LOD();
  if (lod === 2) fillTerm(el.querySelector('.term'), timeline(lane, t, { open: true }).slice(-40));
  else if (lod === 1) fillTerm(el.querySelector('.term'), timeline(lane, t, { limit: 6 }));
  setText(el.querySelector('.think'), thinkingLine(lane, t));
  decorateCard(el, lane, t);
}
const VIEW_LOD = () => Number(worldEl.dataset.lod || 0);

// 带颜色代码（03-timeline.js 的 TERM_C）的一行拆成文字和带色的片段：每段以 ESC[<代码>m 开头、ESC[0m 结束
const PAINT_CLASS = { 1: 'c-bold', 2: 'c-dim', 31: 'c-bad', 32: 'c-ok', 33: 'c-warn', 36: 'c-run' };
function painted(text) {
  const s = String(text ?? '');
  if (!s.includes('\x1b[')) return [s];
  const out = [], re = /\x1b\[(\d+)m/g;
  let at = 0, cls = null, m;
  const push = (part) => {
    if (!part) return;
    if (!cls) { out.push(part); return; }
    const span = document.createElement('span'); span.className = cls; span.textContent = part; out.push(span);
  };
  while ((m = re.exec(s))) { push(s.slice(at, m.index)); cls = m[1] === '0' ? null : PAINT_CLASS[m[1]] ?? null; at = re.lastIndex; }
  push(s.slice(at));
  return out;
}

function fillTerm(ol, lines) {
  const sig = lines.map((l) => `${l.ts}${l.text}${l.cls}`).join('\n');
  if (ol.dataset.sig === sig) return;
  ol.dataset.sig = sig;
  ol.innerHTML = '';
  let lastMin = '';
  for (const l of lines) {
    const li = document.createElement('li'), ts = document.createElement('span'), mk = document.createElement('span');
    li.className = l.cls;
    ts.className = 'ts';
    const m = hhmm(l.ts), act = l.cls.startsWith('act');
    ts.textContent = l.cls === 'plain' || act || m === lastMin ? '' : m;
    if (!act) lastMin = m;
    mk.className = 'mk';
    mk.textContent = l.cls === 'plain' ? '' : act ? '│ ' : l.cls.startsWith('user') ? '▌ ' : '◆ ';
    li.append(ts, mk, ...painted(l.text));
    ol.append(li);
  }
}

function dedupeFiles(list) { const seen = new Map(); for (const f of list) seen.set(f.path, f); return [...seen.values()]; }

// lead：标题下面先写的几行（派发计划、Claude Code 席报告、裁决这些流程上的事），排在文件和报告前面
// thumbs：出图任务的缩略图地址（/image?run=&n=），放在输出框右侧
function fillOut(box, title, files, report, lead = [], thumbs = []) {
  const sig = `${title}|${lead.join('|')}|${files.map((f) => f.kind + f.path).join(',')}|${report}|${thumbs.join(',')}`;
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.innerHTML = '';
  // 有缩略图时给文字让出右边（每张约 39 像素宽）
  box.style.paddingRight = thumbs.length ? `${thumbs.length * 39 + 8}px` : '';
  const h = document.createElement('h4');
  h.textContent = title;
  box.append(h);
  if (thumbs.length) {
    const strip = document.createElement('div');
    strip.className = 'thumbs';
    for (const src of thumbs) { const img = document.createElement('img'); img.src = src; img.alt = ''; img.loading = 'lazy'; img.onerror = () => img.remove(); strip.append(img); }
    box.append(strip);
  }
  for (const line of lead) { const d = document.createElement('div'); d.className = 'lead'; d.textContent = line; box.append(d); }
  for (const f of files.slice(-6)) {
    const d = document.createElement('div'), i = document.createElement('i');
    d.className = 'f';
    i.textContent = EDIT_MARKS[f.kind] || '✎';
    d.append(i, baseName(f.path));
    d.title = f.path;
    box.append(d);
  }
  if (files.length > 6) { const d = document.createElement('div'); d.className = 'f empty'; d.textContent = `… +${files.length - 6} files`; box.append(d); }
  if (report) { const d = document.createElement('div'); d.className = 'rep'; d.textContent = report; box.append(d); }
  if (!files.length && !report && !lead.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'nothing yet'; box.append(d); }
}

// 席位产出框只写最近一次任务的产出（上一轮的已经被 Claude Code 读走了）
function fillLaneOut(box, lane, t) {
  const live = lane.runs.filter((x) => x.started_at <= t), r = live[live.length - 1] || latest(lane);
  box.classList.toggle('dim', dimOf(lane.id) < 1);
  box.style.setProperty('--tint', rgba(avatarFor(r.model, r.agent_type)));
  const ended = r.ended_at != null && r.ended_at <= t, files = [];
  if (ended) for (const c of r.changed || []) files.push({ kind: c.kind || 'update', path: c.path });
  for (const e of lane.events) if (e.run === r.id && e.k === 'edit' && e.ts <= t) files.push(editParts(e.t));
  let report = ended ? r.report_head || '' : '';
  // 问题总数用完整计数（review.findings 只带前 8 条），老消息没有计数时用 report_head 里写的原数
  const total = r.display?.report?.findings_counts?.total;
  if (ended && r.review) report = total != null ? `${r.review.verdict} · ${total} findings` : r.report_head || `${r.review.verdict} · ${r.review.findings.length} findings`;
  const thumbs = ended && r.kind === 'image' && r.images ? Array.from({ length: Math.min(3, r.images) }, (_, i) => `image?run=${encodeURIComponent(r.id)}&n=${i}`) : [];
  fillOut(box, `OUTPUT · round ${roundOf(lane, t)}`, dedupeFiles(files), report, scopeLead(lane, t), thumbs);
}

// 返回卡片建完没有：新建卡片一次最多花约 6 毫秒（至少建 6 张），没建完的下一帧接着建。
// 飞进长对话时第一次要建上百张卡片，一次建完就是三十多毫秒；那时卡片层还没淡入，分几帧建看不出来
function renderWorld(t, L) {
  const seen = new Set(['cc']), deadline = performance.now() + 6;
  let created = 0, done = true;
  // Claude Code
  let cc = UI.cards.get('cc');
  if (!cc) { cc = cardShell('cc'); UI.cards.set('cc', cc); }
  place(cc, L.cc);
  const ccLane = B.laneById.get('cc');
  if (ccLane && latest(ccLane)) fillCard(cc, ccLane, t);
  else {
    cc.style.setProperty('--tint', rgba('claude'));
    const img = cc.querySelector('.av');
    if (!img.dataset.key) { img.src = avatarSrc('claude'); img.dataset.key = 'claude'; }
    setText(cc.querySelector('.model'), 'Claude Code');
    setText(cc.querySelector('.st'), 'no transcript yet');
  }
  let ccOut = UI.outs.get('cc');
  if (!ccOut) { ccOut = document.createElement('div'); ccOut.className = 'outbox cc'; worldEl.append(ccOut); UI.outs.set('cc', ccOut); }
  place(ccOut, L.ccOut);
  ccOut.style.setProperty('--tint', rgba('claude'));
  // 悬停用量表的某一席时，Claude Code 的产出框和其余产出框一样压暗
  ccOut.classList.toggle('dim', dimOf('cc') < 1);
  const span = ccLife(t), from = span.from ?? -Infinity, to = span.to ?? t;
  const ccFiles = ccLane ? ccLane.events.filter((e) => e.k === 'edit' && e.ts > from && e.ts <= to).map((e) => editParts(e.t)) : [];
  fillOut(ccOut, 'CLAUDE CODE · OUTPUT', dedupeFiles(ccFiles), '', ccLead(t, from, to));

  // 刻度带上的各组标题。超出预算以后，还没建过的组整组留到下一帧（组标题要算各席的状态，第一次也不便宜）；建过的照常更新
  const headSeen = new Set();
  for (const g of L.groups) {
    let h = UI.heads.get(g.key);
    if (!h && created >= 6 && performance.now() > deadline) {
      // 留到下一帧的组里已经有的卡片（车道刚换到这个新组）照样算在版面上，不藏
      done = false;
      for (const lane of g.lanes) if (UI.cards.has(lane.id)) seen.add(lane.id);
      continue;
    }
    headSeen.add(g.key);
    if (!h) { h = document.createElement('div'); h.className = 'ghead'; h.dataset.key = g.key; h.innerHTML = '<b></b>'; worldEl.append(h); UI.heads.set(g.key, h); created++; }
    place(h, g.head);
    h.classList.toggle('old', g.old);
    h.classList.toggle('collapsed', g.collapsed);
    const head = groupHead(g.lanes, t);
    setText(h.querySelector('b'), `${g.collapsed ? '▸' : '▾'} ${head.title}`);
    h.title = [`${head.title} · ${head.counts}`, head.sceneWhy].filter(Boolean).join('\n');
    for (const lane of g.lanes) {
      const row = L.rows.get(lane.id);
      let card = UI.cards.get(lane.id), out = UI.outs.get(lane.id);
      if (!row) { if (card) card.hidden = true; if (out) out.hidden = true; continue; }
      if (!card && created >= 6 && performance.now() > deadline) { done = false; continue; }
      seen.add(lane.id);
      if (!card) { card = cardShell(lane.id); UI.cards.set(lane.id, card); created++; }
      if (!out) { out = document.createElement('div'); out.className = 'outbox'; worldEl.append(out); UI.outs.set(lane.id, out); }
      card.hidden = out.hidden = false;
      place(card, row.card); place(out, row.out);
      card.classList.toggle('ghost', !!lane.ghost); out.classList.toggle('ghost', !!lane.ghost);
      if (lane.ghost) { fillGhost(card, lane, t); continue; }
      fillCard(card, lane, t);
      fillLaneOut(out, lane, t);
    }
  }
  // 不在版面上的卡片和产出框藏起来；虚影卡被真卡片接替后整个删掉（不然它的产出框会和真的叠在一起）
  for (const map of [UI.cards, UI.outs]) for (const [id, el] of map) {
    if (seen.has(id)) continue;
    if (id.startsWith('ghost:')) { el.remove(); map.delete(id); } else el.hidden = true;
  }
  for (const [id, el] of UI.heads) el.hidden = !headSeen.has(id);
  return done;
}

function groupHead(all, t) {
  const lanes = all.filter((l) => !l.ghost), planned = all.length - lanes.length;
  const plans = plansAt(t).filter((p) => all.some((l) => p.id === (l.ghost ? l.plan : currentRun(l, t).plan)));
  const runs = lanes.map((l) => { const run = Display.displayRun(currentRun(l, t)); run.meta.round = roundOf(l, t); return run; });
  const head = Display.groupTask(runs, plans.map((p) => p.ev));
  if (!lanes.length) {
    const p = plans.find((x) => x.id === all[0].plan);
    return { title: [p && p.module, 'planned', p && p.ev.cell, head.text].filter(Boolean).join(' · '), sceneWhy: head.sceneWhy, counts: `${planned} planned` };
  }
  // 和原生终端的组视图一样：执行拆成几份的写 split，标题是各份标题用" / "连起来；讨论和审查带角色的写 roles，否则 panel；
  // 各份等级不同时不写等级（写在各自的分工行里）
  const st = lanes.map((l) => laneStatus(l, t)), running = st.filter((s) => s.running).length;
  return { title: head.text, sceneWhy: head.sceneWhy,
    counts: `${planned ? `${planned} planned · ` : ''}${running ? `${running} running · ` : ''}${st.length - running} finished` };
}

// 计划里还没启动的席位：头像和模型先显示出来（虚线框），状态写 planned
function fillGhost(el, lane, t) {
  const s = lane.seat, key = avatarFor(s.model, U.agents.find((a) => a.id === s.agent)?.type);
  el.style.setProperty('--tint', rgba(key));
  el.classList.remove('running');
  const img = el.querySelector('.av');
  if (img.dataset.key !== key) { img.src = avatarSrc(key); img.alt = look(key).name; img.dataset.key = key; }
  setText(el.querySelector('.model'), shortModel(s.model) || look(key).name);
  // 审查的补漏席：其他席都结束（去重以后）才启动，先写清楚在等什么；其他席都结束了就轻轻发光
  const gap = gapState(lane, t);
  el.classList.toggle('gap-ready', gap === 'ready');
  const state = Display.outcomeStyle({ status: 'not_started' });
  setText(el.querySelector('.st'), `${state.mark} ${state.word} · seat ${s.seat}${s.required ? ' · required' : ''}`);
  el.querySelector('.st').dataset.tone = 'dim';
  setText(el.querySelector('.tl'), gap === 'ready' ? TEXT.gapReady : gap ? TEXT.gapWaiting : [s.role ? `[${s.role}]` : null, 'waiting to launch'].filter(Boolean).join(' · '));
  const rate = el.querySelector('.rate');
  if (rate.dataset.sig !== '') { rate.dataset.sig = ''; rate.innerHTML = ''; }
  fillTerm(el.querySelector('.term'), []);
  setText(el.querySelector('.think'), '');
}

// Claude Code 产出框的流程行：最近一份计划的决策记录、Claude Code 席报告、派发计划（新的在上）
function ccLead(t, from = -Infinity, to = t) {
  // 在等你回答弹窗时，第一行写出来（不管有没有派发计划）
  const ask = askAt(B.laneById.get('cc'), t), p = plansAt(t).pop();
  if (!p) return ask ? [TEXT.asking(ask.t)] : [];
  const lines = ask ? [TEXT.asking(ask.t)] : [];
  if (p.record != null && p.record > from && p.record <= to) {
    const round = Math.max(...p.verdicts.map((v) => v.round || 1)), c = { a: 0, p: 0, r: 0 };
    for (const v of p.verdicts) if ((v.round || 1) === round) { c.a += v.a.length; c.p += v.p.length; c.r += v.r.length; }
    lines.push(TEXT.decision(round, c));
  }
  const h = p.hosts.filter((x) => x.started_at > from && x.started_at <= to).pop();
  if (h) lines.push(TEXT.hostReport(h.round || 1, h.report_head));
  return lines;
}

// 每帧：卡片、产出框、组头跟着刻度带滚动挪位置；透明度 = 滚到两头的渐隐 × 刚被计划拉出来时的淡入
const setOpacity = (el, a) => {
  const s = a >= 0.999 ? '' : a.toFixed(3), v = a < 0.01 ? 'hidden' : '';
  if (el.style.opacity !== s) el.style.opacity = s;
  if (el.style.visibility !== v) el.style.visibility = v;
};
function placeWorld(L, t) {
  const arrive = arrivals(t);
  for (const g of L.groups) {
    const h = UI.heads.get(g.key);
    if (h) { place(h, g.head); setOpacity(h, g.vis * (g.old ? 0.45 : 1) * (1 - (g.leave || 0))); }
    for (const lane of g.lanes) {
      const row = L.rows.get(lane.id), a = arrive.get(lane.id) || { card: 1, out: 1 };
      if (!row) continue;
      const card = UI.cards.get(lane.id), out = UI.outs.get(lane.id);
      // 正在离开的组：卡片缩一点、淡出（光点在 08-life.js 的 drawLeave 里画）
      const stay = 1 - (row.leave || 0);
      if (card) { place(card, row.card); setOpacity(card, row.vis * a.card * stay); setScale(card, 1 - 0.12 * (row.leave || 0)); }
      if (out) { const k = outLook(lane.ghost ? { phase: 'none' } : outLife(lane, t)); place(out, row.out); setOpacity(out, row.vis * a.out * k.a * stay); setScale(out, k.s); }
    }
  }
  const bh = UI.heads.get('#band');
  if (bh) setOpacity(bh, bandReveal(L, t));
  const cc = UI.outs.get('cc');
  if (cc) { const k = outLook(ccLife(t)); place(cc, L.ccOut); setOpacity(cc, k.a * L.ccDim); setScale(cc, k.s); }
  // Claude Code 卡片离场：前 40% 缩成光点淡掉（光点在 08-life.js 的 drawCcAway 里画），回来时倒过来
  const ccCard = UI.cards.get('cc');
  if (ccCard) { const k = clamp01((L.ccAway || 0) / 0.4); setOpacity(ccCard, 1 - k); setScale(ccCard, 1 - 0.85 * k); }
}
const setScale = (el, s) => { const v = s >= 0.999 ? '' : `scale(${s.toFixed(3)})`; if (el.style.transform !== v) el.style.transform = v; };

// ---- 06-states.js
'use strict';
// 模块状态在卡片上的表现（G 步）：
//  Claude Code 在等你确认（弹窗出来到被回答之间）：卡片外一圈琥珀色呼吸光，卡片上方写弹窗标题；
//  席位排队等服务：琥珀色虚线边框闪烁（绕卡片转的光点在 08-states.js 画）；
//  被取消：整张卡褪成灰色；失败、额度用完、卡死、中断：红色边框（结束那一刻的红色冲击波在 08-states.js 画）；
//  执行任务：输出框第一行写它负责改的路径，改到范围外的文件时状态行标"越界 N"。

// 时刻 t 时 Claude Code 是否在等你回答弹窗：最近一条 ask 后面还没有 ask_done
function askAt(lane, t) {
  if (!lane || lane.id !== 'cc') return null;
  for (let i = lane.events.length - 1; i >= 0; i--) {
    const ev = lane.events[i];
    if (ev.ts > t) continue;
    if (ev.k === 'ask_done') return null;
    if (ev.k === 'ask') return ev;
  }
  return null;
}

// 运行在时刻 t 的处境：还没开始 null；在跑 running；排队等服务 queued；结束后 done / cancelled / failed。
// 排队看事件：最近一条有意义的事件是 queued 就还在排（回放里 run 消息的 queued 标记只反映结尾）
function fateAt(lane, r, t) {
  if (!r || r.started_at > t) return null;
  if (r.ended_at != null && r.ended_at <= t) {
    const kind = seatStatus(lane, r, t).kind;
    return ['ok', 'partial', 'blocked', 'resumed'].includes(kind) ? kind === 'ok' ? 'done' : kind : r.status === 'cancelled' ? 'cancelled' : 'failed';
  }
  for (let i = lane.events.length - 1; i >= 0; i--) {
    const ev = lane.events[i];
    if (ev.run !== r.id || ev.ts > t || ev.k === 'usage') continue;
    return ev.k === 'queued' ? 'queued' : 'running';
  }
  return r.queued ? 'queued' : 'running';
}

// 改到写入范围外的文件：进行中按编辑事件判断（相对工作目录的路径；绝对路径的改动不判断），
// 结束以后再加上结果里写到工作目录外、又不在范围里的文件（和终端 ⚠ 行同一份清单）
const scopePath = (p) => String(p).replace(/\\/g, '/').replace(/^\.\//, '').replace(/\/+$/, '').toLowerCase();
function outOfScope(lane, r, t) {
  if (!r) return [];
  const run = r.ended_at != null && r.ended_at <= t && r.display ? Display.displayRun(r) : null;
  const out = new Set(run ? Display.outsideFiles(run.result, run.meta) : []);
  if (!r.scope?.length) return [...out];
  const scope = r.scope.map(scopePath);
  for (const ev of lane.events) {
    if (ev.run !== r.id || ev.k !== 'edit' || ev.ts > t) continue;
    // 比较时不分大小写，显示时用原样的路径
    const raw = String(ev.t).replace(/^\w+ /, '').replace(/\\/g, '/').replace(/^\.\//, ''), p = scopePath(raw);
    if (/^[a-z]:\//.test(p) || p.startsWith('/')) continue;
    if (!scope.some((s) => p === s || p.startsWith(`${s}/`))) out.add(raw);
  }
  return [...out];
}

// fillCard 之后调用：状态写成类名（样式表画边框和颜色），越界数接在状态行后面
function decorateCard(el, lane, t) {
  if (lane.id === 'cc') {
    const ask = askAt(lane, t);
    el.classList.toggle('asking', !!ask);
    const label = ask ? TEXT.asking(ask.t) : '';
    if ((el.dataset.ask || '') !== label) { if (label) el.dataset.ask = label; else delete el.dataset.ask; }
    return;
  }
  const live = lane.runs.filter((x) => x.started_at <= t && x.kind !== 'answer'), r = live[live.length - 1];
  const fate = fateAt(lane, r, t);
  for (const c of ['queued', 'cancelled', 'failed', 'partial', 'blocked', 'resumed']) el.classList.toggle(c, fate === c);
  // 改到范围外的文件：状态行最前面一个琥珀色的 ⚠N（和终端的 ⚠ 同色；放在前面，卡片窄时不会被行尾的省略号吃掉），
  // 状态本身的颜色不变；悬停写明越界几个、是哪些文件
  const files = outOfScope(lane, r, t), st = el.querySelector('.st'), over = files.length ? String(files.length) : '';
  if ((st.dataset.over || '') !== over) { if (over) st.dataset.over = over; else delete st.dataset.over; }
  st.title = files.length ? TEXT.outOfScopeList(files.slice(0, 5), files.length) : '';
}

// 补漏席（计划里角色写"补漏"的席位）还没启动时在等什么：其他席还在跑 waiting；都结束了 ready；不是补漏席 null
function gapState(lane, t) {
  if (!lane.ghost || !GAP_ROLE.test(lane.seat?.role || '')) return null;
  const p = plansAt(t).find((x) => x.id === lane.plan), others = p ? p.runs.filter((r) => r.seat !== lane.seat.seat && r.started_at <= t) : [];
  return others.length && others.every((r) => r.ended_at != null && r.ended_at <= t) ? 'ready' : 'waiting';
}

// 输出框第一行：执行任务负责改的路径（并发拆分时各份互不重叠）
function scopeLead(lane, t) {
  const live = lane.runs.filter((x) => x.started_at <= t && x.kind !== 'answer'), r = live[live.length - 1];
  if (!r || r.kind !== 'exec' || !r.scope?.length) return [];
  const names = r.scope.map((p) => String(p).replace(/\\/g, '/').replace(/\/+$/, '').split('/').slice(-2).join('/'));
  const over = outOfScope(lane, r, t);
  return [`✎ ${names.join(' · ')}`, ...(over.length ? [TEXT.outOfScopeList(over.slice(0, 2), over.length)] : [])];
}

// ---- 07-table.js
'use strict';
// 底部用量表和顶栏。用量表每条车道一行，最后一行合计；排法和终端区一样：Claude Code 在最前，然后是正在跑的组和任务，
// 再是已经结束的（最新结束的在前）。组前面有一行简短的组标题（类型 · 标题，右边是各状态的个数），组里的席位按席位号排。

const TABLE_HEAD = ['', 'model', 'status', 'now ≈tok/s', 'tok/s over time', 'gen avg ≈tok/s', 'input · cache', 'output', 'cost', 'time'];
// 费用：一律按模型官方 API 价格算（插件自带的价格表），悬停在表头和单元格上有说明；+ 表示有的模型不在价格表里
// 不到 1 美分的按两位有效数字写（便宜的 API 模型一次常常只有零点零几美分），免得显示成 $0.00
const fmtUsd = (n) => (n > 0 && n < 0.01 ? n.toPrecision(2) : n.toFixed(2));
// 算不出费用：结束了的写 ?（合计的 + 就是它带来的，用户能找到是哪一行），还在跑的写 —
const fmtCost = (cost, partial = false, ended = true) => (cost == null ? (partial && ended ? '?' : '—') : `$${fmtUsd(cost)}${partial ? '+' : ''}`);
// 面板里下面还有没露出来的行时，最后一行淡出
const markMore = (body) => body.classList.toggle('more', body.scrollHeight - body.scrollTop - body.clientHeight > 2);
// 速度的估算窗口不同，和费用一样把口径放在表头悬停说明里。
function costHeadTitle(head) {
  const titles = { cost: TEXT.costTitle, 'now ≈tok/s': TEXT.nowTitle, 'tok/s over time': TEXT.recentTitle, 'gen avg ≈tok/s': TEXT.genAvgTitle };
  for (const c of head.children) if (titles[c.textContent]) c.title = titles[c.textContent];
}
function renderTable(t) {
  const table = $('usage');
  if (!table.firstChild) {
    table.innerHTML = '<div class="tr th"></div><div class="tbody"></div><div class="tr total"></div>';
    const body = table.querySelector('.tbody');
    body.addEventListener('scroll', (e) => markMore(e.target), { passive: true });
    // 鼠标停在某一行时突出画面上的这条车道（和宇宙表悬停星系一样），单击不做任何事
    const hover = (id) => { if (UI.hot !== id) { UI.hot = id; UI.ver++; wake(); } };
    body.addEventListener('pointerover', (e) => { if (table.dataset.mode !== 'uni') hover(e.target.closest('.tr[data-lane]')?.dataset.lane || null); });
    body.addEventListener('pointerleave', () => hover(null));
    for (const h of TABLE_HEAD) { const c = document.createElement('span'); c.textContent = h; table.firstChild.append(c); }
    costHeadTitle(table.firstChild);
    UI.tableAt = performance.now(); // 面板从这时起淡入（08-uni-fly.js 的 applyShare）
  }
  const rows = tableRows(t), lanes = rows.filter((x) => x.lane).map((x) => x.lane);
  const body = table.querySelector('.tbody');
  const tot = { input: 0, cached: 0, output: 0, usage_unattributed: false, cost: null, partial: false, rate: 0 };
  // 新建的行一次最多花约 12 毫秒（刚飞进长对话时有上百行），剩下的下一帧接着建；返回 false 表示还没建完。
  // 每次至少新建 10 行：更新已有的行就用完预算时也往前走
  const deadline = performance.now() + 12;
  let done = true, created = 0;
  rows.forEach((row, i) => {
    if (!done) return;
    if (row.head) { const tr = headRow(row); if (body.children[i] !== tr) body.insertBefore(tr, body.children[i] || null); return; }
    const lane = row.lane;
    let tr = UI.tableRows.get(lane.id);
    if (!tr && created >= 10 && performance.now() > deadline) { done = false; return; }
    if (!tr) {
      created++;
      tr = document.createElement('div');
      tr.className = 'tr';
      tr.innerHTML = '<span class="av"><img alt=""></span>' + '<span></span>'.repeat(TABLE_HEAD.length - 1);
      tr.dataset.lane = lane.id;
      UI.tableRows.set(lane.id, tr);
    }
    tr.classList.toggle('hot', UI.hot === lane.id);
    const r = currentRun(lane, t) || latest(lane), key = avatarFor(r.model, r.agent_type), s = laneStats(lane, t), st = laneStatus(lane, t);
    tr.style.setProperty('--tint', rgba(key));
    tr.classList.toggle('running', st.running);
    const img = tr.querySelector('img');
    if (img.dataset.key !== key) { img.src = avatarSrc(key); img.dataset.key = key; }
    const c = tr.children, inAll = s.input + s.cached + s.cache_write;
    // 同一个模型常有好几条车道：写上接入方式，悬停看这条车道的任务标题
    setText(c[1], Display.modelLabel({ ...Display.displayRun(r).meta, ...(lane.id === 'cc' ? { agent_type: 'host' } : {}) }));
    c[1].title = lane.id === 'cc' ? '' : [r.title, r.group, r.id].filter(Boolean).join(' · ');
    setText(c[2], st.word);
    if (c[2].dataset.tone !== st.tone) c[2].dataset.tone = st.tone;
    setText(c[3], s.rate >= 0.5 ? `≈ ${Math.round(s.rate)}` : '—');
    sparkSvg(c[4], sparkline(lane, t));
    setText(c[5], s.avg != null ? `≈ ${Math.round(s.avg)}` : '—');
    setText(c[6], !s.usage_unattributed && inAll ? `${fmtTok(inAll)} · ${Math.round((100 * s.cached) / inAll)}%` : '—');
    c[6].title = s.usage_unattributed ? TEXT.usageUnattributed : '';
    setText(c[7], s.output ? fmtTok(s.output) : '—');
    c[7].title = s.usage_unattributed ? TEXT.usageUnattributed : '';
    setText(c[8], fmtCost(s.cost, s.costPartial, !s.running)); c[8].title = TEXT.costTitle;
    setText(c[9], Display.clock(laneElapsed(lane, t, true) * 1000));
    if (body.children[i] !== tr) body.insertBefore(tr, body.children[i] || null);
    tot.input += inAll; tot.cached += s.cached; tot.output += s.output; tot.rate += s.rate;
    tot.usage_unattributed ||= s.usage_unattributed;
    if (s.cost != null) tot.cost = (tot.cost ?? 0) + s.cost;
    if (s.costPartial) tot.partial = true;
  });
  while (body.children.length > rows.length) body.lastChild.remove();
  markMore(body);
  // 行放不下时右下角出现"展开全部"；展开以后一直留着，好收起
  if (document.body) {
    const all = document.body.classList.contains('table-all'), toggle = tableToggle();
    toggle.hidden = !all && body.scrollHeight <= body.clientHeight + 2;
    setText(toggle, all ? TEXT.tableLess : TEXT.tableAll);
  }
  const total = table.querySelector('.total');
  const sig = `${lanes.length}|${Math.round(tot.rate)}|${tot.input}|${tot.output}|${tot.usage_unattributed}|${fmtCost(tot.cost, tot.partial)}`;
  if (total.dataset.sig !== sig) {
    total.dataset.sig = sig;
    total.innerHTML = '';
    const cells = ['', 'total', `${lanes.length} lanes`, `≈ ${Math.round(tot.rate)}`, '', '', !tot.usage_unattributed && tot.input ? `${fmtTok(tot.input)} · ${Math.round((100 * tot.cached) / tot.input)}%` : '—', tot.usage_unattributed || !tot.output ? '—' : fmtTok(tot.output), fmtCost(tot.cost, tot.partial), ''];
    for (const x of cells) { const s = document.createElement('span'); s.textContent = x; total.append(s); }
    total.children[8].title = TEXT.costTitle;
    total.children[7].title = tot.usage_unattributed ? TEXT.usageUnattributed : '';
    total.children[6].title = tot.usage_unattributed ? TEXT.usageUnattributed : '';
  }
  return done;
}

// 单对话视图里用量面板的"展开全部"按钮：点开以后面板按全部行的高度排开（往下推开终端区），再点一下收起
function tableToggle() {
  let btn = $('tall');
  if (!btn) {
    btn = document.createElement('button'); btn.id = 'tall'; btn.type = 'button'; btn.title = TEXT.tableAllTitle;
    btn.addEventListener('click', () => { document.body.classList.toggle('table-all'); UI.ver++; wake(); });
    $('table').append(btn);
  }
  return btn;
}

// 用量表的行：车道行 { lane }，组标题行 { head, id, text, counts }
function tableRows(t) {
  const started = (l) => latest(l) && latest(l).started_at <= t, out = [], cc = B.laneById.get('cc');

  setText($('conv'), Display.D.conversation(title));

// 一组的席位块（Claude Code 席在前）和席位号，按号排好；终端栏和用量表的组共用，号码和顺序两边一样。
// 同一帧里两边各要一次：按（此刻、数据版本、组）记一份，下一帧重算
const SEATS_AT = { t: null, v: -1, groups: new Map() };
function groupSeats(u, t) {
  if (SEATS_AT.t !== t || SEATS_AT.v !== B.version) { SEATS_AT.t = t; SEATS_AT.v = B.version; SEATS_AT.groups.clear(); }
  if (!SEATS_AT.groups.has(u.id)) SEATS_AT.groups.set(u.id, seatsOf(u, t));
  return SEATS_AT.groups.get(u.id);
}
function seatsOf(u, t) {
  const history = [...B.runs.values()].filter((r) => r.group === u.group && r.started_at <= t).map(Display.displayRun);
  const chosen = new Set(Display.current(history).map((r) => r.id));
  const hosts = history.filter((r) => r.meta.participant === 'host' && chosen.has(r.id));
  const blocks = [...hosts.map((r) => ({ id: `host:${r.id}`, host: B.runs.get(r.id) })), ...u.lanes.map((lane) => ({ id: lane.id, lane }))]
    .filter((b) => chosen.has((b.host || currentRun(b.lane, t)).id));
  const all = blocks.map((b) => Display.displayRun(b.host || currentRun(b.lane, t)));
  const numberKey = `${all[0]?.meta.session || ''}:${u.group}`;
  const plans = groupPlans(u.group, t);
  const numbers = Display.seatNumbers(all, history, PANEL.numbers.get(numberKey), plans);
  PANEL.numbers.set(numberKey, numbers);
  blocks.sort((a, b) => numbers.runs.get((a.host || currentRun(a.lane, t)).id) - numbers.runs.get((b.host || currentRun(b.lane, t)).id));
  all.sort((a, b) => numbers.runs.get(a.id) - numbers.runs.get(b.id));
  const queue = dispatchQueue(t).filter((q) => q.group === u.group || q.group == null && all.some((r) => r.meta.plan === q.plan))
    .filter((q) => !Display.queuedStarted(q, history));

  const states = blocks.map((b) => b.host ? { kind: 'ok' } : seatStatus(b.lane, currentRun(b.lane, t), t));
  return { history, blocks, all, plans, numbers, queue, states };
}

'use strict';
// 宇宙层右上的名额带（只在宇宙层显示）：每个协作方一行，几个并发名额几格；被哪个对话占着就亮成那个对话的标记色，排队等服务的格子闪烁。
// 每个对话有一个按 id 定的标记色，名额格、用量表里同一个对话颜色一样；鼠标移上去时星图里那个星系高亮。
// 底部用量表的顺序（07-uni-table.js）：进行中的对话（等你确认、派发中、思考中）在前，固定按最近一轮用户消息的时间排，新的在上，
// 状态来回切换、有新动静时都不挪位置；空闲的在后，最近活动的在前。

const STATE_WORD = TEXT.states;
const SIDE = { slots: new Map(), sigSlots: '' };
// 标记色按对话出现的先后分配：相邻两个隔一个黄金角（约 137.5°），颜色总是拉得开；分到以后这个页面里不再变
const MARKS = new Map();
function markOf(id, a = 1) {
  if (!MARKS.has(id)) {
    // 第一次见到时，同一批里按开始时间排，早的先分
    const fresh = [...U.sessions.values()].filter((s) => !MARKS.has(s.id)).sort((x, y) => x.started_at - y.started_at || (x.id < y.id ? -1 : 1));
    for (const s of fresh.some((s) => s.id === id) ? fresh : [{ id }]) MARKS.set(s.id, Math.round((MARKS.size * 137.508 + 200) % 360));
  }
  return `hsl(${MARKS.get(id)} 72% 66% / ${a})`;
}
const roundAt = (s) => s.prompt_at ?? s.started_at ?? 0; // 旧服务没有 prompt_at 时退回对话开始的时间
const byState = (a, b) => (a.state === 'idle') - (b.state === 'idle')
  || (a.state === 'idle' ? b.last_at - a.last_at : roundAt(b) - roundAt(a)) || (a.id < b.id ? -1 : 1);
// 和桌面版侧栏一样按父子归类：从别的对话里启动的子对话（服务端给的 parent）排在父对话下面、缩进一级。
// 一家的位置按其中排得最前的那个（子对话在干活时整家往上排），同一层的兄弟也这样排；
// 父对话不在列表里（超出时间窗口）的子对话按顶层排。返回 [{ s, depth }]
function familyOrder(list) {
  const ids = new Set(list.map((s) => s.id)), kids = new Map(), lead = new Map();
  const up = (s) => (s.parent && s.parent !== s.id && ids.has(s.parent) ? s.parent : null);
  for (const s of list) { const p = up(s); if (p) { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(s); } }
  const leadOf = (s, seen = new Set()) => {
    if (lead.has(s.id)) return lead.get(s.id);
    seen.add(s.id);
    let best = s;
    for (const k of kids.get(s.id) || []) if (!seen.has(k.id)) { const b = leadOf(k, seen); if (byState(b, best) < 0) best = b; }
    lead.set(s.id, best);
    return best;
  };
  const byLead = (a, b) => byState(leadOf(a), leadOf(b)) || byState(a, b);
  const out = [], done = new Set();
  const visit = (s, depth) => {
    if (done.has(s.id)) return;
    done.add(s.id); out.push({ s, depth });
    for (const k of (kids.get(s.id) || []).sort(byLead)) visit(k, depth + 1);
  };
  for (const s of list.filter((x) => !up(x)).sort(byLead)) visit(s, 0);
  // 父子关系成环（不该有，防一手）时剩下的按顶层补上
  for (const s of list.filter((x) => !done.has(x.id)).sort(byState)) visit(s, 0);

}
// 在跑的席位数用不截断的计数（runs 摘要最多 16 条，会漏）
const runningOf = (s) => s.counts?.running ?? s.runs.filter((r) => r.status === 'running').length;
// 协作方代号去掉末尾表示接入方式的几段（-codex-cli、-opencode-cli-ocgo、-pi-cli-api 这类），名额带上更短；

const VIA = { 'codex cli': 'codex', 'opencode cli': 'opencode', 'pi cli': 'pi', 'agy cli': 'agy', 'codebuddy cli': 'codebuddy', 'dsh cli': 'dsh', 'zcode cli': 'zcode', api: 'api' };

    const cls = `tr s-${s.state}${depth ? ' kid' : ''}${s.alert ? ' alert' : ''}${UV.hot?.s.id === s.id ? ' hot' : ''}`;
    tr.style.setProperty('--depth', depth);
    if (tr.className !== cls) tr.className = cls;
    setText(c[1], s.title || s.id.slice(0, 8));
    setText(c[2], U.projects.get(s.project)?.name || s.project);
    fillUniState(c[3], s);
    setText(c[4], n ? `● ${n}` : '—');
    setText(c[5], `${s.counts.done} · ${s.counts.failed}`);
    setText(c[6], inAll ? `${fmtTok(inAll)} · ${Math.round((100 * (u.cached || 0)) / inAll)}%` : '—');
    setText(c[7], u.output ? fmtTok(u.output) : '—');
    // 有一部分算不出价格时（还在跑、模型不在价格表里）在后面加 +
    setText(c[8], fmtCost(s.cost_usd ?? null, s.cost_partial)); c[8].title = TEXT.costTitle;
    setText(c[9], fmtAgo(t - s.last_at));
    if (body.children[i] !== tr) body.insertBefore(tr, body.children[i] || null);
    tot.running += n; tot.done += s.counts.done; tot.failed += s.counts.failed;
    tot.input += inAll; tot.cached += u.cached || 0; tot.output += u.output || 0;

  // 星图里悬停到某个星系时，它那一行滚出了表格的可视区就滚过去，联动才看得见（只滚表格自己，不动整页；同一次悬停只滚一次）
  const hotRow = UV.hot ? UNI_ROWS.get(UV.hot.s.id) : null;
  if (hotRow && hotRow !== uniHotRow && !UV.pick) {
    const r = hotRow.getBoundingClientRect(), b = body.getBoundingClientRect();
    if (r.top < b.top) body.scrollTop -= b.top - r.top; else if (r.bottom > b.bottom) body.scrollTop += r.bottom - b.bottom;
  }
  uniHotRow = hotRow;
  // 最近一段时间没有派发过的对话时，表格里写一句提示
  let empty = body.querySelector('.empty');
  if (!list.length && !empty) { empty = document.createElement('p'); empty.className = 'empty'; body.append(empty); }
  if (empty) { if (list.length) empty.remove(); else setText(empty, TEXT.emptyList(U.hello?.window_h ?? 24)); }
  markMore(table.querySelector('.tbody'));
  const total = table.querySelector('.total');
  const cells = ['', 'total', TEXT.conversations(list.length), '', tot.running ? `● ${tot.running}` : '—', `${tot.done} · ${tot.failed}`,
    tot.input ? `${fmtTok(tot.input)} · ${Math.round((100 * tot.cached) / tot.input)}%` : '—', tot.output ? fmtTok(tot.output) : '—', fmtCost(tot.cost, !tot.priced), ''];
  const sig = cells.join('|');
  if (total.dataset.sig !== sig) {
    total.dataset.sig = sig; total.replaceChildren();
    for (const x of cells) { const s = document.createElement('span'); s.textContent = x; total.append(s); }
    total.children[8].title = TEXT.costTitle;
  }
}

// 状态列：对话此刻在做什么，后面每个出了问题的席位一个点（颜色和终端的状态色一致：超时、失败、被停止都是红的），
// 只列还在进行的组里的（服务端算好的 issues）；整组结束以后点就没了。悬停看是哪几席
function fillUniState(cell, s) {
  const word = s.state === 'waiting' && s.waiting?.header ? TEXT.asking(s.waiting.header) : STATE_WORD[s.state], issues = s.issues || [];
  // 签名带上每席的 run 和模型：同样个数、同样状态但换了席位时，悬停说明也要跟着换
  const sig = `${word}|${issues.map((x) => `${x.run}:${x.status}:${x.model}`).join(',')}`;
  if (cell.dataset.sig === sig) return;
  cell.dataset.sig = sig; cell.replaceChildren(word);
  // 等人回答是黄点，其余红点
  for (const x of issues) { const dot = document.createElement('i'); dot.className = 'issue'; dot.dataset.tone = Display.toneOf(x.status === 'needs_input' ? 'blocked' : 'failed'); cell.append(dot); }
  // 等你确认时列宽可能放不下（带弹窗标题时更长，手机宽度下光 waiting for you 也放不下）：悬停也写出整句
  const asking = s.state === 'waiting' ? [word] : [];
  cell.title = [...asking, ...issues.map((x) => `${Display.D.statusName(x.status)} · ${shortModel(x.model) || '?'}`)].join('\n');
}

// 宇宙层的顶栏：范围、宇宙层自己的时钟和回放进度、连接状态（看板的 renderTop 在宇宙层不跑，不清掉会留着上一个对话的）

// ---- 08-beams.js
'use strict';
// 光束（世界坐标）。

// 互联网光线：起点在核心网中心周围一圈（0.15R–0.45R）里随机，先朝外弯出去，再拐向卡片的 token 接口
// （Claude Code 从右边进、席位从左边进）。起点一端透明、渐渐融进白色弧线，越靠近卡片越显出卡片的颜色。
// 只有对话正在活跃进行时才流动，token/s 越快越亮、流得越快；不活跃时是一道静止的暗线。
// surge：这条车道输出突然加快后的屏幕秒数（08-surge.js），有的话一道亮光沿每条线从弧线区走到卡片
function drawBundle(c, lane, p, I, live, surge = null) {
  const rand = rng(hash(`bundle|${lane.id}`)), k = (p.visible === false ? 0.45 : 1) * (0.45 + 0.55 * live);
  const side = p.tok[0] < c.cx ? 1 : -1; // 卡片在左边时，线从卡片右侧进来
  const color = tintOf(lane.id), flow = flowPhase(`bundle|${lane.id}`, 10 + 70 * I);
  ctx.save();
  for (let i = 0; i < 10; i++) {
    const a0 = rand() * Math.PI * 2, r0 = c.R * (0.15 + rand() * 0.3);
    const sx = c.cx + Math.cos(a0) * r0, sy = c.cy + Math.sin(a0) * r0;
    const a = a0 + (rand() - 0.5) * 1.8, out = c.R * (0.18 + rand() * 0.25);
    const ex = p.tok[0], ey = p.tok[1] + (rand() - 0.5) * 8;
    const q = [[sx, sy], [sx + Math.cos(a) * out, sy + Math.sin(a) * out], [ex + side * (60 + rand() * 120), ey + (rand() - 0.5) * 50], [ex, ey]];
    const g = ctx.createLinearGradient(sx, sy, ex, ey);
    g.addColorStop(0, HI(0)); g.addColorStop(0.3, HI(0.12 * k)); g.addColorStop(0.7, color((0.22 + 0.35 * I) * k)); g.addColorStop(1, color((0.4 + 0.45 * I) * k));
    strokeCubic(q);
    ctx.strokeStyle = g; ctx.lineWidth = 0.9 * FX.lw; ctx.stroke();
    if (surge != null) { drawSurgeAlong(q, surge, color, surgeK(lane.id) * k); strokeCubic(q); }
    if (live > 0.01) {
      // 流动的光点随活跃程度淡入淡出
      const d = ctx.createLinearGradient(sx, sy, ex, ey);
      d.addColorStop(0, HI(0)); d.addColorStop(0.35, HI((0.15 + 0.3 * I) * live)); d.addColorStop(1, HI((0.35 + 0.6 * I) * live));
      ctx.lineDashOffset = -(flow + i * 7 + (lane.seed % 50));
      if (LOOK.dots) {
        // 圆形光点：长度几乎为零的虚线段配圆头，外面再叠一圈同色柔光
        ctx.lineCap = 'round'; ctx.setLineDash([0.01, 22 * FX.lw]);
        const gl = ctx.createLinearGradient(sx, sy, ex, ey);
        gl.addColorStop(0, color(0)); gl.addColorStop(0.4, color((0.08 + 0.12 * I) * k * live)); gl.addColorStop(1, color((0.18 + 0.25 * I) * k * live));
        ctx.strokeStyle = gl; ctx.lineWidth = (5 + 2 * I) * FX.lw; ctx.stroke();
        ctx.strokeStyle = d; ctx.lineWidth = (1.9 + 0.8 * I) * FX.lw; ctx.stroke();
        ctx.lineCap = 'butt';
      } else {
        ctx.setLineDash([4 * FX.lw, 24 * FX.lw]);
        ctx.strokeStyle = d; ctx.lineWidth = (1.3 + 0.6 * I) * FX.lw; ctx.stroke();
      }
      ctx.setLineDash([]);
    }
  }
  ctx.restore();
}

// 一束从宽到窄的光：from 一侧的点列到 to 一侧的点列一一对应连线（paths 给出每条线的三次贝塞尔）。
// 底下一层淡光，上面一束细线，再叠流动的光段和闪烁的亮块；pulses 里的产出事件让一道亮带沿光束走过去
function drawCone(paths, color, I, live, seed, pulseAges) {
  const sec = performance.now() / 1000, rand = rng(seed), act = live ? 0.45 + 0.55 * I : 0.25;
  ctx.save();
  // 细线：近卡片一端亮、中间淡下去，到产出框收拢时又亮起来
  const [a0, a1] = [paths[0][0], paths[0][3]];
  const grad = ctx.createLinearGradient(a0[0], a0[1], a1[0], a1[1]);
  grad.addColorStop(0, HI(0.12 + 0.3 * act)); grad.addColorStop(0.45, color(0.03 + 0.08 * act)); grad.addColorStop(1, color(0.12 + 0.3 * act));
  ctx.strokeStyle = grad; ctx.lineWidth = 0.9 * FX.lw;
  ctx.beginPath();
  for (const q of paths) { ctx.moveTo(...q[0]); ctx.bezierCurveTo(...q[1], ...q[2], ...q[3]); }
  ctx.stroke();
  // 流动的光段：只在对话活跃时流，越活跃越亮越快
  const flow = flowPhase(`cone|${seed}`, 14 + 80 * I);
  ctx.lineWidth = 1.9 * FX.lw;
  for (let i = 0; i < paths.length && live; i++) {
    const len = 8 + rand() * 20, gap = 50 + rand() * 90, ph = rand() * 200;
    ctx.setLineDash([len * FX.lw, gap * FX.lw]);
    ctx.lineDashOffset = -(flow * (0.7 + rand() * 0.6) + ph);
    ctx.strokeStyle = i % 3 ? color(0.3 + 0.6 * act) : HI(0.35 + 0.6 * act);
    strokeCubic(paths[i]); ctx.stroke();
  }
  ctx.setLineDash([]);
  // 闪烁的亮块（上一版光束里零星的亮块），也只在活跃时出现
  ctx.lineWidth = 2.4 * FX.lw;
  for (let i = 0; i < (live ? 3 + 6 * I : 0); i++) {
    const q = paths[Math.floor(rand() * paths.length)], u = 0.1 + rand() * 0.75, ph = rand() * 6.28;
    if (Math.sin(sec * 3.1 + ph * 3) < -0.1) continue;
    const [x1, y1] = cubicAt(q, u), [x2, y2] = cubicAt(q, Math.min(1, u + 0.03));
    ctx.strokeStyle = color(0.75); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  // 产出脉冲：一道亮带从卡片走到产出框
  for (const age of pulseAges) {
    const u = ease(Math.min(1, age / 1.3)), a = 1 - Math.min(1, age / 1.3);
    ctx.beginPath();
    paths.forEach((q, i) => { const [x, y] = cubicAt(q, u); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = HI(0.9 * a); ctx.lineWidth = 1.6 * FX.lw; ctx.stroke();
  }
  ctx.restore();
}

// 席位卡片 → 产出框：卡片右边（宽）收拢到产出框左边（窄）；输出越快通道越宽（最快时和卡片一样高），样式见 08-outbeam.js
// Codex 这类只在一轮结束时报用量的席位，运行中速度算不出来；最近 20 秒（记录时间）有动作就按最窄的通道算
function recentlyBusy(lane, t) {
  for (let i = lane.events.length - 1; i >= 0; i--) { const e = lane.events[i]; if (e.ts <= t) return t - e.ts < 20000 && laneStatus(lane, t).running; }
  return false;
}
// 通道至少留最窄的一条、按最低的流速流动：产出框在的时候（show），结果还没被读走、席位已经停下时也看得出卡片连着它的框；
// 框还没出来、任务还在跑（汇聚的光团，gather）时也一样，长时间思考、跑命令没有新动作时卡片照样连着那团光
const OUT_BASE_I = 0.06;
function drawRibbon(lane, p, t, rate, pulses, live) {
  const life = outLife(lane, t), shown = life.phase === 'show' ? 1 : 0;
  const base = shown || life.phase === 'gather' && laneStatus(lane, t).running ? OUT_BASE_I : 0;
  // 节拍（04-life.js 的 beatsAt）让这条光路短暂变宽
  const I = smooth(`rI|${lane.id}`, Math.max(glow(rate), recentlyBusy(lane, t) ? 0.22 : 0, base, 0.45 * (FX.beat?.lanes.get(lane.id) || 0)));
  live = Math.max(live || 0, 0.6 * smooth(`box|${lane.id}`, shown));
  // 框还没出现时通道收进那团汇聚的光（08-outlife.js）
  const tg = smoothTarget(lane.id, outTarget(p.outbox, life), p.outbox), c = p.card, x0 = c.x + c.w + 1, x1 = tg.x, mid = (x0 + x1) / 2, wf = 0.08 + 0.92 * Math.pow(I, 1.4);
  const cy = c.y + c.h / 2, hc = (c.h / 2 - 3) * wf, oy = tg.y, ho = tg.box ? tg.half * (0.35 + 0.65 * wf) : tg.half;
  const E0 = [[x0, cy - hc], [mid, cy - hc], [mid, oy - ho], [x1, oy - ho]];
  const E1 = [[x0, cy + hc], [mid, cy + hc], [mid, oy + ho], [x1, oy + ho]];
  const ages = pulses.filter((q) => q.lane === lane.id && q.out).map((q) => q.age);
  drawOutBeam(E0, E1, tintOf(lane.id), I, live, hash(`cone|${lane.id}`), ages);
}

// Claude Code → 产出列最上面的框：从卡片顶边（宽）弯上去，收拢到框的左边（窄）
// 和席位通道一样，输出越快越宽：卡片顶边上占的宽度、产出框一端的高度都按速度缩放
function drawCCOut(cc, box, pulses, rate, live, t) {
  // Claude Code 的光团只在它活跃时出现（04-life.js 的 ccLife），所以光团在就按最低流速连着
  const life = ccLife(t), shown = life.phase === 'show' ? 1 : 0, base = shown || life.phase === 'gather' ? OUT_BASE_I : 0;
  live = Math.max(live || 0, 0.6 * smooth('box|cc', shown));
  const c = cc.card, tg = smoothTarget('cc', outTarget(box, life), box), I = smooth('rI|cc', Math.max(glow(rate), base, 0.45 * (FX.beat?.lanes.get('cc') || 0))), wf = 0.08 + 0.92 * Math.pow(I, 1.4);
  const half = tg.box ? tg.half * (0.35 + 0.65 * wf) : tg.half;
  const edge = (f) => {
    const s = 0.5 + (f - 0.5) * wf, xa = c.x + 6 + (c.w - 12) * s, yb = tg.y + (f - 0.5) * 2 * half, lift = Math.max(60, c.y - box.y) * (0.75 + 0.25 * (1 - s));
    return [[xa, c.y], [xa, c.y - lift], [tg.x - 260 + 40 * s, yb], [tg.x, yb]];
  };
  const ages = pulses.filter((q) => q.lane === 'cc' && q.out).map((q) => q.age);
  drawOutBeam(edge(0), edge(1), tintOf('cc'), I, live, hash('cone|cc'), ages);
}

// Claude Code ↔ 席位：穿过核心网的交互光线，只按真实事件亮：派活时光点从 Claude Code 出发，结果回来或被读取时从席位回来；
// 平时只是一道静止的暗线（席位还在运行时稍亮一点）
function drawLink(c, lane, cc, p, t, pulses) {
  const curve = [cc.link, [c.cx + c.R * 0.15, cc.link[1] + (p.link[1] - cc.link[1]) * 0.2], [c.cx + c.R * 0.5, p.link[1]], p.link];
  const color = tintOf(lane.id), mine = pulses.filter((x) => x.lane === lane.id && x.dir);
  const boost = Math.max(0, ...mine.map((x) => 1 - x.age / FX_PULSE)), base = 0.07 + 0.15 * smooth(`run|${lane.id}`, laneStatus(lane, t).running ? 1 : 0), k = p.visible === false ? 0.5 : 1;
  ctx.save();
  strokeCubic(curve);
  ctx.strokeStyle = color((0.05 + 0.3 * boost) * k); ctx.lineWidth = (2 + 4 * boost) * FX.lw; ctx.stroke();
  const back = mine.some((x) => x.dir < 0 && x.age < 1.6);
  if (LOOK.dots) {
    // 平时一条静止的细线；派活、收结果时沿线流过一串圆形光点
    ctx.strokeStyle = HI(base * 0.6 * k); ctx.lineWidth = 0.6 * FX.lw; ctx.stroke();
    if (boost > 0) {
      ctx.lineCap = 'round'; ctx.setLineDash([0.01, 12 * FX.lw]);
      ctx.lineDashOffset = ((back ? 1 : -1) * performance.now() / 45) * FX.lw;
      ctx.strokeStyle = HI(0.75 * boost * k); ctx.lineWidth = 1.9 * FX.lw; ctx.stroke();
      ctx.lineCap = 'butt';
    }
  } else {
    ctx.setLineDash([5 * FX.lw, 7 * FX.lw]);
    ctx.lineDashOffset = boost > 0 ? ((back ? 1 : -1) * performance.now() / 45) * FX.lw : 0;
    ctx.strokeStyle = HI((base + 0.6 * boost) * k); ctx.lineWidth = 0.8 * FX.lw; ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const x of mine) for (let j = 0; j < 3; j++) {
    const u = (x.age - j * 0.12) / 1.8;
    if (u < 0 || u > 1) continue;
    const [px, py] = cubicAt(curve, x.dir > 0 ? ease(u) : 1 - ease(u));
    glowDot(px, py, j ? 1.7 : 2.4, x.dir > 0 ? tintOf('cc') : color, Math.min(1, (1 - u) * 4));
  }
  ctx.restore();
}

// ---- 08-cosmos.js
'use strict';
// 宇宙背景和星系核心：星空（视差，拖动缩放时比前景动得慢）、星云（核心一团白色微光，运行中的席位在光束区留一团自己的颜色）、
// 宇宙尘（缓慢漂移的小颗粒，光束区更密）、星系核心（中心亮核、倾斜的轨道环、闪烁的星点）。
// 每一部分都能在 URL 里用 off= 关掉对比，比如 ?off=stars,dust（可选 stars、nebula、dust、dots、galaxy）。

const LOOK = (() => {
  const off = new Set((new URLSearchParams(location.search).get('off') || '').split(',').map((s) => s.trim()).filter(Boolean));
  return { stars: !off.has('stars'), nebula: !off.has('nebula'), dust: !off.has('dust'), dots: !off.has('dots'), galaxy: !off.has('galaxy') };
})();

// 星空：在比世界大三倍的范围里撒星，按"缩得少、移得少"的视差映射到屏幕
const STARS = (() => {
  const rand = rng(77001), list = [];
  for (let i = 0; i < 520; i++) {
    const tone = rand();
    list.push({ x: (rand() * 3 - 1) * WL.W, y: (rand() * 3 - 1) * 900, r: 0.35 + Math.pow(rand(), 3) * 1.4, a: 0.15 + rand() * 0.55,
      tw: rand() < 0.28 ? 0.6 + rand() * 2.2 : 0, ph: rand() * 6.28, c: tone < 0.7 ? '246,246,250' : tone < 0.9 ? '214,214,222' : '255,244,232' });
  }
  return list;
})();

function drawStars(w, h, fit) {
  if (!LOOK.stars) return;
  const sec = performance.now() / 1000, kz = fit.k * Math.pow(VIEW.k / fit.k, 0.3);
  const px = (VIEW.tx - fit.tx) * 0.25, py = (VIEW.ty - fit.ty) * 0.25;
  const cx = w / 2 + px, cy = h / 2 + py, wx = WL.W / 2, wy = VIEW.H / 2;
  for (const s of STARS) {
    const x = cx + (s.x - wx) * kz, y = cy + (s.y - wy) * kz;
    if (x < -4 || y < -4 || x > w + 4 || y > h + 4) continue;
    const a = s.tw ? s.a * (0.45 + 0.55 * Math.sin(sec * s.tw + s.ph)) : s.a;
    ctx.fillStyle = `rgba(${s.c},${a.toFixed(3)})`;
