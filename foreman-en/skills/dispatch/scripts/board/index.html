  const pg = U.page, p = { group: null, run: null, replay: null, session: null, from: null, speed: pg.speed, maxgap: pg.maxgap, t: null };
  // 演示里的对话带着现成的组回放；真实数据按对话打开，宇宙层在回放时从当时的时刻接上（共用一个时钟）
  if (s.detail) for (const [k, v] of new URLSearchParams(s.detail)) p[k] = v;
  else {
    p.session = s.id;
    // 宇宙层定格（?t=）时看板定格在同一时刻：回放用同一个 t，直播取当时的快照
    if (pg.t != null) { p.t = pg.t; if (pg.replay === 'all') p.replay = 'all'; }
    else if (U.clock.mode === 'replay') { p.replay = 'all'; p.from = String(Math.round(uNow())); }
  }
  B.params = p;
  started = false; DOM.version = -1;
  connect();
}

function setUrl(id) {
  const url = new URL(location.href);
  if (id) url.searchParams.set('s', id); else url.searchParams.delete('s');
  // 老格式的范围参数只用来找第一次要飞进的对话，之后地址只记 s：不然飞出后一刷新又被它们带回那个对话
  for (const key of ['group', 'run', 'session']) url.searchParams.delete(key);
  if (!BOARD_REPLAY) url.searchParams.delete('replay');
  history.replaceState(null, '', url);
}

function flyIn(id, instant = false) {
  const g = uniLayout().galaxies.find((x) => x.s.id === id);
  if (!g) return false;
  const r = viewEl.getBoundingClientRect();
  FLY.back = { k: UV.k, tx: UV.tx, ty: UV.ty, auto: UV.auto };
  FLY.from = { k: UV.k, sx: g.x * UV.k + UV.tx, sy: g.y * UV.k + UV.ty };
  Object.assign(FLY, { id, mode: instant ? 'board' : 'in', mirror: false, t0: performance.now(), out: 0, pending: null });
  // 直播只留当前层的一条流，免得多个标签页占满同主机连接；回放宇宙共用时钟，重连会从头播放。
  if (!U.demo && B.params.replay == null && B.params.t == null) disconnectUniverse();
  UV.goal = null; UV.auto = false;
  openBoardFor(g.s);
  // 星系的亮核最后落在看板核心网（弧线区）的中心：它在那里炸开成弧线区（08-uni-burst.js）
  const L = computeLayout(now());
  VIEW.H = L.H;
  const fit = fitGoal(), cx = fit.tx + L.core.cx * fit.k, cy = fit.ty + L.core.cy * fit.k;
  FLY.to = { k: uniFitGoal().k * 14, sx: Number.isFinite(cx) ? cx : r.width / 2, sy: Number.isFinite(cy) ? cy : r.height / 2 };
  setUrl(id);
  wake();
  return true;
}
// 看板核心网（弧线区中心）此刻在屏幕上的位置：看板已经在画时按它的镜头算（数据晚到、重新适配、用户缩放过都跟得上），
// 还没开始画时按适配后的版面算
function boardCoreTarget() {
  const L = FX.layout || computeLayout(now());
  if (!L?.core) return null;
  const cam = FX.layout ? VIEW : fitGoal(), sx = cam.tx + L.core.cx * cam.k, sy = cam.ty + L.core.cy * cam.k;
  return Number.isFinite(sx) && Number.isFinite(sy) ? { sx, sy } : null;
}
function flyOut() {
  if (FLY.mode !== 'board' && FLY.mode !== 'in') return;
  // 收拢从弧线区此刻所在的位置开始，不先跳到飞入时估的那个位置
  const target = boardCoreTarget();
  if (target && FLY.to) Object.assign(FLY.to, target);
  // 飞入还没结束就退回：从当前进度倒着走（缓动曲线前后对称，倒放的起点是 1 − 当前进度），不先跳到看板；
  // 远端镜头沿用飞入前的那个，不重新适配（看板里算出来的全貌和宇宙层留出侧栏的全貌不一样，会跳）
  const mirror = FLY.mode === 'in', back = mirror ? 1 - flyU() : 0;
  // 直接打开到看板（刷新进来）时没有飞入前的镜头，退回去就复位到全貌
  if (!mirror && (!FLY.back || FLY.back.auto)) { const g = uniFitGoal(); FLY.back = { ...g, auto: true }; }
  Object.assign(FLY, { mode: 'out', mirror, t0: performance.now() - back * FLY_OUT * 1000 });
  if (!U.demo && B.params.replay == null && B.params.t == null) { disconnect(); connectUniverse(); }
  setUrl(null);
  wake();
}

// 每帧推进切换中的镜头；切换结束时落到看板或宇宙
function stepFly() {
  if (FLY.mode !== 'in' && FLY.mode !== 'out') return;
  const u = flyU(), e = ease(u), g = uniLayout().galaxies.find((x) => x.s.id === FLY.id);
  // 亮核的落点跟着看板核心网的实际位置走（平滑追上，不跳）：炸开结束时弧线区正好就是看板画它的地方
  const target = FLY.mode === 'in' ? boardCoreTarget() : null;
  if (target && FLY.to) { FLY.to.sx += (target.sx - FLY.to.sx) * 0.3; FLY.to.sy += (target.sy - FLY.to.sy) * 0.3; }
  if (g) {
    const near = FLY.to, far = FLY.mode === 'in' ? FLY.from : { k: FLY.back.k, sx: g.x * FLY.back.k + FLY.back.tx, sy: g.y * FLY.back.k + FLY.back.ty };
    const v = FLY.mode === 'in' ? e : 1 - e;   // 0 在远处，1 贴近星系
    const k = far.k * Math.pow(near.k / far.k, v), sx = far.sx + (near.sx - far.sx) * v, sy = far.sy + (near.sy - far.sy) * v;
    Object.assign(UV, { k, tx: sx - g.x * k, ty: sy - g.y * k, goal: null });
  }
  if (u < 1) return;
  if (FLY.mode === 'in') { FLY.mode = 'board'; if (target && FLY.to) Object.assign(FLY.to, target); }
  else {
    FLY.mode = 'universe';
    Object.assign(UV, { k: FLY.back.k, tx: FLY.back.tx, ty: FLY.back.ty, auto: FLY.back.auto, goal: null });
    disconnect();
  }
}

// 宇宙层对着一个星系一直往里滚：星系大到占视图三分之一（或者已经放到最大）以后再攒一段就飞进去（和看板缩到最小往外滚退回宇宙对称）。
// 鼠标下没有星系时取离视图中心最近的那个；往外滚清零
function uniWheelIn(e, sx, sy) {
  const L = UV.layout, r = viewEl.getBoundingClientRect();
  if (e.deltaY >= 0 || !L) { FLY.inAcc = 0; return false; }
  let g = galaxyAt(L, sx, sy);
  if (!g) {
    let bd = Infinity;
    for (const x of L.galaxies) { const d = Math.hypot(x.x * UV.k + UV.tx - r.width / 2, x.y * UV.k + UV.ty - r.height / 2); if (d < bd) { bd = d; g = x; } }
  }
  const need = Math.min(Math.min(r.width, r.height) / 3, GAL_R * uniFitGoal().k * 14 * 0.9);
  if (!g || GAL_R * UV.k < need) { FLY.inAcc = 0; return false; }
  if (FLY.inId !== g.s.id) { FLY.inId = g.s.id; FLY.inAcc = 0; }
  FLY.inAcc = (FLY.inAcc || 0) - e.deltaY;
  if (FLY.inAcc < 220) return false; // 攒的时候照常放大
  FLY.inAcc = 0;
  return flyIn(g.s.id);
}

// 看板已经缩到最小还继续往外滚：攒够一段就退回宇宙（往里滚清零）
function boardWheelOut(e) {
  if (!U.on || FLY.mode !== 'board') return false;
  if (e.deltaY < 0) { FLY.out = 0; return false; }
  if (VIEW.k > kFit() * 0.62) return false;
  FLY.out += e.deltaY;
  if (FLY.out > 260) flyOut();
  return true;
}

// 顶栏路径：FOREMAN › 项目 › 对话；在看板里点 FOREMAN 回到宇宙
function renderCrumb() {
  const s = FLY.id && U.sessions.get(FLY.id), inside = FLY.mode !== 'universe' && s;
  const proj = inside && (U.projects.get(s.project)?.name || s.project);
  const html = inside ? '<i>›</i><span></span><i>›</i><b></b>' : '<i>·</i><span></span>';
  $('brand').classList.toggle('link', !!inside);
  $('brand').title = inside ? TEXT.backToUniverse : '';
  const key = inside ? `${html}|${proj}|${s.title}` : `${html}|${U.sessions.size}`;
  if (key === FLY.crumb) return;
  FLY.crumb = key;
  const el = $('crumb');
  el.innerHTML = html;
  if (inside) { el.querySelector('span').textContent = proj; el.querySelector('b').textContent = s.title || s.id.slice(0, 8); }
  else el.querySelector('span').textContent = TEXT.conversations(U.sessions.size);
}
$('brand').addEventListener('click', () => { if ($('brand').classList.contains('link')) flyOut(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && U.on && (FLY.mode === 'board' || FLY.mode === 'in')) { flyOut(); e.preventDefault(); } });

// ---- 08-uni-galaxy.js
'use strict';
// 一个对话星系的细节：盘面旋臂、派发组的轨道、协作方的星（出生时从核里长出来，结束时盘旋着收回核里）、
// 星往核里送的光点、等你确认的琥珀光环、出错时的红闪和红点。盘面是倾斜的椭圆，倾角按对话 id 定。

const GAL_MORPH = new Map();  // seed → 形态（类型、扁度、转向、盘面上的点）
const GAL_SPIN = { idle: 0.035, thinking: 0.16, dispatching: 0.12, waiting: 0.06 };
const STAR_BORN = 1.2, STAR_HOME = 1.4;   // 秒：星长出来、收回去各用多久
// 线宽按屏幕像素给：放大时只稍微变粗
const upx = (n) => n / UV.k * Math.pow(1 / FX.lw, 0.35);

// 形态按对话 id 定，十份里：两份双臂旋涡、三份多臂旋涡，棒旋、透镜、椭圆、环状、不规则各一份。
// 双臂和棒旋天生像 S，所以份数少、旋臂绕得更紧，看起来是卷起来的涡而不是一个 S。
// 弯度、散布、大小、扁度、转向、转速也都各不相同，免得满屏都是同一个 S
const GAL_KINDS = ['spiral', 'spiral', 'multi', 'multi', 'multi', 'barred', 'lenticular', 'elliptical', 'ring', 'irregular'];
function morphOf(seed) {
  let m = GAL_MORPH.get(seed);
  if (m) return m;
  const rand = rng(seed ^ 0x5bd1e995), kind = GAL_KINDS[Math.floor(rand() * GAL_KINDS.length)];
  const size = 0.82 + rand() * 0.3, pts = [];
  // r 是相对盘面半径（0–1），a 是角度；s 点的大小，b 亮度，tint 小于 0.6 的是白点，其余取出场模型的颜色
  const add = (r, a, s = 0.8 + rand() * 1.1, b = 0.45 + rand() * 0.55) => pts.push({ r: r * GAL_R * size, a, s, b, tint: rand() });
  const addXY = (x, y, s, b) => add(Math.hypot(x, y), Math.atan2(y, x), s, b);
  const gauss = () => (rand() + rand() + rand() - 1.5) / 1.5;
  const arm = (start, wind, spread, n, from = 0.14) => {
    for (let i = 0; i < n; i++) {
      const u = i / n;
      add((from + (1 - from) * u) * (0.9 + rand() * 0.2), start + u * wind + gauss() * spread * (0.4 + u));
    }
  };
  const halo = (n, reach = 0.9) => { for (let i = 0; i < n; i++) add(Math.sqrt(rand()) * reach, rand() * 6.283, 0.4 + rand() * 0.5, 0.25 + rand() * 0.4); };
  if (kind === 'spiral' || kind === 'multi') {
    const arms = kind === 'spiral' ? 2 : 3 + Math.floor(rand() * 2);
    const wind = kind === 'spiral' ? 3 + rand() * 2.8 : 1.1 + rand() * 2, spread = kind === 'spiral' ? 0.15 + rand() * 0.3 : 0.35 + rand() * 0.4;
    const skew = rand() * 0.6;   // 各条臂起点不完全对称
    for (let i = 0; i < arms; i++) arm(i * 6.283 / arms + (i % 2) * skew, wind, spread, Math.round(92 / arms));
    halo(22);
  } else if (kind === 'barred') {
    const bar = 0.24 + rand() * 0.14, wind = 2.6 + rand() * 1.6;
    for (let i = 0; i < 26; i++) addXY((rand() * 2 - 1) * bar, gauss() * 0.05);
    arm(0, wind, 0.2, 38, bar); arm(Math.PI, wind, 0.2, 38, bar);
    halo(18);
  } else if (kind === 'lenticular') {
    // 透镜：亮的核球加一层平滑的薄盘，没有旋臂
    for (let i = 0; i < 40; i++) add(0.3 * Math.pow(rand(), 1.3), rand() * 6.283, 0.7 + rand() * 0.9, 0.55 + rand() * 0.45);
    for (let i = 0; i < 70; i++) add(0.25 + 0.75 * Math.pow(rand(), 0.8), rand() * 6.283, 0.5 + rand() * 0.7, 0.25 + rand() * 0.45);
  } else if (kind === 'elliptical') {
    for (let i = 0; i < 104; i++) add(0.92 * Math.pow(rand(), 1.5), rand() * 6.283, 0.6 + rand() * 0.9, 0.3 + rand() * 0.7);
  } else if (kind === 'ring') {
    const ring = 0.58 + rand() * 0.18;
    for (let i = 0; i < 74; i++) add(ring + gauss() * 0.07, rand() * 6.283);
    halo(16, 0.3); halo(10, 1);
  } else {
    // 不规则：几团各自聚集的星点
    for (let c = 0, n = 4 + Math.floor(rand() * 3); c < n; c++) {
      const cr = 0.15 + rand() * 0.65, ca = rand() * 6.283, cx = Math.cos(ca) * cr, cy = Math.sin(ca) * cr, w = 0.08 + rand() * 0.12;
      for (let i = 0; i < 18; i++) addXY(cx + gauss() * w, cy + gauss() * w);
    }
    halo(14);
  }
  // 倾斜后的扁度：椭圆星系更圆，旋涡和环状可以很扁
  const flat = kind === 'elliptical' ? 0.62 + rand() * 0.25 : kind === 'lenticular' ? 0.3 + rand() * 0.25 : 0.38 + rand() * 0.42;
  // 盘面上最亮的几颗（光效里画成带星芒的亮星）
  const hot = pts.map((p, i) => [p.s * p.b, i]).sort((a, b) => b[0] - a[0]).slice(0, 3).map(([, i]) => i);
  m = { kind, pts, hot, flat, size, dir: rand() < 0.5 ? -1 : 1, speed: 0.7 + rand() * 0.6 };
  GAL_MORPH.set(seed, m);
  return m;
}

// 星系局部坐标（盘面上的半径和角度）→ 宇宙坐标
function galPoint(g, r, a) {
  const tilt = g.tilt, lx = Math.cos(a) * r, ly = Math.sin(a) * r * g.flat;
  return [g.x + Math.cos(tilt) * lx - Math.sin(tilt) * ly, g.y + Math.sin(tilt) * lx + Math.cos(tilt) * ly];
}

// 这一帧要画的星：在跑的，加上刚结束、还在往回收的；按派发组分圈
function starsOf(g) {
  const s = g.s, m = U.marks.get(s.id), out = [], rings = new Map();
  for (const r of [...s.runs].reverse()) {
    const rm = m?.runs.get(r.id);
    if (!rm) continue;
    const home = rm.ended == null ? 0 : uniSec(rm.ended) / STAR_HOME;
    if (home >= 1) continue;
    const key = r.group || r.id;
    if (!rings.has(key)) rings.set(key, rings.size);
    out.push({ r, ring: rings.get(key), born: clamp01(uniSec(rm.born) / STAR_BORN), home: clamp01(home), color: (a) => rgba(runKey(r), a) });
  }
  const perRing = new Map();
  for (const st of out) perRing.set(st.ring, (perRing.get(st.ring) || 0) + 1);
  const idx = new Map();
  for (const st of out) { const i = idx.get(st.ring) || 0; idx.set(st.ring, i + 1); st.slot = i / perRing.get(st.ring); }
  return out;
}

function drawGalaxyOf(g, alpha, hover) {
  const s = g.s, M = morphOf(g.seed), sec = performance.now() / 1000;
  // 整个盘面一起转（各点角速度相同），形状不会越转越卷
  const spin = flowPhase(`uspin|${s.id}`, smooth(`uspin|${s.id}`, GAL_SPIN[s.state], GAL_SPIN[s.state])) * M.speed * M.dir;
  const pal = [(a) => rgba('claude', a), ...s.runs.filter((r) => r.status === 'running').map((r) => (a) => rgba(runKey(r), a))];
  // 盘面的星云：按这个对话在时间窗口里用过的模型上色（服务端的 models），和单对话弧线区的星云同一套（08-cosmos.js 的 drawMixNebula）。
  // 旧的回放数据没有 models，只看正在跑的
  const seats = (s.models || s.runs.filter((r) => r.status === 'running').map((r) => ({ ...r, out: 0, running: true })))
    .map((m) => ({ key: avatarFor(m.model, m.agent), out: m.out, running: m.running }));
  // 每个对话一团聚拢的彩色光晕：几团往星系中心收拢、叠在一起，比星系盘大一圈；正在干活的亮一些，几个模型同时跑也不会亮成一团（cap）
  drawMixNebula(g.x, g.y, GAL_R * 2.6 * M.size, 0.8, nebulaMix(seats, s.usage?.output ?? 0, s.state !== 'idle'), alpha * (s.state === 'idle' ? (ULOOK.on ? 0.55 : 1) : 1.15) + (hover ? 0.25 : 0), g.seed, { spread: 0.35, size: 1.15, cap: 1 });
  // 旋臂：大部分是白色星点，带活的模型颜色点缀。按颜色和三档亮度分桶，每桶一次填充（逐点设颜色太慢）
  // 点的大小按屏幕像素算：远看 1 像素上下，放大时只慢慢变大（开平方），近看画成圆点，不显得方块化
  const grow = 1.2 * Math.sqrt(1 / FX.lw), round = grow * 1.4 >= 1.8, buckets = new Map();
  for (const p of M.pts) {
    const ci = p.tint < 0.6 ? -1 : Math.floor(p.tint * 10) % pal.length, key = (ci + 1) * 3 + Math.min(2, Math.floor(p.b * 3));
    let list = buckets.get(key);
    if (!list) buckets.set(key, list = []);
    list.push(p);
  }
  const k = alpha * (hover ? 1 : 0.85);
  // 光效：星点叠加混色，密的地方发白
  if (ULOOK.on) ctx.globalCompositeOperation = 'lighter';
  for (const [key, list] of buckets) {
    const ci = Math.floor(key / 3) - 1, col = ci < 0 ? HI : pal[ci];
    ctx.fillStyle = col((0.45 + 0.22 * (key % 3)) * k);
    ctx.beginPath();
    for (const p of list) {
      const [x, y] = galPoint(g, p.r, p.a + spin), d = p.s * grow / UV.k;
      if (round) { ctx.moveTo(x + d / 2, y); ctx.arc(x, y, d / 2, 0, 6.283); } else ctx.rect(x - d / 2, y - d / 2, d, d);
    }
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const stars = starsOf(g), ringA = new Map();
  // 光效：一个星系的光有总量，同时跑的模型越多，每颗星的光斑、柔光和送往核里的光点越淡越小（总量上限），叠加时不会烧成一团白。
  // 每颗按星数的 -0.6 次方，两颗以上再乘 2/3（4 颗时各约 0.29），从一颗变成两颗时总亮度基本不变；只有一颗时也压到 0.55，白色的星（Codex）不会亮成一团白斑
  const damp = ULOOK.on ? Math.min(0.55, Math.pow(Math.max(1, stars.length), -0.6) * (stars.length > 1 ? 2 / 3 : 1)) : 1;
  // 光效下星和往核里送的光点另有星芒，它们的柔光再进辉光层逐级扩散，按原来的亮度画会在星和核之间糊成一团白
  const dotK = ULOOK.on ? 0.6 : 1;
  // 一个星系只拖一道横向长光：派发中亮核自己已经拖了一道（08-uni-glow.js 的 coreFlare），星就不再拖
  let streaked = s.state === 'dispatching';
  // 光效：干活的星系里最亮的几颗星闪着小星芒；同时跑三个以上模型时只留一颗。
  // 星座连线：从亮核出发，按远近把这几颗连成一串
  if (ULOOK.on && s.state !== 'idle') {
    const hot = M.hot.slice(0, stars.length >= 3 ? 1 : 3).map((i, j) => {
      const p = M.pts[i], [x, y] = galPoint(g, p.r, p.a + spin), tw = 0.5 + 0.5 * Math.sin(sec * (0.9 + j * 0.37) + j * 2.1 + g.seed % 7);
      flare(x, y, p.tint < 0.6 ? HI : pal[Math.floor(p.tint * 10) % pal.length], 10 + 6 * tw, alpha * damp * (0.25 + 0.4 * tw), j === 0 && !stars.length ? 40 : 0);
      return { x, y, r: p.r };
    }).sort((a, b) => a.r - b.r);
    constellation([{ x: g.x, y: g.y }, ...hot], 0.3 * alpha);
  }
  const links = new Map();   // 派发组 → 这一组在跑的星的位置（按轨道上的顺序），画星座连线
  for (const st of stars) ringA.set(st.ring, Math.max(ringA.get(st.ring) || 0, st.born * (1 - st.home)));
  // 派发组的轨道
  for (const [ring, a] of ringA) {
    const R = GAL_R * (0.48 + 0.24 * ring), col = stars.find((x) => x.ring === ring).color;
    ctx.lineWidth = upx(0.7);
    ctx.strokeStyle = col(0.32 * a); ctx.beginPath(); ctx.ellipse(g.x, g.y, R, R * g.flat, g.tilt, 0, 6.283); ctx.stroke();
  }
  for (const st of stars) {
    const R = GAL_R * (0.48 + 0.24 * st.ring), orbit = R * ease(st.born) * (1 - ease(st.home));
    const ang = st.slot * 6.283 + sec * (0.32 - 0.07 * st.ring) + (g.seed % 628) / 100 + st.home * 5;
    const [x, y] = galPoint(g, orbit, ang);
    const live = st.r.status === 'running' && !st.r.queued;
    if (ULOOK.on && live) { if (!links.has(st.ring)) links.set(st.ring, []); links.get(st.ring).push({ x, y, a: st.born * (1 - st.home) }); }
    // 往核里送的光点
    if (live && st.born >= 1) {

      const lg = ctx.createLinearGradient(x, y, g.x, g.y);

      ctx.strokeStyle = lg; ctx.lineWidth = upx(0.9); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(g.x, g.y); ctx.stroke();

    glowDot(x, y, 2.2 + 0.8 * st.born * (1 - st.home), st.color, alpha * blink * (0.3 + 0.7 * st.born) * damp * dotK);

  for (const pts of links.values()) if (pts.length > 1) constellation(pts, 0.5 * alpha * Math.min(...pts.map((p) => p.a)));

// 一串细白线，依次连起这些点；顶点处留一点空，线不压在星上
function constellation(pts, a) {
  if (a < 0.01 || pts.length < 2) return;
  const gap = upx(3.5);
  ctx.lineWidth = upx(0.8); ctx.strokeStyle = HI(a); ctx.beginPath();
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i - 1], q = pts[i], d = Math.hypot(q.x - p.x, q.y - p.y);
    if (d < gap * 3) continue;
    const ux = (q.x - p.x) / d, uy = (q.y - p.y) / d;
    ctx.moveTo(p.x + ux * gap, p.y + uy * gap); ctx.lineTo(q.x - ux * gap, q.y - uy * gap);
  }

}

// 等你确认：一圈琥珀色的呼吸光环；出错：红色闪一下，之后在右上角留一个红点
function drawSignals(g) {
  const s = g.s, m = U.marks.get(s.id), sec = performance.now() / 1000;
  const wait = smooth(`uwait|${s.id}`, s.state === 'waiting' ? 1 : 0);
  if (wait > 0.01) {
    const br = 0.5 + 0.5 * Math.sin(sec * 2.2), R = GAL_R * (1.08 + 0.05 * br);
    ctx.lineWidth = upx(1.6); ctx.strokeStyle = AMBER((0.35 + 0.35 * br) * wait);
    ctx.beginPath(); ctx.ellipse(g.x, g.y, R, R * (g.flat + 0.08), g.tilt, 0, 6.283); ctx.stroke();
    cloud(g.x, g.y, R * 1.15, R * 0.8, AMBER, 0.06 * wait * (0.6 + 0.4 * br));
  }
  const alert = smooth(`ualert|${s.id}`, s.alert ? 1 : 0);
  if (alert > 0.01) {
    const age = m ? uniSec(m.alertAt) : Infinity;
    if (age < 1.6) { const u = age / 1.6; ctx.lineWidth = upx(2.4 * (1 - u)); ctx.strokeStyle = ALERT(0.8 * (1 - u)); ctx.beginPath(); ctx.arc(g.x, g.y, GAL_R * (0.3 + 1.1 * ease(u)), 0, 6.283); ctx.stroke(); }
    const ax = g.x + GAL_R * 0.72, ay = g.y - GAL_R * 0.52, beat = 0.75 + 0.25 * Math.sin(sec * 3);
    cloud(ax, ay, upx(9), upx(9), ALERT, 0.35 * alert * beat);
    glowDot(ax, ay, 3, ALERT, alert * beat);
    ctx.lineWidth = upx(0.8); ctx.strokeStyle = ALERT(0.5 * alert); ctx.beginPath(); ctx.arc(ax, ay, upx(6), 0, 6.283); ctx.stroke();
  }
}

// ---- 08-uni-glow.js
'use strict';
// 宇宙层的光效（?look=old 换回以前的样子）：
//  亮星和亮核画成带十字星芒的光斑，正在干活的再拖一道横向长光；叠加混色（lighter），颜色重叠处发白；
//  亮的东西同时画进辉光层（借看板的 GLOW 缓冲，1/3 分辨率），整层画完后逐级缩小再放大叠回去，外面溢出一大圈柔光。
//  星云不进辉光层，所以只有亮的东西会发光，不会把整片底色洗亮。
//  看板中心的亮核也带同一颗星芒（boardCoreFlare），飞入时从星系亮核的星芒原样接过来。

// gain：光斑、柔光和溢出辉光的总强度，整体调亮调暗只改这一个数
const ULOOK = { on: Q.get('look') !== 'old', gain: 0.5 };
const FLARES = new Map();   // 颜色 → { star, streak } 两张预先画好的光斑

// 光斑按颜色画一次缓存起来，每帧只缩放贴图（比每帧建渐变省得多）。base 是 'r,g,b'
function flareOf(base) {
  let f = FLARES.get(base);
  if (f) return f;
  const col = (a) => `rgba(${base},${a})`, white = (a) => `rgba(255,252,248,${a})`;
  // 十字星芒：256×256，中心一小团白热，外面一圈本色柔光，上下左右四道细芒，对角线两道短而淡

  star.width = star.height = 256;
  const s = star.getContext('2d'), c = 128;
  s.globalCompositeOperation = 'lighter';
  const halo = s.createRadialGradient(c, c, 0, c, c, 64);
  halo.addColorStop(0, col(0.22)); halo.addColorStop(0.3, col(0.06)); halo.addColorStop(1, col(0));
  s.fillStyle = halo; s.fillRect(0, 0, 256, 256);
  const core = s.createRadialGradient(c, c, 0, c, c, 10);
  core.addColorStop(0, white(0.85)); core.addColorStop(0.35, white(0.55)); core.addColorStop(1, col(0));
  s.fillStyle = core; s.beginPath(); s.arc(c, c, 10, 0, 6.283); s.fill();
  const spike = (ang, len, w, a) => {
    s.save(); s.translate(c, c); s.rotate(ang);
    const g = s.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, white(a)); g.addColorStop(0.25, col(a * 0.55)); g.addColorStop(1, col(0));
    s.fillStyle = g; s.beginPath(); s.moveTo(0, -w); s.lineTo(len, 0); s.lineTo(0, w); s.closePath(); s.fill();
    s.restore();
  };
  for (let i = 0; i < 4; i++) spike(i * Math.PI / 2, 126, 1.4, 0.95);
  for (let i = 0; i < 4; i++) spike(Math.PI / 4 + i * Math.PI / 2, 46, 1.2, 0.35);
  // 横向长光：512×32 的扁椭圆，中间一道亮线
  const streak = document.createElement('canvas');
  streak.width = 512; streak.height = 32;
  const t = streak.getContext('2d');
  t.globalCompositeOperation = 'lighter';
  t.save(); t.translate(256, 16); t.scale(1, 16 / 256);
  const sg = t.createRadialGradient(0, 0, 0, 0, 0, 256);
  sg.addColorStop(0, col(0.45)); sg.addColorStop(0.4, col(0.12)); sg.addColorStop(1, col(0));
  t.fillStyle = sg; t.beginPath(); t.arc(0, 0, 256, 0, 6.283); t.fill();
  t.restore();
  const lg = t.createLinearGradient(0, 0, 512, 0);
  lg.addColorStop(0, white(0)); lg.addColorStop(0.5, white(0.85)); lg.addColorStop(1, white(0));

}
// 颜色函数（(a) => 'rgba(r,g,b,a)'）→ 'r,g,b'
const baseOf = (color) => /rgba?\(([^,]+,[^,]+,[^,]+)/.exec(color(1))[1].replace(/\s/g, '');

// 一颗亮星：size 是星芒从中心到尖的屏幕像素，streak 是横向长光半宽的屏幕像素（0 不画）。
// 画在当前画布上，同时往辉光层里放一份淡的，散开成柔光
function flare(x, y, color, size, a, streak = 0) {
  flareAt(x, y, color, upx(size), a, streak > 0 ? upx(streak) : 0);
}
// 同上，size、streak 按当前画布的坐标单位给（看板那边自己换算）
function flareAt(x, y, color, size, a, streak = 0) {
  a *= ULOOK.gain;

  const f = flareOf(baseOf(color)), d = size * 2, prev = ctx.globalCompositeOperation, pa = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter';

  if (streak > 0) { const sw = streak * 2, sh = sw / 16; ctx.drawImage(f.streak, x - sw / 2, y - sh / 2, sw, sh); }

  if (g !== ctx) {
    const gp = g.globalCompositeOperation;
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = pa * Math.min(1, a) * 0.2;
    g.drawImage(f.star, x - d / 2, y - d / 2, d, d);
    g.globalAlpha = pa; g.globalCompositeOperation = gp;
  }

// 只进辉光层的一团柔光（亮核外面那圈大光晕用）；辉光层关着时不画
function bloomBlob(x, y, r, color, a) {
  a *= ULOOK.gain;
  const g = glowCtx();
  if (g === ctx || a < 0.01) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color(a)); gr.addColorStop(0.4, color(a * 0.35)); gr.addColorStop(1, color(0));
  const gp = g.globalCompositeOperation;
  g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  g.globalCompositeOperation = gp;
}

// 宇宙层的辉光：看板的 glowFlush 叠 1/3、1/6 两级，这里再往下缩两级（1/12、1/24），外面多一大圈溢出的光
const UBLOOM = { c: { cv: document.createElement('canvas') }, d: { cv: document.createElement('canvas') } };
UBLOOM.c.ctx = UBLOOM.c.cv.getContext('2d'); UBLOOM.d.ctx = UBLOOM.d.cv.getContext('2d');
function uniBloomFlush(target) {
  if (!GLOW.on) return;
  const a = GLOW.a.cv, levels = [[UBLOOM.c, 4], [UBLOOM.d, 8]];
  let src = a;
  for (const [buf, k] of levels) {
    const w = Math.max(1, Math.ceil(a.width / k)), h = Math.max(1, Math.ceil(a.height / k));
    if (buf.cv.width !== w || buf.cv.height !== h) { buf.cv.width = w; buf.cv.height = h; } else buf.ctx.clearRect(0, 0, w, h);
    buf.ctx.imageSmoothingQuality = 'high';
    buf.ctx.drawImage(src, 0, 0, w, h);
    src = buf.cv;
  }
  glowFlush(target);
  target.save();
  target.setTransform(1, 0, 0, 1, 0, 0); target.globalCompositeOperation = 'lighter';
  target.imageSmoothingEnabled = true; target.imageSmoothingQuality = 'high';
  const W = target.canvas.width, H = target.canvas.height;
  target.globalAlpha = 0.3 * ULOOK.gain; target.drawImage(UBLOOM.c.cv, 0, 0, W, H);
  target.globalAlpha = 0.4 * ULOOK.gain; target.drawImage(UBLOOM.d.cv, 0, 0, W, H);
  target.restore();
}

// 星系亮核的星芒：size、streak 是屏幕像素（宇宙层再经 upx 随缩放稍微变大），a 是透明度（还要乘星系的亮度）。
// 干活时星芒更长，思考中跟着脉动，派发中或飞入蓄能时再拖一道横向长光；charge 是飞入前的蓄能（0–1）
function coreFlare(state, charge, sec, seed) {
  const busy = state === 'idle' ? 0 : 1, tw = 0.92 + 0.08 * Math.sin(sec * 1.7 + seed % 11);
  const pulse = state === 'thinking' ? 1 + 0.18 * Math.sin(sec * 3.4 + seed % 7) : 1;
  return { size: (busy ? 40 : 12) * pulse * tw * (1 + 1.2 * charge), a: busy ? 0.6 : 0.3, streak: state === 'dispatching' || charge > 0 ? 95 * tw : 0 };
}

// 看板中心亮核的星芒（画在弧线区那层，世界坐标）。平时大小固定在屏幕上、亮度跟着总输出；
// 飞入时在星系亮核淡掉的同一段（v 0.34–0.44）淡入，起始的大小和亮度就是那一刻宇宙层蓄满能的星芒，随炸开慢慢变成平时的样子；飞出倒着放
function boardCoreFlare(core, intensity, T, burst) {
  const px = 1 / VIEW.k, sec = performance.now() / 1000;
  let size = 44, a = 0.35 + 0.3 * intensity, streak = 80 * (0.5 + 0.5 * intensity), x = core.cx, y = core.cy;
  if (T && burst && T.g) {
    const u = coreFlare(T.g.s.state, 1, sec, T.g.seed), zf = Math.pow(UV.k / uniFitGoal().k, 0.35), s = burst.s;
    size = u.size * zf + (size - u.size * zf) * s;
    streak = u.streak * zf + (streak - u.streak * zf) * s;
    a = (u.a * uniStateA(T.g.s.state) + (a - u.a * uniStateA(T.g.s.state)) * s) * ramp(T.v, 0.34, 0.44);
    x = burst.wx; y = burst.wy;
  }
  flareAt(x, y, (al) => rgba('claude', al), size * px, a, streak * px);
}

// ---- 08-uni-layout.js
'use strict';
// 宇宙层的排布和镜头：每个项目一团星云，项目里的每个对话一个小星系。
// 位置只由 id 和对话的先后决定，刷新、新增对话时已有的星系不挪位置（星云变大时周围的会慢慢让开）。
// 镜头 UV 和看板的 VIEW 分开：滚轮以鼠标为中心缩放，按住拖动，双击复位。

const UV = { k: 1, tx: 0, ty: 0, goal: null, auto: true, hover: null, hot: null, bounds: null, frame: 0, layout: null, layoutFrame: -1 };
const PLACE = { sig: '', map: null };
const GAL_R = 40;                     // 星系盘的半径（宇宙坐标）
const inUniverse = () => U.on && FLY.mode === 'universe';
// 看板的输入只在看板完全显示时生效；飞入飞出的过渡里两边的输入都不处理
const boardInput = () => !U.on || FLY.mode === 'board';
const unit = (h) => (h % 100000) / 100000;

// 项目星云的半径随对话数增长
const nebulaR = (n) => 58 + 40 * Math.sqrt(Math.max(1, n));

// 项目：先按 id 算一个初始位置，再按名字顺序做几十轮"互相推开 + 向中心收"，同样的项目集合每次结果一样
// 结果按"有哪些项目、各有几个对话"缓存：项目多时（上百个）求解一次要几十毫秒，不能每帧重算
function placeProjects(groups) {
  const sig = [...groups].map(([key, list]) => `${key}:${list.length}`).sort().join('|');
  if (sig === PLACE.sig) return PLACE.map;
  const list = [...groups.keys()].sort().map((key) => {
    const h = hash(key), a = unit(h) * 6.283, d = 160 + unit(h >>> 7) * 260;
    return { key, x: Math.cos(a) * d, y: Math.sin(a) * d * 0.7, r: nebulaR(groups.get(key).length) };
  });
  for (let it = 0; it < 80; it++) {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const p = list[i], q = list[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1, need = p.r + q.r + 24;
      if (d < need) { const m = (need - d) / 2 / d; p.x -= dx * m; p.y -= dy * m; q.x += dx * m; q.y += dy * m; }
    }
    // 竖向收得比横向紧，整体铺成横向的一片，适合宽屏
    for (const p of list) { p.x *= 0.985; p.y *= 0.95; }
  }
  PLACE.sig = sig; PLACE.map = new Map(list.map((p) => [p.key, p]));
  return PLACE.map;
}

// 每帧的排布：项目位置、星系位置（向日葵式排开，旧的在里、新的在外），都经过平滑。
// 一帧只算一次（飞入飞出、绘制、命中检测共用），重复调用会让平滑在同一帧里多走几步
function uniLayout() {
  if (UV.layoutFrame === UV.frame && UV.layout) return UV.layout;
  UV.layoutFrame = UV.frame;
  const groups = sessionsByProject(), placed = placeProjects(groups), L = { projects: [], galaxies: [] };
  for (const [key, list] of groups) {
    const p = placed.get(key), cx = smoothY(`up|${key}x`, p.x), cy = smoothY(`up|${key}y`, p.y), r = smooth(`upr|${key}`, p.r, p.r);
    const proj = U.projects.get(key) || { key, name: key.split('/').pop(), older: 0 };
    L.projects.push({ key, name: proj.name, older: proj.older || 0, x: cx, y: cy, r, sessions: list });
    const order = [...list].sort((a, b) => a.started_at - b.started_at || (a.id < b.id ? -1 : 1)), turn = unit(hash(key)) * 6.283;
    order.forEach((s, i) => {
      const d = i === 0 && order.length === 1 ? 0 : 58 * Math.sqrt(i + 0.6), a = turn + i * 2.39996;
      const seed = hash(s.id);
      L.galaxies.push({ s, project: key, x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d * 0.82, seed, tilt: unit(seed >>> 3) * Math.PI, flat: morphOf(seed).flat });
    });
  }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of L.projects) { x0 = Math.min(x0, p.x - p.r); y0 = Math.min(y0, p.y - p.r); x1 = Math.max(x1, p.x + p.r); y1 = Math.max(y1, p.y + p.r + 30); }
  UV.bounds = L.projects.length ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0 } : { x: -300, y: -200, w: 600, h: 400 };
  return (UV.layout = L);
}

// 每帧只量一次（要读侧栏的位置，读一次就会让浏览器重新排版）；frame() 开头清掉缓存
function uniFitGoal() {
  if (UV.fitCache && UV.fitCache.bounds === UV.bounds) return UV.fitCache;
  const r = viewEl.getBoundingClientRect(), b = UV.bounds;
  // 视图还没有大小时不适配（和看板的 fitGoal 一样），留着原来的镜头
  if (!(r.width > 0 && r.height > 0)) return { k: UV.k > 0 ? UV.k : 1, tx: UV.tx, ty: UV.ty, bounds: b };
  // 让开左上的名额面板（收起或没显示时不让）
  const side = (id, edge) => { const e = $(id).getBoundingClientRect(); return e.width ? (edge === 'l' ? e.right - r.left : r.right - e.left) + 8 : 0; };
  const left = FLY.mode === 'universe' ? side('uslots', 'l') : 0, right = 0;
  const w = Math.max(200, r.width - left - right), k = Math.min(w / b.w, r.height / b.h) * 0.86;
  return (UV.fitCache = { k, tx: left + w / 2 - (b.x + b.w / 2) * k, ty: r.height / 2 - (b.y + b.h / 2) * k, bounds: b });
}
// ?focus=<对话 id>：一打开就停在这个星系近处（截图、以后从别处跳进来时用）
function uniFocus(L, id) {

  if (!g) return false;
  const r = viewEl.getBoundingClientRect(), k = uniFitGoal().k * 4.5;
  Object.assign(UV, { k, tx: r.width / 2 - g.x * k, ty: r.height / 2 - g.y * k, goal: null, auto: false });
  return true;
}
function uniFit(now = false) { UV.auto = true; UV.goal = uniFitGoal(); if (now) Object.assign(UV, UV.goal); }
function uniZoomAt(sx, sy, f) {
  const g = UV.goal || UV, kf = uniFitGoal().k, k = Math.min(kf * 14, Math.max(kf * 0.5, g.k * f));
  UV.goal = { k, tx: sx - (sx - g.tx) * (k / g.k), ty: sy - (sy - g.ty) * (k / g.k) };
  UV.auto = false;
}
// 和看板的镜头一样按对数插值、绕不动点缩放、按真实时间走（05-world.js 的 viewAt）；时间常数约等于原来 60 帧时每帧挪 16%。
// 自动适配时目标每帧都是新算的，认不出"新目标"：一帧最多按 50 毫秒算，停了一阵再画也不会一下跳太远
const UNI_TAU = 0.096;
function stepUni() {
  if (UV.auto) UV.goal = uniFitGoal();
  const g = UV.goal, ms = performance.now(), dt = Math.min(0.05, (ms - (UV.stepAt ?? ms - 16)) / 1000);
  UV.stepAt = ms;
  if (!g) return (UV.moving = false);
  Object.assign(UV, viewAt(UV, g, 1 - Math.exp(-Math.max(dt, 0.001) / UNI_TAU)));
  const moving = Math.abs(g.k - UV.k) > g.k * 0.001 || Math.abs(g.tx - UV.tx) > 0.3 || Math.abs(g.ty - UV.ty) > 0.3;
  if (!moving) { Object.assign(UV, { k: g.k, tx: g.tx, ty: g.ty }); if (!UV.auto) UV.goal = null; }
  // 自动适配全貌时 goal 一直在，是否在动看这里（限帧用）
  return (UV.moving = moving);
}
const toUni = (sx, sy) => [(sx - UV.tx) / UV.k, (sy - UV.ty) / UV.k];

// 鼠标下是哪个星系（给悬停高亮和之后的点击飞入用）
function galaxyAt(L, sx, sy) {
  const [x, y] = toUni(sx, sy);
  let best = null, bd = GAL_R * 1.1;
  for (const g of L.galaxies) { const d = Math.hypot(g.x - x, g.y - y); if (d < bd) { bd = d; best = g; } }
  return best;
}

// ---- 交互：只在宇宙层生效；看板里的同名操作在 05-world.js，那边先判断 inUniverse() 让开 ----
const udrag = { on: false, x: 0, y: 0, moved: 0, target: null };
viewEl.addEventListener('wheel', (e) => {
  if (!inUniverse()) return;
  e.preventDefault();
  const r = viewEl.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (!uniWheelIn(e, sx, sy)) uniZoomAt(sx, sy, Math.exp(-e.deltaY * 0.0016));
  wake();
}, { passive: false });
viewEl.addEventListener('pointerdown', (e) => {
  if (!inUniverse() || e.button !== 0 || e.target.closest('#hud')) return;
  // 按下时就记住点中的星系：按住期间重画会清掉悬停结果，松开时不能再靠它
  const r = viewEl.getBoundingClientRect(), hit = UV.layout && galaxyAt(UV.layout, e.clientX - r.left, e.clientY - r.top);
  Object.assign(udrag, { on: true, x: e.clientX, y: e.clientY, moved: 0, target: hit ? hit.s.id : null });
  viewEl.setPointerCapture(e.pointerId);
});
viewEl.addEventListener('pointermove', (e) => {
  if (!inUniverse()) return;
  const r = viewEl.getBoundingClientRect();
  UV.hover = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (!udrag.on) return;
  const dx = e.clientX - udrag.x, dy = e.clientY - udrag.y;
  udrag.moved += Math.abs(dx) + Math.abs(dy); udrag.x = e.clientX; udrag.y = e.clientY;
  if (udrag.moved > 4) {
    const g = UV.goal || UV;
    UV.goal = null; UV.auto = false;
    UV.tx = g.tx + dx; UV.ty = g.ty + dy; UV.k = g.k;
    viewEl.classList.add('dragging');
  }
  wake();
});
viewEl.addEventListener('pointerleave', () => { UV.hover = null; });
viewEl.addEventListener('pointerup', () => {
  if (!inUniverse()) { udrag.on = false; viewEl.classList.remove('dragging'); return; }
  // 没拖动、点在星系上：飞进这个对话
  if (udrag.on && udrag.moved <= 4 && udrag.target) flyIn(udrag.target);
  udrag.on = false; viewEl.classList.remove('dragging'); wake();
});
viewEl.addEventListener('dblclick', () => { if (inUniverse()) { uniFit(); wake(); } });

// ---- 09-main.js
'use strict';
// 入口：每帧算版面、推进视图变换；数据变了（或每半秒）刷新卡片和用量表。
// 限帧：画面里的动作都很慢，静止时约 30 帧；拖动、缩放、镜头在走、飞入飞出时约 60 帧。
// 不限的话会跟着显示器刷新率跑（144Hz 屏一秒重画 144 次），整页都卡。

let raf = 0, lastFx = 0, started = false, lastFrame = 0, busyUntil = 0;
const FRAME_IDLE = 33, FRAME_BUSY = 16;
function wake() { if (!raf) raf = requestAnimationFrame(frame); }

// 这一帧要不要刷新卡片和面板，以及用量表、终端区画哪几块（返回 null 是这一帧不刷新）。
// 数据一直在来的对话（正在干活的那个）事件很密：数据变了最快每 250 毫秒刷新一次；界面操作（UI.ver）马上刷新；没变也每半秒刷新一次。
// 飞入动画进行中用量表和终端区在画面下方还没露出来，先不搭（一次要算整份统计、建整块 DOM），免得和动画抢同一帧；
// 落地后先搭用量表，搭完了再搭终端区，两块不挤在同一帧里。
// 用量表和终端区一次只新建约 12 毫秒的行（第一次搭、行一下多了很多时），没建完的下一帧接着建（again）。
// 卡片没建完（world，06-cards.js 的 renderWorld 分帧建）时下一帧只接着建卡片，用量表和终端区不跟着重画
const DOM = { version: -1, ui: -1, at: 0, deferred: false, again: false, world: false, warmed: false };
function domStep(nowMs, landing) {
  if (!(UI.ver !== DOM.ui || B.version !== DOM.version && nowMs - DOM.at >= 250 || nowMs - DOM.at > 500 || DOM.again || DOM.deferred && !landing)) {
    return DOM.world ? { table: false, terms: false } : null;
  }
  DOM.version = B.version; DOM.ui = UI.ver; DOM.at = nowMs; DOM.again = false;
  if (landing) { DOM.deferred = 'all'; return { table: false, terms: false }; }
  if (DOM.deferred === 'all') return { table: true, terms: false };
  if (DOM.deferred === 'terms') return { table: false, terms: true };
  return { table: true, terms: true };
}
// 这一帧画了哪几块（dom，domStep 的返回）、画完没有：落地后的那一段按它往下走，没画完的下一帧再画
function domDrawn(dom, table, terms) {
  if (DOM.deferred === 'all') { if (dom.table) { if (table) DOM.deferred = 'terms'; else DOM.again = true; } return; }
  if (DOM.deferred === 'terms') { if (dom.terms) { if (terms) DOM.deferred = false; else DOM.again = true; } return; }
  if (dom.table && !table || dom.terms && !terms) DOM.again = true;
}
// 用户在操作：接下来一小段时间按忙时的帧率画
function busy(ms = 400) { busyUntil = Math.max(busyUntil, performance.now() + ms); }
for (const type of ['wheel', 'pointermove', 'pointerdown', 'keydown']) addEventListener(type, () => busy(), { passive: true, capture: true });

// 一帧里出了错不能拖垮整个页面：记一次日志，下一帧照常画（不然 requestAnimationFrame 链断掉，页面就停住了）
let frameError = null;
function frame() {
  raf = 0;
  try { step(); } catch (e) {
    if (String(e) !== frameError) { frameError = String(e); console.error('board: frame failed', e); }
    wake();
  }
}

function step() {
  const nowMs = performance.now();
  const moving = nowMs < busyUntil || FLY.mode === 'in' || FLY.mode === 'out' || drag.on || udrag.on
    || (U.on && FLY.mode === 'universe' ? UV.moving : VIEW.goal);   // 只看正在画的那一边的镜头
  // 留 3 毫秒余量：刷新间隔有抖动，卡着整数比较会隔一帧才画
  if (nowMs - lastFrame < (moving ? FRAME_BUSY : FRAME_IDLE) - 3) { wake(); return; }
  lastFrame = nowMs;
  UV.fitCache = null; UV.frame++;
  viewBox(); // 先量视图，这一帧后面写 DOM 以后不再量（05-world.js）
  // 连不上看板服务超过 20 秒：多半是服务退出了或者换了新地址，重连旧地址没有用，提示去拿新链接（只说一次，连上后重置）。
  // 每帧都查：飞进看板以后星图那一层不再画，也要能提示
  // 已经确认服务退出、显示着一直留着的提示时，不拿这条会淡出的盖掉
  if (U.lostAt != null && !U.lostNoticed && !U.done && nowMs - U.lostAt > 20000) { U.lostNoticed = true; if (!showNotice.kept) showNotice(TEXT.serverLost); }
  if (U.on) {
    // 宇宙层：飞入飞出的过渡里两边都画，按各自占的份额淡入淡出
    stepFly();
    const share = flyShare();
    FLYFX = flyFx(share);
    if (share.uni > 0) uniFrame(share.fx <= 0);
    applyShare(share);
    renderCrumb();
    if (share.fx <= 0) { if (FLY.mode === 'in') warmBoard(); wake(); return; }
  }
  stepReel(nowMs);
  const t = now();
  smoothFrame(t);
  const L = computeLayout(t);
  if (!started) { started = true; VIEW.H = L.H; fitView(true); }
  const viewMoving = stepView(L.H);
  // 飞入落地以后镜头还在走的那一段也先不搭：第一次搭用量表和终端区要一两百毫秒，等画面停下再搭就看不出顿
  // 这一帧刚算了 Claude Code 车道的统计，面板就留到下一帧再刷新（连着最多留一次）
  DOM.warmed = !DOM.warmed && warmBoard();
  const dom = DOM.warmed ? null : domStep(nowMs, FLY.mode === 'in' || DOM.deferred === 'all' && viewMoving);
  if (dom) {
    loadFinals();
    renderTop(t);
    const world = renderWorld(t, L);
    const table = dom.table ? renderTable(t) : true, terms = dom.terms ? renderTerms(t, L) : true;
    domDrawn(dom, table, terms);
    DOM.world = !world; // 卡片还没建完，下一帧接着建
  }
  placeWorld(L, t);
  // 往下滚到终端、星图整个移出屏幕时不画画布。镜头不动时画布约 30 帧就够了；飞入飞出的弧线区炸开、收拢时每帧都画，
  // 不然它只有宇宙层一半的帧数，看起来一顿一顿的
  const flying = FLY.mode === 'in' || FLY.mode === 'out';
  if ((viewMoving || flying || nowMs - lastFx >= 30) && viewBox().bottom > 0) { lastFx = nowMs; drawFx(t, L); }
  wake();
}

// 提前算好 Claude Code 车道的统计（长对话有两万条统计事件，每来一批新事件整段重算要十几毫秒，之后有缓存）：
// 飞入的前一段看板还没开始画、宇宙层一帧只要几毫秒；平时是要刷新面板的那一帧之前，让两样不挤在同一帧。
// 返回这一帧是不是算了
function warmBoard() {
  const cc = B.laneById.get('cc');
  // 分段缓存还是这一版的（04-rates.js 的 segments 用同样的版本号）就不用算；回放的版本号算法不同，不提前算
  if (!cc?.rate_events.length || FINAL_EV.has('cc') || cc.segs && cc.segsAt === `${cc.ver || 0}|${cc.runs.length}`) return false;
  laneStats(cc, now());
  return true;
}

// 宇宙层：所有对话的星图（08-uni-*.js），飞进某个对话之前不画看板
let uniStarted = false;
// 看板也在画时（过渡中）平滑的节拍由看板那边推进，免得两个时钟交替让平滑每帧都当成跳变
function uniFrame(alone = true) {
  const t = uNow();
  if (alone) smoothFrame(t);
  // 飞出时看板在进度 0.3 停画（alone），面板从这时起换成宇宙的，跟着淡入（08-uni-fly.js 的 applyShare）
  if (FLY.mode === 'universe' || FLY.mode === 'out' && alone) { renderUniPanels(); renderUniTop(); }
  const L = uniLayout();
  if (!uniStarted && L.galaxies.length) {
    uniStarted = true;
    if (!(Q.get('focus') && uniFocus(L, Q.get('focus')))) uniFit(true);
  }
  // 直播时星图到了两秒还找不到要飞进去的对话（超出时间窗口或显示上限）：说一声，不再等。回放里对话是陆续出现的，不算
  if (FLY.pending && FLY.mode === 'universe' && !U.sessions.has(FLY.pending) && U.clock.mode !== 'replay'
    && U.loadedAt != null && performance.now() - U.loadedAt > 2000) {
    FLY.pending = null; showNotice(TEXT.focusMissing);
  }
  // ?s=<对话>：打开链接时先看一眼宇宙，再飞进这个对话；刷新页面时直接回到对话。回放时对话是陆续出现的，等它出现了再进去
  if (FLY.pending && FLY.mode === 'universe' && U.sessions.has(FLY.pending)) {
    const id = FLY.pending, ms = performance.now();
    if (RELOADED) { FLY.pending = null; flyIn(id, true); }
    else if (FLY.pendingAt == null) FLY.pendingAt = ms + 800;
    else if (ms >= FLY.pendingAt) { FLY.pending = null; FLY.pendingAt = null; flyIn(id); }
    wake();
  }
  stepUni();
  // 往下滚到终端、星图整个移出屏幕时不画
  if (viewBox().bottom > 0) drawUniverse(L);
  setText($("zoom-val"), `${Math.round((UV.k / uniFitGoal().k) * 100)}%`);
}

// 图片的原生拖动一律不要（CSS 管不到的浏览器靠这里）
addEventListener('dragstart', (e) => { if (e.target instanceof HTMLImageElement) e.preventDefault(); });
history.scrollRestoration = 'manual'; // 每次打开都停在星图和用量面板的位置
// 页头下方的一行提示，12 秒后淡出；keep 为 true 时一直留着（看板服务已经退出）
function showNotice(text, keep = false) {
  const el = $('notice');
  el.textContent = text; el.classList.remove('faded');
  clearTimeout(showNotice.timer); showNotice.timer = keep ? null : setTimeout(() => el.classList.add('faded'), 12000);
  showNotice.kept = keep;
}

// 后台满 10 分钟取消订阅，省下服务和浏览器的计算；直连流也会腾出同主机最多 6 条的连接。
// 让出以后再回来，较早的记录只剩最近 200 条，不能切一下窗口就让；
// 前台的页面连不上超过 2 秒时，通过同源广播请后台用直连流的看板标签页马上让出来。
// 让出以后每分钟向服务报一次在，服务不会因为没有连接就当成没人看而退出；
// 在后台放了 30 分钟以上就不再报，忘在后台的标签页不能让服务一直不退出
const HIDDEN_RELEASE_MS = 600000, WATCHING_PING_MS = 60000, WATCHING_MAX_MS = 1800000;
let hiddenReleaseTimer = null, watchingTimer = null, hiddenSince = null;
const STREAM_CHANNEL = typeof BroadcastChannel === 'function' ? new BroadcastChannel('foreman-board-streams') : null;
const streamPaused = () => U.demo || window.__BOARD_FIXTURE__ || B.params.replay != null || B.params.t != null;
function releaseStreams() {
  clearTimeout(hiddenReleaseTimer); hiddenReleaseTimer = null;
  if (streamsReleased || streamPaused()) return;
  streamsReleased = true;
  disconnectUniverse(); disconnect();
  watchingTimer = setInterval(() => {
    if (hiddenSince != null && performance.now() - hiddenSince >= WATCHING_MAX_MS) { clearInterval(watchingTimer); watchingTimer = null; return; }
    fetch('health?watching=1').catch(() => {});
  }, WATCHING_PING_MS);
}
// 前台页面的流迟迟连不上（01-state.js 的 watchStream 调用）：请其他看板标签页让出连接
function askForStream() { if (STREAM_CHANNEL && document.visibilityState !== 'hidden') STREAM_CHANNEL.postMessage('release'); }
if (STREAM_CHANNEL) STREAM_CHANNEL.onmessage = (e) => {
  if (e.data === 'release' && document.visibilityState === 'hidden'
    && [B.es, U.es].some((es) => es && (!(es instanceof SharedStream) || es.direct))) releaseStreams();
};
function onVisibilityChange() {
  clearTimeout(hiddenReleaseTimer); hiddenReleaseTimer = null;
  // 回放重连会从头播放，不能暂停共用时钟；定格和演示沿用原来的取数方式。
  if (streamPaused()) return;
  if (document.visibilityState === 'hidden') { hiddenSince = performance.now(); hiddenReleaseTimer = setTimeout(releaseStreams, HIDDEN_RELEASE_MS); return; }
  hiddenSince = null;
  // 回到前台时流还卡在连接中（在后台时连接被占满了）：请其他看板标签页让出，不用等它们自己隐藏满 10 分钟
  if (!streamsReleased && [B.es, U.es].some((es) => es?.readyState === 0)) askForStream();
  if (streamsReleased) {
    streamsReleased = false;
    clearInterval(watchingTimer); watchingTimer = null;
    if (FLY.mode === 'in' || FLY.mode === 'board') connect();
    else connectUniverse(); // 飞出已经切回宇宙流，动画未结束时也接回同一层。
  }
}
document.addEventListener('visibilitychange', onVisibilityChange);
onVisibilityChange();
if (LIVE_REPLAY_LINK) showNotice(TEXT.replayLive);
// 内嵌快照（截图、测试用）：没有服务可连，直接显示快照里这个对话的看板，不走星图
if (window.__BOARD_FIXTURE__) { FLY.mode = 'board'; connect(); }
else { connectUniverse(); resolveLegacyFocus(); }
wake();
</script>
</body>
</html>
