<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>foreman board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27%23e8a36a%27/%3E%3C/svg%3E">
<style>:root {
  --bg: #050506; --panel: #0b0b0e; --edge: #26262b; --edge2: #3a3a42;
  --dim: #5c5c66; --mid: #8f8f9c; --text: #d2d2d9; --hi: #f5f5f8; --bad: #e88a9f;
  /* 状态色调（scripts/display.mjs 的 toneOf，和终端的上色一一对应）：运行中、完成、部分完成/交回问题/排队、失败、已续接和没开始 */
  --tone-run: #b9a3ff; --tone-ok: #82d99c; --tone-warn: rgb(232,194,122); --tone-bad: var(--bad); --tone-dim: var(--dim);
  --mono: ui-monospace, "Cascadia Mono", "Sarasa Mono SC", Consolas, Menlo, monospace;
  --top-h: 36px; --table-h: min(195px, 32vh); /* 底部面板固定高度：表头、正好 7 行（每行 19px）、合计；行多了在面板里滚动 */
}
* { box-sizing: border-box; }
/* 整页可以往下滚：上面是星图和用量面板（打开时的位置），再往下是终端 */
html, body { margin: 0; background: radial-gradient(ellipse at 38% 45%, #101012 0%, #070708 55%, #020203 100%) fixed, var(--bg); color: var(--text); font: 12px/1.45 var(--mono); }
body { overflow-x: hidden; }
html { scrollbar-width: thin; scrollbar-color: rgba(200,200,212,.25) transparent; }
button { font: inherit; color: var(--mid); background: rgba(12,12,15,.9); border: 1px solid var(--edge); cursor: pointer; }
button:hover, button:focus-visible { color: var(--hi); border-color: var(--mid); outline: none; }

#top { position: fixed; left: 0; right: 0; top: 0; height: var(--top-h); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid rgba(200,200,212,.16); box-shadow: 0 1px 12px -6px rgba(230,230,240,.35); z-index: 5; background: rgba(5,5,6,.95); white-space: nowrap; overflow: hidden; }
#top .brand b { color: var(--hi); letter-spacing: .14em; font-size: 12px; }
#top .brand span { color: var(--dim); margin-left: 12px; }
#clock { color: var(--mid); margin-left: 12px; overflow: hidden; text-overflow: ellipsis; }
#progress { position: absolute; left: 0; bottom: -1px; height: 1px; width: 0; background: var(--mid); }
#notice { position: fixed; top: calc(var(--top-h) + 8px); left: 50%; transform: translateX(-50%); z-index: 6; max-width: calc(100% - 28px); color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .8s; }
#notice.faded { opacity: 0; }

/* 主视图：画布和"世界"（卡片层）用同一个缩放平移 */
#view { position: relative; margin-top: var(--top-h); height: calc(100vh - var(--top-h) - var(--table-h)); overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
#view.dragging { cursor: grabbing; }
canvas#fx, canvas#ufx { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
body:not(.u-on) canvas#ufx, body.uni canvas#fx { display: none; }
#crumb { display: inline-flex; gap: 6px; margin-left: 12px; color: var(--dim); font-size: 11px; }
#brand.link { cursor: pointer; }
#brand.link:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.35); }
#crumb i { font-style: normal; opacity: .5; }
#crumb b { color: var(--text); font-weight: 500; }
/* 边缘压暗一点，中间更通透 */
#view::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; z-index: 2; }
/* 看板画布分两层：底下 #fx 是弧线区（切换时炸开），上面 #fxo 是光线、刻度带、标签（切换时淡入淡出） */
canvas#fxo { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
body.uni canvas#fxo { display: none; }
body.uni #termsec, body.uni #more, body.uni #world, body.uni #view::after, body.uni .board-only, body:not(.uni) .uni-only, body:not(.uni) #uslots { display: none; }
/* 宇宙层右上的名额带 */
#uslots { position: absolute; z-index: 3; top: 10px; display: flex; flex-direction: column; cursor: default; user-select: none;
  background: linear-gradient(180deg, rgba(22,22,27,.62), rgba(7,7,9,.86)); border: 1px solid rgba(170,170,182,.14); }
/* 名额面板在左上（右边留给星系和标签） */
#uslots { left: 10px; width: 236px; max-height: calc(100% - 60px); }
#uslots > header { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-bottom: 1px solid rgba(200,200,212,.12); flex: none; }
#uslots > header b { color: var(--hi); font-size: 10px; letter-spacing: .16em; }
#uslots > header .n { color: var(--dim); font-size: 10px; flex: 1; }
#uslots .rows { padding: 6px 10px 8px; overflow-y: auto; min-height: 0; }
#uslots .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 6px; align-items: center; height: 18px; color: var(--dim); }
#uslots .row.busy { color: var(--text); }
#uslots .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tint); opacity: .7; }
#uslots .row .nm { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#uslots .row .nm small { color: var(--dim); font-size: 9px; }
#uslots .cells { display: flex; gap: 3px; }
#uslots .cells i { width: 10px; height: 10px; border: 1px solid rgba(200,200,212,.22); }
#uslots .cells i.on { background: var(--mark); border-color: var(--mark); box-shadow: 0 0 6px var(--mark); cursor: pointer; }
#uslots .cells i.q { animation: slot-q 1.1s ease-in-out infinite; }
#uslots .cells i.over { border-color: var(--bad); }
@keyframes slot-q { 50% { opacity: .3; } }
#table .tr .av .mk { display: block; width: 8px; height: 8px; margin: 0 5px; border-radius: 50%; background: var(--tint); box-shadow: 0 0 6px var(--tint); }
/* 对话表的状态列要放得下"waiting for you · 弹窗标题"，席位列只有几个点：状态列加宽、席位列收窄，多出来的给"done · failed"的表头 */
#usage[data-mode="uni"] .tr { grid-template-columns: 22px 1.6fr .8fr 1.3fr .6fr 1.1fr 1.2fr .8fr 1fr .7fr; }
#usage[data-mode="uni"] .tbody .tr span:nth-child(2) { font-family: "Microsoft YaHei", sans-serif; }
/* 子对话（从别的对话里启动的）缩在父对话下面，和桌面版侧栏一样 */
#usage[data-mode="uni"] .tbody .tr.kid span:nth-child(2) { padding-left: calc(var(--depth, 1) * 14px - 14px); }
#usage[data-mode="uni"] .tbody .tr.kid span:nth-child(2)::before { content: "└ "; color: var(--dim, #666); }
#usage[data-mode="uni"] .tbody .tr span:nth-child(3) { color: var(--mid); }
#usage[data-mode="uni"] .tbody .tr span:nth-child(4) { color: var(--text); }
#usage[data-mode="uni"] .tbody .tr.s-waiting span:nth-child(4) { color: rgb(255,186,90); }
#usage[data-mode="uni"] .tbody .tr.s-idle span:nth-child(4), #usage[data-mode="uni"] .tbody .tr.s-idle span:nth-child(2) { color: var(--dim); }
#usage[data-mode="uni"] .tbody .tr span:nth-child(5) { color: var(--tint); }
/* 对话行：悬停或星图里悬停到它的星系时亮起来，左边一道它的标记色；点一下飞进去 */
#usage[data-mode="uni"] .tbody .tr { cursor: pointer; }
#usage[data-mode="uni"] .tbody .tr:hover, #usage[data-mode="uni"] .tbody .tr.hot { background: rgba(255,255,255,.05); box-shadow: inset 2px 0 var(--tint); }
#usage[data-mode="uni"] .tbody .tr.alert span:nth-child(4) { color: var(--bad); }
#usage .tbody .empty { margin: 0; padding: 10px 22px; color: var(--dim); font-size: 11px; font-family: "Microsoft YaHei", sans-serif; }
#hud { z-index: 3; position: absolute; left: 10px; bottom: 8px; display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 11px; }
#hud button { width: 24px; height: 22px; padding: 0; }
#hud .hint { opacity: .8; }
#hud select { font: inherit; font-size: 11px; color: var(--mid); background: rgba(12,12,15,.9); border: 1px solid var(--edge); height: 22px; padding: 0 4px; cursor: pointer; }
#hud select:hover, #hud select:focus-visible { color: var(--hi); border-color: var(--mid); outline: none; }

/* 卡片：世界坐标里一律 154×96，内容按缩放档位（lod0 简要 / lod1 摘要 / lod2 详情）换 */
.card, .outbox, .ghead { position: absolute; }
/* HUD 面板：半透明玻璃底、四角括号代替整圈边框、里面一圈模型颜色的淡光；运行中括号和边换成模型颜色 */
.card, .outbox {
  --cc: rgba(215,215,225,.5); --cs: 8px;
  background:
    linear-gradient(var(--cc), var(--cc)) left top / var(--cs) 1px no-repeat,
    linear-gradient(var(--cc), var(--cc)) left top / 1px var(--cs) no-repeat,
    linear-gradient(var(--cc), var(--cc)) right top / var(--cs) 1px no-repeat,
    linear-gradient(var(--cc), var(--cc)) right top / 1px var(--cs) no-repeat,
    linear-gradient(var(--cc), var(--cc)) left bottom / var(--cs) 1px no-repeat,
    linear-gradient(var(--cc), var(--cc)) left bottom / 1px var(--cs) no-repeat,
    linear-gradient(var(--cc), var(--cc)) right bottom / var(--cs) 1px no-repeat,
    linear-gradient(var(--cc), var(--cc)) right bottom / 1px var(--cs) no-repeat,
    linear-gradient(160deg, rgba(30,30,36,.5), rgba(8,8,10,.8));
  border: 1px solid rgba(170,170,182,.13);
  box-shadow: inset 0 0 18px -9px var(--tint, transparent);
}
.card { width: 154px; height: 96px; overflow: hidden; cursor: zoom-in; }
/* G 步的状态：等你确认（琥珀呼吸光）、排队（琥珀虚线闪烁）、取消（褪灰）、失败（红边） */
.card.asking { --cc: rgb(255,186,90); border-color: rgba(255,186,90,.75) !important; animation: card-ask 2.2s ease-in-out infinite; }
@keyframes card-ask { 0%, 100% { box-shadow: 0 0 0 1px rgba(255,186,90,.55), 0 0 24px -2px rgba(255,186,90,.55); } 50% { box-shadow: 0 0 0 1px rgba(255,186,90,.2), 0 0 8px -2px rgba(255,186,90,.2); } }
.card.queued { border-style: dashed; animation: card-q 1.4s ease-in-out infinite; }
@keyframes card-q { 0%, 100% { border-color: rgba(255,186,90,.75); } 50% { border-color: rgba(255,186,90,.15); } }
.card.cancelled { filter: grayscale(1) brightness(.62); }
/* 用量表悬停的那条车道：卡片描一圈它的颜色，其余卡片和产出框压暗 */
.card.hot { --cc: var(--tint); border-color: color-mix(in srgb, var(--tint) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tint) 60%, transparent), 0 0 22px -4px var(--tint); }
.card.dim, .outbox.dim { opacity: .32; transition: opacity .15s; }
#usage:not([data-mode="uni"]) .tbody .tr:hover, #usage:not([data-mode="uni"]) .tbody .tr.hot { background: rgba(255,255,255,.05); box-shadow: inset 2px 0 var(--tint); }
.card.ghost.gap-ready { animation: gap-ready 1.8s ease-in-out infinite; }
@keyframes gap-ready { 0%, 100% { border-color: rgba(245,245,248,.25); box-shadow: none; } 50% { border-color: rgba(245,245,248,.75); box-shadow: 0 0 16px -4px rgba(245,245,248,.45); } }
.card.failed { --cc: var(--bad); border-color: color-mix(in srgb, var(--bad) 70%, transparent); box-shadow: 0 0 16px -7px var(--bad); }
.card.running { --cc: var(--tint); border-color: color-mix(in srgb, var(--tint) 38%, transparent); box-shadow: inset 0 0 22px -8px var(--tint), 0 0 18px -9px var(--tint); }
.card .av { position: absolute; display: block; aspect-ratio: 1; object-fit: contain; }
.card .hd { position: absolute; right: 4px; min-width: 0; }
.card .hd > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .model { color: var(--hi); font-weight: 700; }
.card .st { color: var(--mid); }
/* 改到范围外的文件：状态行最前面一个琥珀色的 ⚠N */
.card .st[data-over]::before { content: "⚠" attr(data-over) " "; color: var(--tone-warn); }
.card .tl { color: var(--text); font-weight: 600; }
.card .rate { color: var(--dim); }
.card .rate .now { color: var(--tint); }
.card .term { position: absolute; left: 5px; right: 4px; margin: 0; padding: 0; list-style: none; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; color: var(--mid); }
.card .term li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
/* 时间是行内块，会继承行的悬挂缩进（text-indent: -8ch），自己的文字被推到框外、在栏的左边被裁掉：清零 */
.term .ts { color: var(--dim); display: inline-block; width: 6ch; text-indent: 0; }
.term .mk { color: var(--edge2); }
.term .node, .term .user, .term .link { color: var(--text); }
.term .node .mk, .term .user .mk { color: var(--tint); }
.term .bad { color: var(--bad); }
/* 结论、错误、越界写入这些行里带色的片段（06-cards.js 的 painted），颜色和终端一致 */
.term .c-bad { color: var(--tone-bad); } .term .c-ok { color: var(--tone-ok); } .term .c-warn { color: var(--tone-warn); }
.term .c-run { color: var(--tone-run); } .term .c-dim { color: var(--tone-dim); } .term .c-bold { font-weight: 600; }
.term .fold { color: var(--dim); }
.card .think { position: absolute; left: 5px; right: 4px; bottom: 2px; color: var(--dim); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#world.lod0 .card .av { left: 8px; top: 18px; width: 54px; }
#world.lod0 .card .hd { left: 69px; top: 16px; font-size: 8.5px; line-height: 1.55; }
#world.lod0 .card .hd .model { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
/* 默认缩放下速度行放不下一行：折成最多三行（now、gen avg、out），不再把平均速度和输出量裁掉 */
#world.lod0 .card .hd .rate { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
#world.lod0 .card .tl, #world.lod0 .card .term, #world.lod0 .card .think { display: none; }

#world.lod1 .card .av { left: 5px; top: 5px; width: 32px; }
#world.lod1 .card .hd { left: 43px; top: 5px; font-size: 5.8px; line-height: 1.45; }
#world.lod1 .card .term { top: 49px; bottom: 3px; font-size: 5.2px; line-height: 1.4; }
#world.lod1 .card .think { display: none; }

#world.lod2 .card .av { left: 3px; top: 3px; width: 20px; }
#world.lod2 .card .hd { left: 27px; top: 3px; font-size: 4.4px; line-height: 1.42; }
#world.lod2 .card .term { top: 29px; bottom: 9px; font-size: 3.9px; line-height: 1.38; }
#world.lod2 .card .think { font-size: 3.8px; }

/* 产出框：和对应卡片同一行、同样高 */
/* 出现时从光团的位置长出来：光团在框左边往里 18px 的中线上（08-outlife.js 的 anchorOf） */
.outbox { transform-origin: 18px 50%; width: 184px; height: 44px; overflow: hidden; padding: 3px 6px; color: var(--mid); --cs: 6px; --cc: color-mix(in srgb, var(--tint, #96a5e1) 55%, transparent); z-index: 1; }
.outbox.cc { z-index: 0; }
.outbox h4 { margin: 0 0 2px; letter-spacing: .1em; color: var(--dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outbox .f { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outbox .f i { font-style: normal; color: var(--tint, var(--hi)); margin-right: 4px; }
.outbox .rep { color: var(--text); margin-top: 2px; overflow: hidden; }
.outbox .empty { color: var(--dim); }
/* 出图任务的缩略图：输出框右侧一排小方图 */
.outbox .thumbs { position: absolute; right: 4px; top: 4px; bottom: 4px; display: flex; gap: 3px; }
.outbox .thumbs img { height: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--edge2); background: #000; }
#world.lod0 .outbox { font-size: 7px; line-height: 1.38; }
#world.lod0 .outbox .rep { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#world.lod0 .outbox .f:nth-of-type(n+3) { display: none; }
#world.lod1 .outbox { font-size: 4.8px; line-height: 1.38; }
#world.lod1 .outbox .rep { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
#world.lod2 .outbox { font-size: 3.4px; line-height: 1.36; padding: 2px 4px; }

/* 刻度带里的组头 */
.ghead { width: 154px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-size: 6.5px; line-height: 1.4; }
.ghead b { color: var(--text); }
.ghead.old { opacity: .45; }

/* 底部用量表 */
#table, #termsec { position: relative; margin: 0 8px 6px; height: calc(var(--table-h) - 6px); padding: 6px 14px; overflow: hidden; z-index: 3;
  --cc: rgba(215,215,225,.5); --cs: 12px;
  background:
    linear-gradient(var(--cc), var(--cc)) left top / var(--cs) 1px no-repeat, linear-gradient(var(--cc), var(--cc)) left top / 1px var(--cs) no-repeat,
    linear-gradient(var(--cc), var(--cc)) right top / var(--cs) 1px no-repeat, linear-gradient(var(--cc), var(--cc)) right top / 1px var(--cs) no-repeat,
    linear-gradient(var(--cc), var(--cc)) left bottom / var(--cs) 1px no-repeat, linear-gradient(var(--cc), var(--cc)) left bottom / 1px var(--cs) no-repeat,
    linear-gradient(var(--cc), var(--cc)) right bottom / var(--cs) 1px no-repeat, linear-gradient(var(--cc), var(--cc)) right bottom / 1px var(--cs) no-repeat,
    linear-gradient(180deg, rgba(22,22,27,.55), rgba(7,7,9,.85));
  border: 1px solid rgba(170,170,182,.13); }
#table .tr { display: grid; grid-template-columns: 22px 1.7fr .8fr .8fr 1.3fr .8fr 1.2fr .8fr 1fr .7fr; gap: 10px; align-items: center; height: 19px; white-space: nowrap; }
#table .tr span { overflow: hidden; text-overflow: ellipsis; }
#table .th { color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid rgba(200,200,212,.14); height: 21px; }
#table .tbody { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: rgba(200,200,212,.25) transparent; }
/* 下面还有行时，最后一行淡出，提示可以在面板上滚动 */
#table .tbody.more { mask-image: linear-gradient(180deg, #000 calc(100% - 14px), transparent); }
#table .tr .av img { width: 18px; height: 18px; object-fit: contain; display: block; }
#table .tbody .tr span:nth-child(2) { color: var(--text); }
/* 组标题行：比车道行矮、字暗一些，左边是类型 · 标题，右边是各状态的个数（颜色和终端一致） */
#table .tbody .tr.gh { display: flex; justify-content: space-between; gap: 10px; height: 16px; margin-top: 3px; padding: 0 2px; font-size: 10px; color: var(--mid); border-top: 1px dashed rgba(200,200,212,.1); }
#table .tbody .tr.gh span:first-child { color: var(--mid); }
#table .tbody .tr.gh .cnt { flex: none; }
#table .tbody .tr.gh .cnt i { font-style: normal; margin-left: 7px; }
#table .tbody .tr.gh .cnt i[data-tone="run"] { color: var(--tone-run); } #table .tbody .tr.gh .cnt i[data-tone="ok"] { color: var(--tone-ok); }
#table .tbody .tr.gh .cnt i[data-tone="warn"] { color: var(--tone-warn); } #table .tbody .tr.gh .cnt i[data-tone="bad"] { color: var(--tone-bad); }
#table .tbody .tr.gh .cnt i[data-tone="dim"] { color: var(--tone-dim); }
#table .tbody .tr span:nth-child(4) { color: var(--tint); }
#table svg { width: 100%; height: 16px; display: block; }
/* 小曲线不用逐行滤镜：第一次展开长对话时，阴影着色器会拖慢落地帧。 */
#table svg polyline { fill: none; stroke: var(--tint); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#table .total { border-top: 1px solid rgba(200,200,212,.14); color: var(--hi); }
/* 单对话视图：用量面板行放不下时，合计行最右边（用时那一格本来是空的）放"展开全部"；展开后面板按全部行的高度排开，往下推开终端区 */
#tall { position: absolute; right: 14px; bottom: 6px; height: 19px; padding: 0 8px; font-size: 10px; letter-spacing: .06em; z-index: 4; }
/* 只对看板的用量表起作用：飞入飞出的过渡里 body 暂时没有 uni，#usage 里可能还是宇宙的对话表（data-mode="uni"） */
#tall[hidden], body.uni #tall, #table:has(> #usage[data-mode="uni"]) #tall { display: none; }
body.table-all #table:has(> #usage:not([data-mode="uni"])), body.table-all #usage:not([data-mode="uni"]) { height: auto; }
body.table-all #usage:not([data-mode="uni"]) .tbody { overflow: visible; mask-image: none; }
#status { position: absolute; right: 14px; top: calc(100vh - var(--table-h) - 22px); color: var(--dim); font-size: 11px; z-index: 3; }
#status.bad { color: var(--bad); }

/* 派发流程：计划里还没启动的席位画成虚影卡（虚线框、头像发灰），产出框和组头加流程行 */
.card.ghost, .outbox.ghost { border-style: dashed; border-color: color-mix(in srgb, var(--tint) 40%, transparent); --cc: color-mix(in srgb, var(--tint) 60%, transparent);
  background: linear-gradient(160deg, rgba(20,20,24,.35), rgba(6,6,8,.55)); box-shadow: none; }
.card.ghost .av { filter: grayscale(.8) brightness(.75); opacity: .8; }
.card.ghost .st, .card.ghost .tl { color: var(--mid); }
.outbox.ghost { color: var(--dim); }
.outbox .lead { color: color-mix(in srgb, var(--tint, var(--hi)) 70%, white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 用量面板（右上角有往下看终端的提示）和下面的终端区 */
#usage { display: grid; grid-template-rows: auto 1fr auto; height: 100%; min-height: 0; }
#hud #more { width: auto; padding: 0 8px; letter-spacing: .08em; }
/* 终端区按内容伸长：运行中的一排占一屏高，下面已结束的一段接着往下排，用页面滚动看。
   列宽不随内容撑开（minmax(0, 1fr)、min-width: 0），栏多时在各自那一排里横向滚动 */
#termsec { --col-h: calc(100vh - var(--top-h) - 50px); height: auto; min-height: calc(100vh - var(--top-h) - 14px); margin-bottom: 8px; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto var(--col-h) auto; align-content: start; gap: 6px; }
/* 已结束的组：终端区下面一段。小标题缩进、不加粗，看得出是终端区里的一段，不和 TERMINAL 同级；
   展开的组排成一排，栏的样子和高度都和上面运行中的一样（栏头可以点着收起）；折起来的一组一行，全部列在下面 */
/* 上面一排没有正在运行的组时不占高度 */
#termsec:has(#terms:empty) { grid-template-rows: auto 0 auto; }
#termdone { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#termdone[hidden] { display: none; }
#termdone > .sub { flex: none; display: flex; align-items: center; gap: 8px; padding-left: 6px; color: var(--dim); font-size: 10px; }
#termdone > .sub::after { content: ""; flex: 1; border-top: 1px dashed rgba(200,200,212,.12); }
#termdone > .row { flex: none; height: var(--col-h); display: flex; gap: 8px; min-width: 0; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; scrollbar-width: thin; scrollbar-color: rgba(200,200,212,.25) transparent; }
#termdone > .row:empty, #termdone > .lines:empty { display: none; }
#termdone > .lines { flex: none; min-width: 0; }
#termdone .dline { cursor: pointer; color: var(--mid); font-size: 10.5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#termdone .dline:hover { color: var(--text); background: rgba(255,255,255,.04); }
.tcol.done-open > header { cursor: pointer; }
.tcol.done-open > header > b::before { content: "▾ "; color: var(--dim); font-weight: 400; }
.tcol.done-open > header:hover { background: rgba(255,255,255,.04); }
/* 组栏全部结束时底部一行，和终端分组查看的"✔ all finished"一样 */
.tgroup .all-done { flex: none; padding: 2px 6px; font-size: 10px; color: var(--dim); }
.tgroup .all-done:empty { display: none; }
.tgroup .all-done::first-letter { color: var(--tone-ok); }
#termsec > header { display: flex; align-items: baseline; gap: 12px; height: 18px; border-bottom: 1px solid rgba(200,200,212,.14); }
#termsec > header b { color: var(--hi); font-size: 10px; letter-spacing: .16em; }
#termsec > header span { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 终端页：每个模型一栏，Claude Code 那栏宽一些；栏多时横向滚动 */
#terms { display: flex; gap: 8px; min-height: 0; min-width: 0; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
.tcol { flex: 1 0 260px; min-width: 260px; display: flex; flex-direction: column; min-height: 0; border: 1px solid rgba(170,170,182,.13); background: rgba(8,8,10,.55); }
.tcol.cc { flex: 1.6 0 340px; }
.tcol.running { border-color: color-mix(in srgb, var(--tint) 45%, transparent); box-shadow: inset 0 0 14px -10px var(--tint); }
.tcol header { display: flex; align-items: center; gap: 6px; padding: 2px 6px; font-size: 10px; border-bottom: 1px solid rgba(170,170,182,.12); white-space: nowrap; overflow: hidden; flex: none; }
.tcol header img { width: 16px; height: 16px; object-fit: contain; flex: none; }
.tcol header b { color: var(--hi); overflow: hidden; text-overflow: ellipsis; }
.tcol header .st { color: var(--mid); overflow: hidden; text-overflow: ellipsis; }
.tcol .term { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 3px 6px 4px; list-style: none; font-size: 10.5px; line-height: 1.5; color: var(--mid); scrollbar-width: thin; scrollbar-color: rgba(200,200,212,.25) transparent; }
/* 单车道栏的正文很长（Claude Code 那一栏几百行）：不在屏幕上时不排版。飞进长对话、落地后第一次搭终端区时，
   终端区还在视口下面，不用为了量尺寸把它整块排一遍（那一帧原来要五六十毫秒）。高度由栏撑满，和内容无关，显示出来时不跳。
   终端区进了视口页面就给它加 inview（07-terms.js），这时照常排版，贴底和画面在同一帧 */
#termsec:not(.inview) .tcol:not(.tgroup) > .term { content-visibility: auto; contain-intrinsic-size: auto 300px; }
.tcol .term li { padding-left: 8ch; text-indent: -8ch; white-space: pre-wrap; overflow-wrap: anywhere; }

/* 终端页的单任务栏：头部第二行是任务行 */
.tcol .task { color: var(--text); font-size: 10px; padding: 1px 6px 2px; border-bottom: 1px solid rgba(170,170,182,.08); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
/* 组任务视图（和原生终端的 watch --group 一样）：标题行 + 各状态个数，下面每席一块 */
.tgroup { flex: 2.2 0 440px; }
.tgroup > header { justify-content: space-between; }
.tgroup > header b { color: var(--text); font-weight: 600; }
.tgroup .cnt i { font-style: normal; margin-left: 7px; }
.tgroup .seats { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(200,200,212,.25) transparent; }
.seat { padding: 3px 6px 4px; border-bottom: 1px dashed rgba(170,170,182,.13); cursor: pointer; --pad: calc(2ch + 26px); }
.seat:hover { background: rgba(255,255,255,.03); }
.seat .id { display: flex; align-items: center; gap: 6px; font-size: 10.5px; white-space: nowrap; overflow: hidden; }
.seat .id .no { color: var(--dim); width: 2ch; text-align: right; flex: none; }
.seat .id img { width: 14px; height: 14px; object-fit: contain; flex: none; }
.seat .id b { color: var(--hi); overflow: hidden; text-overflow: ellipsis; }
.seat .id .st { margin-left: auto; flex: none; }
.seat .id .mk { font-style: normal; flex: none; }
.seat[data-kind="resumed"] .id b { color: var(--dim); }
.card:is(.partial, .blocked) { --cc: rgb(232,194,122); border-color: rgba(232,194,122,.5); }
.card.resumed { filter: brightness(.72); }
.seat .role { color: var(--dim); font-size: 10px; padding-left: var(--pad); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcol .seat .term { flex: none; padding: 0 0 0 var(--pad); overflow: visible; }
.tcol .seat.open .term { max-height: 30vh; overflow-y: auto; }
.seat.open { background: rgba(255,255,255,.025); box-shadow: inset 2px 0 0 var(--tint); }
/* 用量行和终端一样写全（缓存比例、上下文窗口、速度、费用），放不下就折行，run_id 仍靠右 */
.seat .use { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 8px; color: var(--dim); font-size: 9.5px; padding-left: var(--pad); }
.seat .use .rid { margin-left: auto; }
.seat .use[hidden] { display: none; }
.seat .use .rid { opacity: .7; overflow: hidden; text-overflow: ellipsis; }
/* 席位正文和原生组视图一样：不写时间，动作各占一行，说的话最多三行；展开看完整时间线时才全部显示 */
.seat .term .ts { display: none; }
.tcol .seat .term li { padding-left: 2ch; text-indent: -2ch; }
.seat:not(.open) .term li.act, .seat:not(.open) .term li.fold { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat:not(.open) .term li:not(.act):not(.plain) { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* 共用规则已经排好的行（运行中的正文、结束后的结论）照原样显示，不再截成三行 */
.seat .term li.plain { white-space: pre-wrap; }
/* 组里的计划缺口和还没开始的派发：一行一条，跟在标题和席位下面 */
.tgroup .plan-notes, .tgroup .dispatch-queue { flex: none; padding: 2px 6px; font-size: 10px; color: rgb(232,194,122); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tgroup .plan-notes:empty, .tgroup .dispatch-queue:empty { display: none; }
.tgroup .dispatch-queue { color: var(--mid); border-top: 1px dashed rgba(170,170,182,.13); }
.seat.open .term .ts { display: inline-block; }
.tcol .seat.open .term li { padding-left: 8ch; text-indent: -8ch; }
/* 只有一席的组：展开的这一席撑满整栏，正文在自己里面滚动、贴底，和单任务栏一样 */
.tgroup.lone .seats { display: flex; flex-direction: column; }
.tgroup.lone .seat.open { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tgroup.lone .seat.open > :not(.term) { flex: none; }
.tgroup.lone .seat.open .term { flex: 1; min-height: 0; max-height: none; overflow-y: auto; }

/* 窄屏：平板去掉次要的列和提示，名额面板窄一些；手机上名额面板只留标题（点一下展开），
   表格只留关键几列，终端各栏上下排。单对话的画布在手机上仍然很小，主要看表格和终端 */
@media (max-width: 900px) {
  #hud .hint { display: none; }
  #uslots { width: 190px; }
  #table .tr { gap: 8px; }
  #usage:not([data-mode="uni"]) .tr { grid-template-columns: 22px 1.7fr .9fr .8fr .8fr 1.2fr .8fr .9fr; }
  #usage:not([data-mode="uni"]) .tr > span:nth-child(5), #usage:not([data-mode="uni"]) .tr > span:nth-child(10) { display: none; }
  #usage[data-mode="uni"] .tr { grid-template-columns: 22px 1.25fr 1.25fr 1.05fr 1.1fr .75fr .8fr .6fr; }
  #usage[data-mode="uni"] .tr > span:nth-child(3), #usage[data-mode="uni"] .tr > span:nth-child(5) { display: none; }
}
@media (max-width: 600px) {
  #top { padding: 0 10px; }
  #top .brand { display: flex; align-items: center; min-width: 0; overflow: hidden; }
  #scope { display: none; }
  #crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* 路径是 flex 容器，省略号要加在里面放不下的那一段（通常是对话标题）上 */
  #crumb > :is(span, b) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #clock { font-size: 10px; flex: none; }
  #uslots { width: 132px; }
  #uslots .rows { display: none; }
  #uslots:hover .rows, #uslots:focus-within .rows { display: block; }
  #uslots:hover { width: 220px; }
  #table, #termsec { margin: 0 4px 6px; padding: 6px 8px; }
  #table .tr { gap: 6px; }
  #usage:not([data-mode="uni"]) .tr { grid-template-columns: 18px 1.3fr .95fr .7fr .75fr 1.1fr; }
  #usage:not([data-mode="uni"]) .tr > span:is(:nth-child(4), :nth-child(7)) { display: none; }
  #usage[data-mode="uni"] .tr { grid-template-columns: 18px 1.3fr 1.5fr .7fr .9fr; }
  #usage[data-mode="uni"] .tr > span:is(:nth-child(6), :nth-child(7), :nth-child(10)) { display: none; }
  #termsec { height: auto; min-height: calc(100vh - var(--top-h) - 14px); }
  #terms, #termdone > .row { flex-direction: column; overflow: visible; height: auto; }
  #termsec, #termsec:has(#terms:empty) { grid-template-rows: auto auto auto; }
  .tcol, .tcol.cc, .tgroup { flex: none; min-width: 0; height: 70vh; }
}

/* 头像（卡片、用量表、终端栏里的）不能选中、不能拖出来 */
img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }

/* 状态文字统一按色调上色（用量表的状态列、卡片状态行、终端栏头、席位记号和状态、组计数），颜色和终端一致 */
:is(#table .tbody .tr span, .card .st, .tcol header .st, .tgroup .cnt i)[data-tone="run"], .seat[data-tone="run"] .id :is(.mk, .st) { color: var(--tone-run); }
:is(#table .tbody .tr span, .card .st, .tcol header .st, .tgroup .cnt i)[data-tone="ok"], .seat[data-tone="ok"] .id :is(.mk, .st) { color: var(--tone-ok); }
:is(#table .tbody .tr span, .card .st, .tcol header .st, .tgroup .cnt i)[data-tone="warn"], .seat[data-tone="warn"] .id :is(.mk, .st) { color: var(--tone-warn); }
:is(#table .tbody .tr span, .card .st, .tcol header .st, .tgroup .cnt i)[data-tone="bad"], .seat[data-tone="bad"] .id :is(.mk, .st) { color: var(--tone-bad); }
:is(#table .tbody .tr span, .card .st, .tcol header .st, .tgroup .cnt i)[data-tone="dim"], .seat[data-tone="dim"] .id :is(.mk, .st) { color: var(--tone-dim); }

/* 宇宙表的状态列：出了问题的席位每个一个点，颜色按状态色调 */
#usage[data-mode="uni"] .tr span i.issue { display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; vertical-align: 1px; }
#usage[data-mode="uni"] .tr span i.issue[data-tone="bad"] { background: var(--tone-bad); box-shadow: 0 0 5px var(--tone-bad); }
#usage[data-mode="uni"] .tr span i.issue[data-tone="warn"] { background: var(--tone-warn); box-shadow: 0 0 5px var(--tone-warn); }
</style>
</head>
<body>
<header id="top">
  <div class="brand"><b id="brand">FOREMAN</b><nav id="crumb" aria-label="当前位置"></nav><span id="scope"></span></div>
  <div id="clock"></div>
  <i id="progress"></i>
</header>
<div id="notice" role="status"></div>
<main id="view" aria-label="多模型协作视图：滚轮缩放，按住左键拖动，单击卡片放大，双击空白处复位">
  <canvas id="ufx" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="fxo" aria-hidden="true"></canvas>
  <div id="world"></div>
  <aside id="uslots" aria-label="协作方并发名额"></aside>
  <div id="hud">
    <button type="button" id="fit" title="复位（0）">⤢</button>
    <span id="zoom-val"></span>
    <span class="hint board-only">滚轮缩放（刻度带上是滚动）· 拖动平移 · 单击卡片放大 · 双击复位</span>
    <span class="hint uni-only">滚轮缩放 · 拖动平移 · 双击复位</span>
    <button type="button" id="more" title="滚到下面的终端（在用量面板上滚到底后继续滚动也可以）">▾ 终端</button>
  </div>
</main>
<footer id="table">
  <section id="usage"></section>
</footer>
<section id="termsec" aria-label="终端：当前对话里各模型的终端对话">
  <header><b>TERMINAL</b><span id="conv"></span></header>
  <div id="terms"></div>
  <div id="termdone" hidden></div>
</section>
<div id="status" role="status"></div>

function shellSplit(s) {
  const args = [];
  let cur = null;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (/\s/.test(ch)) { if (cur !== null) args.push(cur); cur = null; continue; }
    cur ??= '';
    if (ch === "'") {
      const j = s.indexOf("'", i + 1);
      if (j < 0) return null;
      cur += s.slice(i + 1, j);
      i = j;
    } else if (ch === '"') {
      for (i++; i < s.length && s[i] !== '"'; i++) {
        if (s[i] === '\\' && '"\\$`'.includes(s[i + 1])) i++;
        cur += s[i];
      }
      if (i >= s.length) return null;
    } else if (ch === '\\' && i + 1 < s.length) {
      cur += s[++i];
    } else cur += ch;
  }
  if (cur !== null) args.push(cur);
  return args;
}

function plainCommand(cmd) {
  // Codex 记录的命令是按 shell 规则转义后的整行，比如 "...powershell.exe" -Command "<实际命令>"。
  // 先按规则还原，再去掉外壳，只留实际命令。
  const args = shellSplit(String(cmd ?? ''));
  if (args?.length >= 3 && /(?:^|[\\/])(?:powershell|pwsh|bash|sh|zsh|cmd)(?:\.exe)?$/i.test(args[0]) && /^(?:-Command|-l?c|\/c)$/i.test(args.at(-2))) return args.at(-1);
  const m = /^"?[^"]*?(?:powershell|pwsh|bash|cmd)(?:\.exe)?"?\s+(?:-Command|-l?c|\/c)\s+([\s\S]*)$/i.exec(cmd);
  let inner = m ? m[1] : cmd;
  if (/^(["'])[\s\S]*\1$/.test(inner)) inner = inner.slice(1, -1);
  return inner.replace(/\\(["\\])/g, '$1'); // 记录里的命令转义过反斜杠和引号
}

const charWidth = (ch) => (/[ᄀ-ᅟ⺀-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]/.test(ch) ? 2 : 1);

function fitWidth(s, width) {
  if (textWidth(s) <= width) return s;
  let out = '';
  let w = 0;
  for (const ch of s) {
    if (w + charWidth(ch) > width - 1) break;
    out += ch;
    w += charWidth(ch);
  }
  return `${out}…`;
}

const NO_LINE_START = /[、，。．！？：；）】』」》〉’”…—,.!?:;)\]}%]/;
const NO_LINE_END = /[（【『「《〈‘“([{]/;
const WORD = /[A-Za-z0-9_\-./\\]/; // 英文单词、文件名和路径，折行时不拆开

function wrapWidth(s, width) {
  const lines = [];
  for (const para of String(s).replace(/\r/g, '').split('\n')) {
    let line = '';
    let w = 0;
    for (const ch of para) {
      if (w + charWidth(ch) > width) {
        const chars = [...line];
        let k = chars.length;
        if (NO_LINE_START.test(ch)) {
          // 逗号、句号这类标点不放在行首：把上一行末尾的字（连同它后面的标点）一起带到下一行。
          while (k > 0 && NO_LINE_START.test(chars[k - 1])) k--;
          k = k > 1 ? k - 1 : chars.length;
          if (WORD.test(chars[k] || '')) { // 带走的是英文单词的末尾时，整个单词一起带走
            let j = k;
            while (j > 0 && WORD.test(chars[j - 1])) j--;
            if (j > 0 && k - j < width) k = j;
          }
        } else if (WORD.test(ch) && WORD.test(chars[k - 1] || '')) {
          // 英文单词不拆开，整个带到下一行；比一整行还长的单词才在下一行照常截断
          let j = k;
          while (j > 0 && WORD.test(chars[j - 1])) j--;
          if (j > 0 && k - j < width) k = j;
        }
        while (k > 1 && NO_LINE_END.test(chars[k - 1])) k--; // 开引号、开括号不留在行尾
        const carry = chars.splice(k).join('');
        lines.push(chars.join('').trimEnd());
        line = carry;
        w = textWidth(carry);
        if (ch === ' ' && !line) continue; // 行首不留空格
      }
      line += ch;
      w += charWidth(ch);
    }
    lines.push(line);
  }
  return lines;
}

// 写到工作目录外、又不在写入范围里的文件，按显示用的写法（终端、网页的 ⚠ 行和网页卡片的 ⚠N 共用）
function outsideFiles(r, m) {
  const files = m?.kind === 'exec' ? (r?.changes?.outside_cwd || []).filter((f) => f.in_scope === false) : [];
  if (!files.length) return [];
  // 网页也用这段纯显示逻辑，不能依赖 Node 的 path；保留上级目录和原有路径分隔符。
  const cwd = m.cwd ?? r.cwd ?? '', windows = /^[A-Za-z]:|^\\\\/.test(cwd), sep = cwd.includes('\\') ? '\\' : '/';
  const base = cwd ? cwd.replace(/\\/g, '/').replace(/\/$/, '').split('/') : [];
  // 根（盘符，或网络共享的 //服务器/共享名）不同的不写成相对路径：../ 回不到另一个盘或另一台服务器
  const rootOf = (p) => { const s = p.replace(/\\/g, '/'), unc = /^\/\/[^/]+\/[^/]+/.exec(s); return (unc ? unc[0] : /^[A-Za-z]:/.exec(s)?.[0] ?? (s.startsWith('/') ? '/' : '')).toLowerCase(); };
  const relative = (file) => {
    if (!cwd || rootOf(file) !== rootOf(cwd)) return file;
    const parts = file.replace(/\\/g, '/').split('/');
    let i = 0;
    while (i < base.length && i < parts.length && (windows ? base[i].toLowerCase() === parts[i].toLowerCase() : base[i] === parts[i])) i++;

    return i && base.length - i <= 2 ? [...base.slice(i).map(() => '..'), ...parts.slice(i)].join(sep) : file;

}

function usageLine(result, meta) {

  const parts = [result?.usage && Object.values(result.usage).some((v) => Number(v) > 0) ? D.tokenSummary(result.usage, result.last_request ?? result.context, D.tokenCount,
    (result.usage_scope ?? (meta?.mode === 'resume' ? 'session_total' : 'this_run')) === 'session_total') : '',
  // 取消、超时、卡死的轮次只记到最后一次完成的请求，速度偏低，标出来
  result?.output_tokens_per_s != null ? D.outputSpeed(result.output_tokens_per_s, ['cancelled', 'timeout', 'stalled'].includes(result.status)) : '',
  cost.cost_usd != null && cost.cost_source !== 'unknown' ? D.costUsd(formatUsd(cost.cost_usd)) : ''].filter(Boolean);
  // 结束了却什么用量都没有（一次请求都没完成、厂商没报）：写明没报，结果的 notes 里有原因
  if (!parts.length && result?.status && result.status !== 'running' && !result.usage_unattributed && !result.not_started) return D.watchNoUsage;
  return parts.join(' · ');
}

function toolLabel(category, tool, { pattern, glob, path: where } = {}) {
  const has = (x) => x != null && x !== '';
  if (category === 'read') return has(where) ? String(where) : tool;
  return [has(pattern) ? pattern : has(glob) ? glob : tool, has(pattern) ? glob : null, where].filter(has).map(String).join(' ');
}

// 工具调用怎么显示：opencode 和 pi 的读文件、搜索（category 为 read 或 search）写成"读 …""搜索 …"，不算命令、不加 $。
function commandAction(it) {
  if (it.category === 'read' || it.category === 'search') {
    // 旧记录没有 label，从命令里去掉工具名
    const text = oneLine(it.label ?? it.command);
    const rest = it.label != null ? text : it.tool && text === it.tool ? '.' : it.tool && text.startsWith(`${it.tool} `) ? text.slice(it.tool.length + 1) : text;
    return { kind: it.category, text: it.category === 'read' ? D.actionRead(rest) : D.actionSearch(rest) };
  }
  return { kind: 'command', text: `$ ${oneLine(it.plain ? it.command : plainCommand(it.command))}` };
}
function errorAction(message) {
  const reconnect = /^Reconnecting\.\.\.\s*(\d+)\/(\d+)/.exec(message || '');
  return { mark: reconnect ? '⚠' : '✗', text: reconnect ? D.watchReconnect(reconnect[1], reconnect[2]) : oneLine(message) };
}
// 折叠起来的动作按种类计数，比如"… +12 commands, +3 reads"
const foldText = (counts) => D.watchFolded(D.list(Object.entries(counts).filter(([, n]) => n > 0).map(([kind, n]) => D.foldKinds[kind](n))));

// 思考摘要只取第一行，去掉 Markdown 的加粗
const thoughtLine = (text) => oneLine(String(text ?? '').trim().split('\n').find((l) => l.trim()) || '').replace(/\*\*/g, '');

function wrapAtDots(text, width) {
  const lines = [];
  for (const part of text.split(' · ')) {
    const last = lines.length - 1;
    if (last >= 0 && textWidth(`${lines[last]} · ${part}`) <= width) { lines[last] += ` · ${part}`; continue; }
    if (textWidth(part) <= width) { lines.push(part); continue; }
    const pieces = wrapWidth(part, Math.max(4, part.includes('/') ? width - 2 : width));
    for (let i = 0; i < pieces.length - 1; i++) {
      if (/\s*\/$/.test(pieces[i])) { pieces[i] = pieces[i].replace(/\s*\/$/, ''); pieces[i + 1] = `/ ${pieces[i + 1]}`; }
    }
    lines.push(...pieces);
  }
  return lines;
}

// 成功的任务不再列出临时的重连提示；旧记录把它记成了错误
const realErrors = (r, ok) => (r?.errors || []).filter((e) => !(ok && /^Reconnecting\.\.\.\s*\d+\/\d+/.test(String(e))));
// 结果里没有用时的旧记录，按元数据的开始和结束时间算
const durationOf = (r, m) => r?.duration_s ?? (timeOf(m?.ended_at) - timeOf(m?.started_at)) / 1000;

const reviewFinding = (f) => ({ ...f, location: f.location ?? f.where, issue: f.issue ?? f.title });
const reviewCounts = (findings = []) => ({ total: findings.length,
  ...Object.fromEntries(['high', 'medium', 'low'].map((s) => [s, findings.filter((f) => f.severity === s).length])) });
function reviewConclusion(report) {
  if (!D.watchReview[report?.verdict]) return null;
  const counts = report.findings_counts ?? reviewCounts(report.findings);
  const parts = ['high', 'medium', 'low'].map((severity) => {
    const n = counts[severity];
    return n ? `${D.severityNames[severity]} ${n}` : null;
  }).filter(Boolean).join(' · ');
  return D.watchReview[report.verdict](counts.total, parts);
}

function finalLines(run, r, ok, inner, C = unpainted) {
  const report = r?.report;
  const out = [];
  const wrap = (text) => wrapWidth(String(text).trim(), inner);
  // 带记号的一段：记号上色，续行缩进两格，按缩进后的宽度折行
  const marked = (mark, color, text) => wrapWidth(oneLine(text), Math.max(4, inner - 2)).map((l, i) => (i ? `  ${l}` : `${color(mark)} ${l}`));
  const conclusion = reviewConclusion(report);
  if (conclusion) {
    out.push(...wrap(conclusion));
    const findings = (report.findings || []).slice(0, 30);
    for (const f of findings) out.push(...wrap(D.watchFinding(f, D.severityNames[f.severity])));
    const omitted = (report.findings_counts?.total ?? report.findings?.length ?? 0) - findings.length;
    if (omitted > 0) out.push(...wrap(D.watchMoreFindings(omitted)));
  } else if (report?.position || report?.summary) out.push(...wrap(report.position || report.summary));
  else if (!report && moduleOf(run.meta) === 'review' && r?.status === 'done' && resultOutcome(r, run.meta).valid) out.push(...wrap(r.last_message));
  const asked = r?.questions?.filter(needsDecision) ?? report?.decision_requests ?? [];
  for (const q of asked) out.push(...marked('?', C.yellow, q.question));
  // 看板的消息超过大小上限时问题和报错可能被裁过：按原来的条数写还有几条（终端读的是完整结果，不会出现）
  const moreAsked = (r?.questions ? r.questions_total : report?.decision_requests_total) - (r?.questions ?? report?.decision_requests ?? []).length;
  if (moreAsked > 0) out.push(...marked('?', C.yellow, D.watchMoreQuestions(moreAsked)));
  const changed = run.meta.kind !== 'exec' && changedFor(r, run.meta); // 讨论和审查只有越界写了文件才有
  if (changed) out.push(...marked('⚠', C.yellow, changed));
  const outside = outsideCwdText(r, run.meta);
  if (outside) out.push(...marked('⚠', C.yellow, outside));
  if (r?.stale === true) out.push(...marked('⚠', C.yellow, D.watchStale));
  const [mark, color] = r?.status === 'needs_input' ? ['?', C.yellow] : ['✗', C.red];
  const secondary = ['timeout', 'cancelled'].includes(r?.status);
  // 次要的报错整行暗色：记号不单独上色，否则记号后的颜色复位会让后面的文字变回正常亮度
  realErrors(r, ok).forEach((e, i) => out.push(...(secondary && i > 0 ? marked('·', plain, e).map((l) => C.dim(l)) : marked(mark, color, e))));
  const moreErrors = (r?.errors_total ?? 0) - (r?.errors?.length ?? 0);
  if (moreErrors > 0) out.push(...marked(mark, color, D.watchMoreErrors(moreErrors)));
  return out;
}

// 运行中的正文：最近说的一段话（◆）、比它新的思考摘要，下面是最近的动作，放不下的折叠成一行计数
function liveLines(state, rows, inner, C = unpainted) {
  if (rows <= 0) return [];
  const speech = state.speech ? wrapWidth(state.speech.text, inner - 2).filter((l) => l.trim()) : [];
  const thought = state.thought && (!state.speech || state.thought.seq > state.speech.seq) ? state.thought : null;
  const acting = state.recent.length ? 1 : 0;
  const thinking = thought && Math.min(2, speech.length) + 1 + acting <= rows ? 1 : 0;
  const speechRows = Math.min(speech.length, rows >= 8 ? 3 : 2, Math.max(speech.length ? 1 : 0, rows - thinking - acting));
  const top = speech.slice(0, speechRows).map((l, i) => {
    const last = i === speechRows - 1 && speech.length > speechRows;
    const joint = /[\w,.;:)]$/.test(l) || /^\w/.test(speech[i + 1] || '') ? ' ' : ''; // 在英文单词处折开的，接回去时补上空格
    return `${i ? '  ' : '◆ '}${last ? fitWidth(`${l}${joint}${speech[i + 1]}`, inner - 2) : l}`;
  });
  if (thinking) top.push(C.dim(fitWidth(D.watchThinking(thought.text), inner)));
  const room = rows - top.length;
  if (room <= 0 || !state.recent.length) return top;
  // 一条动作：记号、暗色的文字，行尾是失败或没搜到的标记
  const line = (a, width = inner) => {
    const tag = a.tag ? `  ${a.tag}` : '';
    const head = a.mark ? `${a.mark[1](a.mark[0])} ` : '';
    // 放不下时有更短的说法就用短的（比如拍快照的提示），免得在单词中间截断
    const room = Math.max(4, width - visibleWidth(head) - visibleWidth(tag));
    const text = fitWidth(a.alt && textWidth(a.text) > room ? a.alt : a.text, room);
    return head + (a.color || C.dim)(text) + (tag ? ' '.repeat(Math.max(0, width - visibleWidth(head) - textWidth(text) - visibleWidth(tag))) + tag : '');
  };
  const total = Object.values(state.kinds).reduce((n, k) => n + k, 0);
  if (total <= room) return [...top, ...state.recent.slice(-room).map((a) => line(a))];
  const shown = state.recent.slice(state.recent.length - Math.max(1, room - 1));
  const hidden = { ...state.kinds };
  for (const a of shown) hidden[a.kind]--;
  // 只剩一行时，折叠计数和最新一条写在同一行
  const fold = foldText(hidden);
  if (room === 1) return [...top, inner - textWidth(fold) - 3 >= 8 ? `${C.dim(`${fold} · `)}${line(shown[0], inner - textWidth(fold) - 3)}` : C.dim(fitWidth(fold, inner))];
  return [...top, C.dim(fitWidth(fold, inner)), ...shown.map((a) => line(a))];
}

const withoutRole = (title, role) => {
  const rest = role ? title.replace(new RegExp(`\\s*[［\\[（(【]\\s*${role.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*[］\\]）)】]\\s*`), '').trim() : title;
  return /^(多角色模式|role mode)$/i.test(rest) ? '' : rest;
};
function seatLine(m, { title = false, width = Infinity } = {}, C = unpainted) {
  const parts = [[m.role, C.bold], [title && m.title, C.bold], [title && m.level, plain], [moduleOf(m) === 'image' && m.cell, plain], [m.author && 'author', C.dim]]
    .filter(([text]) => text).map(([text, style]) => ({ text: oneLine(String(text)), style }));
  if (!parts.length) return null;
  const total = () => textWidth(parts.map((p) => p.text).join(' · '));
  for (const p of [...parts].filter((x) => x.style === C.bold).sort((a, b) => textWidth(b.text) - textWidth(a.text))) {
    if (total() <= width) break;
    p.text = fitWidth(p.text, Math.max(4, textWidth(p.text) - (total() - width)));
  }
  if (total() > width) return C.dim(fitWidth(parts.map((p) => p.text).join(' · '), Math.max(1, width)));
  return parts.map((p) => p.style(p.text)).join(C.dim(' · '));
}

function groupTask(all, plans = [], queue = [], list = D.list) {
  const seats = all.filter((run) => run.meta.participant !== 'host').map((run) => run.meta);
  const metas = seats.length ? seats : all.length ? all.map((run) => run.meta) : queue.map((q) => {
    const plan = plans.find((p) => (p.plan_id ?? p.plan) === q.plan);
    return { ...q, module: plan?.module ?? 'run', level: plan?.level ?? plan?.cell };
  });
  const module = moduleOf(metas[0]);
  const roles = all.some((run) => run.meta.role && !GAP_ROLE.test(run.meta.role));
  const mode = module === 'run' ? (metas.length > 1 ? D.groupModes.split : null)
    : module === 'discuss' || module === 'review' ? D.groupModes[roles ? 'roles' : 'panel'] : null;
  const same = (key) => (new Set(metas.map((m) => m[key] ?? null)).size === 1 ? metas[0]?.[key] : null);
  const titles = [...new Set(metas.map((m) => withoutRole(oneLine(m.title || ''), m.role)).filter(Boolean))];
  const round = same('round');
  const sceneSources = plans.some((p) => p.scene) ? plans : all.map((run) => run.meta);
  const scenes = [...new Set(sceneSources.map((p) => p.scene).filter(Boolean))];
  return { split: module === 'run' && titles.length > 1, text: taskLine({ ...metas[0], level: same('level'), cell: same('cell') }, { mode, title: titles.join(' / '), round, scene: list(scenes) }),
    sceneWhy: [...new Set(sceneSources.filter((p) => p.scene && p.scene_why).map((p) => `${p.scene}: ${p.scene_why}`))].join('\n'),
    // 简短的组标题（网页用量表的组行）：只写类型和标题
    short: D.dots([moduleOf(metas[0]), titles.length && oneLine(titles.join(' / '))]) };
}

// 只算查看画面的计划提示；准入和登记仍由 plan.mjs/records.mjs 负责。
function planNotes(plans, all) {
  return plans.map((plan) => {
    const id = plan.plan_id ?? plan.plan;
    const runs = all.filter((r) => r.meta.plan === id).sort((a, b) => a.id.localeCompare(b.id));
    const seats = plan.seats.map((s) => {
      const run = runs.filter((r) => r.meta.seat === s.seat).at(-1), o = run?.outcome;
      return { ...s, required: plan.required ? plan.required.includes(s.agent) : s.required,
        status: o?.status ?? 'not_started', ok: !o || o.running ? null : o.ok,
        stale: plan.module === 'review' && o?.result?.stale === true, label: o ? outcomeStyle(o).word : D.statusName('not_started') };
    });
    const needed = ['run', 'image'].includes(plan.module) ? seats : seats.filter((s) => s.required);
    const ended = (s) => !['not_started', 'running'].includes(s.status);
    let state = needed.length ? needed.every((s) => s.ok === true) ? 'complete'
      : needed.some((s) => ended(s) && !s.ok) ? 'incomplete' : 'pending'
      : seats.every(ended) ? seats.some((s) => s.ok) ? 'complete' : 'incomplete' : 'pending';
    const missing = needed.filter((s) => s.ok !== true), stopped = missing.filter(ended), waiting = missing.filter((s) => s.status === 'not_started');
    const labels = (list, detail = false) => D.list(list.map((s) => D.watchPlanSeat(s.agent, s.seat, detail ? s.label : null)));
    const host = plan.host && !runs.some((r) => r.meta.participant === 'host');
    if (host && state === 'complete') state = 'pending';
    const detail = state === 'incomplete' && stopped.length ? D.watchPlanMissing(labels(stopped, true))
      : state === 'pending' && waiting.length ? D.watchPlanNotStarted(labels(waiting)) : '';
    const stale = seats.filter((s) => s.stale), gap = seats.filter((s) => GAP_ROLE.test(s.role?.trim() || '') && s.ok !== true);
    const details = [host && D.hostNotSubmitted, detail, stale.length && D.watchPlanStale(labels(stale)), gap.length && D.watchPlanGap(labels(gap, true))].filter(Boolean).join('; ');
    return { id, state, details, line: `${state === 'incomplete' ? '✗' : '⚠'} ${D.dots([D.planStates[state], details])}` };
  });
}

// 续接和同席重启都由最新轮次代替
function current(runs, all = runs.all ?? runs) {
  const children = new Map(), latest = new Map(), seen = new Set();
  const seatOf = (run) => (run.meta.plan && (run.meta.seat != null || run.meta.participant === 'host') ? `${run.meta.plan}:${run.meta.participant === 'host' ? 0 : run.meta.seat}` : null);
  for (const run of all) {
    const parent = run.meta.parent;
    if (parent && (!children.has(parent) || run.id > children.get(parent).id)) children.set(parent, run);
    const seat = seatOf(run);
    if (seat && (!latest.has(seat) || run.id > latest.get(seat).id)) latest.set(seat, run);
  }
  return runs.flatMap((run) => {
    if (seatOf(run)) run = latest.get(seatOf(run));
    else while (children.has(run.id)) run = children.get(run.id);
    if (seen.has(run.id)) return [];
    seen.add(run.id);
    return [run];
  });
}

// 按计划创建顺序预留全部声明席位，重建和持续观看才能得到相同号码。
function seatNumbers(runs, all = runs, previous, plans = []) {
  const seats = new Map(), numbers = new Map(), used = new Set();
  const byId = new Map(all.map((r) => [r.id, r])), declared = new Map();
  for (const p of plans) declared.set(p.plan_id ?? p.plan, { at: timeOf(p.created_at ?? p.original_ts ?? p.ts), seats: new Set([...(p.host ? [0] : []), ...(p.seats || []).map((s) => s.seat)]) });
  for (const r of all) if (r.meta.plan) {
    const m = r.meta;
    if (!declared.has(m.plan)) declared.set(m.plan, { at: timeOf(m.started_at), seats: new Set() });
    const p = declared.get(m.plan);
    if (m.participant === 'host') p.seats.add(0);
    else if (m.seat != null) p.seats.add(m.seat);
    if (!plans.some((p) => (p.plan_id ?? p.plan) === m.plan)) p.at = Math.min(p.at, timeOf(m.started_at));
  }
  const reserved = new Set([...declared.values()].flatMap((p) => [...p.seats]));
  const take = (key, preferred) => {
    let n = preferred;
    if (n == null || used.has(n)) for (n = 1; used.has(n) || reserved.has(n); n++);
    seats.set(key, n); used.add(n);
  };
  for (const [id, p] of [...declared].sort(([a, x], [b, y]) => (x.at - y.at) || a.localeCompare(b)))
    for (const n of [...p.seats].sort((a, b) => a - b)) take(`${id}:${n}`, n);
  const first = (run) => {
    const seen = new Set();
    while (byId.has(run.meta.parent) && !seen.has(run.id)) { seen.add(run.id); run = byId.get(run.meta.parent); }
    return run;
  };
  const ordered = [...new Map([...all, ...runs].map((r) => [r.id, r])).values()].sort((a, b) => timeOf(first(a).meta.started_at) - timeOf(first(b).meta.started_at) || first(a).id.localeCompare(first(b).id));
  for (const run of ordered.filter((r) => r.meta.participant === 'host' && !r.meta.plan)) take(run.id, 0);
  // 无计划的旧续接链曾缺祖先时，恢复祖先不能把已经可用的数字快捷键换掉。
  for (const run of ordered) if (!run.meta.plan && previous?.runs.has(run.id)) {
    const key = first(run).id, n = previous.runs.get(run.id);
    if (!seats.has(key) && !used.has(n) && !reserved.has(n)) take(key, n);
  }
  for (const run of ordered) {
    const m = run.meta, root = first(run), seat = m.participant === 'host' ? 0 : m.seat;
    const key = m.plan && seat != null ? `${m.plan}:${seat}` : root.id;
    // 祖先暂时读不到时才沿用已见号码；完整记录的重建不依赖观看历史。
    if (!seats.has(key)) take(key, root.meta.parent && !byId.has(root.meta.parent) ? previous?.runs.get(run.id) ?? previous?.runs.get(root.meta.parent) : null);
    numbers.set(run.id, seats.get(key));
  }
  return { seats, runs: numbers };
}

function roundOf(meta, byId) {
  if (meta.round != null || !meta.parent) return meta.round ?? 1;
  let n = 1;
  for (let id = meta.parent; id && n < 100; n++) id = (byId.get(id)?.meta ?? byId.get(id))?.parent;
  return n;
}

function resultOutcome(r, meta = r) {
  const status = r?.status ?? meta?.status;
  const blocked = status === 'needs_input' || status === 'done' && (!!r?.needs_decision || r?.report?.status === 'blocked');
  const valid = r?.valid ?? (moduleOf(meta) === 'review'
    ? r?.report ? r.report.verdict !== 'incomplete' : !!r?.last_message?.trim() && (!!r.native_review || r.review_target === undefined)
    : !!r?.report);
  const partial = !blocked && status === 'done' && r?.report?.status === 'partial';
  return { running: status === 'running', status, result: r, blocked, valid, partial,
    ok: !blocked && valid && status === 'done' && (!r?.report?.status || r.report.status === 'completed') };
}

const hhmm = (t) => (t != null ? new Date(t).toTimeString().slice(0, 5) : '     ');
const timeOf = (t) => typeof t === 'number' ? t : Date.parse(t);
function liveStatus(meta, api, now, C = unpainted) {
  const queued = api.queued, word = api.req != null || queued ? D.apiPhases[queued ? 'queued' : api.answering ? 'answering' : 'thinking'] : D.statusName('running');
  return { mark: queued ? '⋯' : '●', color: queued ? C.yellow : C.cyan, word,
    right: [word, clock(now - timeOf(api.req ?? meta.started_at))] };
}

function seatState(meta, result, api, now, C = unpainted, outcome = resultOutcome(result, meta)) {
  if (meta.participant === 'host') return { style: { mark: '✔', color: C.green, word: D.statusName('submitted') },
    right: [D.statusName('submitted'), hhmm(meta.submitted_at)], kind: 'ok' };
  if (outcome.running) {
    const style = liveStatus(meta, api, now, C);
    return { style, right: style.right, kind: api.queued ? 'queued' : 'running', running: true };
  }
  const style = outcomeStyle(outcome, C), sec = durationOf(result, meta);
  return { style, right: [style.word, Number.isFinite(sec) ? clock(sec * 1000) : null],
    kind: outcome.resumed ? 'resumed' : outcome.ok ? 'ok' : outcome.blocked ? 'blocked' : outcome.partial ? 'partial' : 'failed' };
}
// 各状态的色调，和终端的上色一致（运行中、完成、部分完成/交回问题/排队、失败、已续接和没开始）；网页按色调取同一组颜色
const TONES = { running: 'run', queued: 'warn', ok: 'ok', partial: 'warn', blocked: 'warn', resumed: 'dim', not_started: 'dim', failed: 'bad' };
const toneOf = (kind) => TONES[kind] || 'dim';
const COUNT_MARKS = { running: '●', queued: '⋯', ok: '✔', partial: '◐', blocked: '?', resumed: '↪', failed: '✗' };
const countParts = (states) => Object.entries(COUNT_MARKS).flatMap(([kind, mark]) => {
  const n = states.filter((s) => s.kind === kind).length;
  return n ? [{ kind, text: `${mark}${n}` }] : [];
});
const countsText = (states) => countParts(states).map((p) => p.text).join(' ');

const seatUsage = (meta, result, usage = usageLine(result, meta)) => meta.participant === 'host' ? D.watchHostNoUsage
  : D.dots([meta.kind === 'exec' && changedFor(result, meta), usage]);
const queuedLine = (q, now) => `⋯ queued #${q.position} ${oneLine(q.title || '-')} · ${q.agent || q.model || '?'} · waiting ${Math.max(0, Math.round((now - timeOf(q.queued_at)) / 60000))} min`;
const queuedStarted = (q, runs) => runs.some((r) => {
  const m = r.meta ?? r;
  return q.plan && m.plan === q.plan && m.seat === q.seat && timeOf(m.original_started_at ?? m.started_at) >= timeOf(q.queued_at);

const seenNow = () => (B.clock.mode === 'live' && !(typeof document !== 'undefined' && document.hidden) ? Date.now() : null);

function onRun(r) {
  // 记下页面什么时候知道任务结束了；连上时就已经结束的不记，结束后再发来的沿用第一次的
  const prev = B.runs.get(r.id);
  if (r.ended_at != null) {
    const seen = prev?.ended_seen ?? (prev ? (prev.ended_at == null ? seenNow() : null) : B.synced ? seenNow() : null);
    if (seen != null) r.ended_seen = seen;
  }
  B.runs.set(r.id, r);
  const lane = laneFor(r.lane || r.id);
  const at = lane.runs.findIndex((x) => x.id === r.id);
  if (at >= 0) lane.runs[at] = r; else lane.runs.push(r);
  lane.runs.sort((a, b) => a.started_at - b.started_at);
  B.version++;
  wake();
}

// 展示缓存会截断；另存不含正文的统计边界，保证累计输出和生成时长覆盖同一段。
const rateFields = ({ run, ts, k, u, n, tot, end, usage_from, usage_to }) => ({ run, ts, k, u, n, tot, end, usage_from, usage_to });
const laneOf = (ev) => laneFor(ev.lane || B.runs.get(ev.run)?.lane || ev.run);

// 一条事件除了进车道以外的记账：序号、计划和评判、用户消息的时刻、车道最后一条
function noteEvent(ev, lane) {
  ev.id = B.total++;
  // 同一份计划的事件可能再发（内容变了、重连）：按计划 id 只留最新一份
  if (ev.k === 'fplan') B.life = B.life.filter((x) => !(x.k === 'fplan' && x.plan === ev.plan));
  if (ev.k === 'fplan' || ev.k === 'verdict') insertByTs(B.life, ev, Infinity);
  if (ev.k === 'prompt' && Number.isFinite(ev.ts) && !B.prompts.includes(ev.ts)) { B.prompts.push(ev.ts); B.prompts.sort((a, b) => a - b); }
  if (!lane.last || ev.ts >= lane.last.ts) lane.last = ev;
}

// 实时的一条事件
function onEv(ev, stats = true) {
  // 直播里逐条推来的事件记下到达页面的时刻（产出框的交接用）
  const seen = seenNow();
  if (seen != null) ev.seen = seen;
  const lane = laneOf(ev);
  noteEvent(ev, lane);
  insertByTs(lane.events, ev, LANE_EVENTS_MAX);
  if (B.clock.mode === 'live' && stats !== false) insertByTs(lane.rate_events, rateFields(ev), RATE_EVENTS_MAX);
  lane.ver = (lane.ver || 0) + 1;
  B.version++;
  wake();
}

// 一批历史事件（一个任务的回填、快照）：结果和逐条 onEv 完全一样，但每条车道只归并、截断一次，版本号每批只加一次。
// 逐条插入时，乱序到达的旧事件要从尾部一路往前找位置，长对话一次回填几千条就把飞入动画卡住
function onEvents(events, stats = true) {
  if (!events.length) return;
  const byLane = new Map();
  for (const ev of events) {
    const lane = laneOf(ev);
    noteEvent(ev, lane);
    if (byLane.has(lane)) byLane.get(lane).push(ev); else byLane.set(lane, [ev]);
  }
  const rates = B.clock.mode === 'live' && stats !== false;
  for (const [lane, list] of byLane) {
    lane.events = mergeByTs(lane.events, list, LANE_EVENTS_MAX);
    if (rates) lane.rate_events = mergeByTs(lane.rate_events, list.map(rateFields), RATE_EVENTS_MAX);
    lane.ver = (lane.ver || 0) + 1;
  }
  B.version++;
  wake();
}

// 服务端从头重读了某个任务的记录（文件被替换、截短后重写）：先丢掉这个任务以前的事件，再收新的
function onBacklog(b) {
  if (b.reset) {
    const keep = (ev) => ev.run !== b.run;
    for (const lane of B.lanes) if (lane.events.some((ev) => !keep(ev)) || lane.rate_events.some((ev) => !keep(ev))) {
      lane.events = lane.events.filter(keep); lane.ver = (lane.ver || 0) + 1;
      lane.rate_events = lane.rate_events.filter(keep);
      lane.last = lane.events.reduce((last, ev) => (!last || ev.ts >= last.ts ? ev : last), null);
    }
    B.life = B.life.filter(keep);
    if (b.run === 'cc') B.prompts = [];
    B.version++;
  }
  onEvents(b.events, !b.rate_events);
  if (b.rate_events) replaceRateHistory(b.run, b.rate_events);
}

function replaceRateHistory(run, events) {
  const lane = laneFor(B.runs.get(run)?.lane || run);
  // Claude Code 车道一次就有上万条：一次合并，不逐条插入
  lane.rate_events = mergeByTs(lane.rate_events.filter((ev) => ev.run !== run), events, RATE_EVENTS_MAX);
  lane.ver = (lane.ver || 0) + 1; B.version++;
  wake();
}

// 把一批事件并进按时间排好的数组，返回新数组：这批先按时间稳定排序，时间相同时原有的在前、这批按到达先后在后，
// 超出上限丢掉最早的。和逐条 insertByTs 的结果一样
function mergeByTs(list, batch, max) {
  const incoming = batch.every((ev, i) => !i || batch[i - 1].ts <= ev.ts) ? batch : [...batch].sort((a, b) => a.ts - b.ts);
  let merged;
  if (!incoming.length || !list.length || incoming[0].ts >= list.at(-1).ts) merged = list.concat(incoming);
  else {
    merged = [];
    for (let i = 0, j = 0; i < list.length || j < incoming.length;) {
      merged.push(j >= incoming.length || i < list.length && list[i].ts <= incoming[j].ts ? list[i++] : incoming[j++]);
    }
  }
  return merged.length > max ? merged.slice(-max) : merged;
}

// 直播里派发事件先到、目标任务后出现时，服务端补发一次 ev_link：给原来那条事件补上 target
function onEvLink(l) {
  const lane = B.laneById.get(B.runs.get(l.run)?.lane || l.run), ev = lane?.events.find((e) => e.ts === l.ts && e.k === l.k);
  if (!ev) return;
  ev.target = l.target;
  B.version++;
  wake();
}

// 事件基本按时间到达，偶尔有先后颠倒（多个任务的回填），从尾部往前找插入点
function insertByTs(list, ev, max) {
  let i = list.length;
  while (i > 0 && list[i - 1].ts > ev.ts) i--;
  list.splice(i, 0, ev);
  if (list.length > max) list.splice(0, list.length - max);
}

function loadSnapshot(s) {
  onHello(s.hello);
  if (B.params.t == null && s.hello.replay) B.clock.frozenAt = s.hello.replay.end; // 内嵌快照没给 t 时停在末尾
  for (const r of s.runs) onRun(r);
  onEvents(s.events, !s.rate_events);
  if (s.rate_events) {
    const byRun = new Map(s.runs.map((r) => [r.id, []]));
    for (const ev of s.rate_events) byRun.get(ev.run)?.push(ev);
    for (const [run, events] of byRun) replaceRateHistory(run, events);
  }
  B.connected = true;
}

function scopeQuery() {
  const p = new URLSearchParams();
  for (const k of ['group', 'run', 'replay', 'session', 'from', 'speed', 'maxgap']) if (B.params[k]) p.set(k, B.params[k]);
  return p;
}

const STREAM_STUCK_MS = 8000, STREAM_ASK_MS = 2000;
let streamsReleased = false;
// 同主机连接被别的标签页占满时不一定触发 error，初次连接和断线重连都要计时。
function watchStream(state, es) {
  const wait = () => {
    // 2 秒还没连上：多半是同一浏览器的连接被别的看板标签页占满了，请后台的那些让出来（09-main.js）
    if (es.readyState === 0 && state.askTimer == null) state.askTimer = setTimeout(() => { state.askTimer = null; if (es.readyState === 0 && typeof askForStream === 'function') askForStream(); }, STREAM_ASK_MS);
    if (es.readyState !== 0 || state.stuckTimer != null || state.stuckNoticed) return;
    state.stuckTimer = setTimeout(() => {
      state.stuckTimer = null;
      if (es.readyState !== 0) return;
      state.stuckNoticed = true; showNotice(TEXT.streamStuck);
      // 再问一下服务：直接被拒（网络错误）说明服务已经退出，换成一直留着的提示；超时多半是连接被别的标签页占满，原提示不变
      if (typeof AbortSignal === 'function' && typeof AbortSignal.timeout === 'function') {
        fetch('health', { signal: AbortSignal.timeout(3000) }).catch((e) => { if (e?.name === 'TypeError' && es.readyState === 0) showNotice(TEXT.boardGone, true); });
      }
    }, STREAM_STUCK_MS);
  };
  es.addEventListener('open', () => { clearTimeout(state.stuckTimer); clearTimeout(state.askTimer); state.stuckTimer = state.askTimer = null; state.stuckNoticed = false; });
  es.addEventListener('error', wait);
  wait();
}

function connect() {
  if (window.__BOARD_FIXTURE__) return loadSnapshot(window.__BOARD_FIXTURE__);
  const q = scopeQuery();
  if (B.params.t != null) {
    // 截图用：一次取完，不开长连接（无头浏览器的虚拟时间会被长连接卡住）
    q.set('t', String(B.params.t));
    fetch(`snapshot?${q}`).then((r) => r.json()).then(loadSnapshot).catch((e) => { B.error = String(e); });
    return;
  }
  if (B.es || streamsReleased) return;
  const es = openStream(q);
  B.es = es;
  watchStream(B, es);
  const on = (name, fn) => es.addEventListener(name, (e) => fn(JSON.parse(e.data)));
  on('hello', onHello);
  on('run', onRun);
  on('ev', onEv);
  on('ev_link', onEvLink);
  on('backlog', onBacklog);
  on('done', () => { B.done = true; B.version++; });
  on('synced', () => { B.synced = true; });
  es.onopen = () => { B.connected = true; B.error = null; };
  es.onerror = () => { B.connected = false; B.error = es.readyState === 2 ? 'closed' : 'reconnecting'; };
}

// 换看的对话之前关掉原来的数据流（宇宙层同一时刻只挂一个完整看板）
function disconnect() {
  if (B.es) { B.es.close(); B.es = null; }
  // 两个计时器都清掉：留着的"请别的标签页让出"会在重连后迟到地触发
  clearTimeout(B.stuckTimer); clearTimeout(B.askTimer); B.stuckTimer = B.askTimer = null; B.stuckNoticed = false;
  B.connected = false; B.error = null;
}

// 字符串 → 32 位种子；同一车道每次画出来一样
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- 01-universe.js
'use strict';
// 宇宙层的数据：本机所有对话的摘要、项目、协作方名额（PROTOCOL-v3 §5–§7）。
// 只存数据和"什么时候变的"，画面每帧按 uNow() 从这里取；?demo=universe 时由 02-uni-demo.js 喂数据，不连服务。

const U = {
  on: true, // 只有一个总前端：页面总带宇宙层，单个对话的看板是飞进去以后的样子
  demo: Q.get('demo') === 'universe',
  page: { ...B.params },  // 打开页面时的参数（速度、回放、定格时刻）；飞进对话时 B.params 会被换掉，这里留一份
  hello: null,
  projects: new Map(),    // key → project
  sessions: new Map(),    // id → summary
  agents: [],
  marks: new Map(),       // id → { born, state, stateAt, prev, runs: Map(run id → { born, ended }) }，给动效用的变化时刻
  version: 0,
  done: false,
  error: null,
  clock: { mode: 'live', start: 0, end: Infinity, speed: 1, perf0: 0, frozenAt: null },
};

// 宇宙层的"现在"（记录时间，毫秒）。和 now() 同一套规则，但用自己的时钟：飞进某个对话前，看板的时钟还没开始
function uNow() {
  const c = U.clock;
  if (c.frozenAt != null) return c.frozenAt;
  // 回放放完就停在末尾（和看板的 now() 一样），飞进去时两边的时钟才对得上
  if (c.mode === 'replay') return Math.min(c.end, c.start + (performance.now() - c.perf0) * c.speed);
  return Date.now();
}

function uHello(h) {
  U.hello = h;
  const c = U.clock;
  c.mode = h.mode;
  if (h.replay) Object.assign(c, { start: h.replay.start, end: h.replay.end ?? Infinity, speed: h.replay.speed || 1 });
  c.perf0 = performance.now();
  if (B.params.t != null) c.frozenAt = h.replay ? h.replay.start + B.params.t * 1000 * (h.replay.speed || 1) : h.now;
}

function uUniverse(u) {
  U.projects.clear(); U.sessions.clear(); U.marks.clear();
  for (const p of u.projects) U.projects.set(p.key, p);
  for (const s of u.sessions) uSession(s, true);
  U.agents = u.agents;
  U.loadedAt ??= performance.now(); // 第一份完整星图到了：之后还找不到要飞进去的对话，就提示它不在图上
  U.version++;
}

// 记下状态和运行的变化时刻；first 为真时是整份重来（刚连上），不算"新出现"，免得一打开满屏都在播出生动画
function uSession(s, first = false) {
  const t = uNow();
  let m = U.marks.get(s.id);
  if (!m) { m = { born: first ? -Infinity : t, state: s.state, stateAt: first ? -Infinity : t, prev: null, runs: new Map(), alert: s.alert?.run ?? null, alertAt: -Infinity }; U.marks.set(s.id, m); }
  if (m.state !== s.state) { m.prev = m.state; m.state = s.state; m.stateAt = t; }
  if ((s.alert?.run ?? null) !== m.alert) { m.alert = s.alert?.run ?? null; if (m.alert) m.alertAt = t; }
  const listed = new Set();
  for (const r of s.runs) {
    listed.add(r.id);
    let rm = m.runs.get(r.id);
    if (!rm) { rm = { born: first ? Math.min(t, r.started_at) : t, ended: null }; m.runs.set(r.id, rm); }
    if (r.ended_at != null && rm.ended == null) rm.ended = first ? r.ended_at : Math.max(t, r.ended_at);
  }
  for (const id of [...m.runs.keys()]) if (!listed.has(id)) m.runs.delete(id);
  U.sessions.set(s.id, s);
  if (!first) U.version++;
}

function uGone({ id }) { U.sessions.delete(id); U.marks.delete(id); U.version++; }
function uProject(p) { U.projects.set(p.key, p); U.version++; }
function uAgents({ agents }) { U.agents = agents; U.version++; }

function connectUniverse() {
  if (U.demo) return playDemo();
  const q = new URLSearchParams({ level: 'all' });
  // 给了回放范围（不管是 all 还是某个组、任务、对话）都回放整个宇宙，看板飞进去以后接着同一个时钟
  if (B.params.replay != null) q.set('replay', 'all');
  for (const k of ['speed', 'maxgap']) if (B.params[k] != null) q.set(k, B.params[k]);
  if (B.params.t != null) {
    q.set('t', String(B.params.t));
    fetch(`sessions?${q}`).then((r) => r.json()).then((u) => { uHello({ v: 3, level: 'all', mode: 'live', now: u.now, replay: null }); U.clock.frozenAt = u.now; uUniverse(u); })
      .catch((e) => { U.error = String(e); });
    return;
  }
  if (U.es || streamsReleased) return;
  const es = openStream(q);
  U.es = es;
  watchStream(U, es);
  const on = (name, fn) => es.addEventListener(name, (e) => fn(JSON.parse(e.data)));
  on('hello', uHello);
  on('universe', uUniverse);
  on('session', (s) => uSession(s));
  on('session_gone', uGone);
  on('project', uProject);
  on('agents', uAgents);
  on('done', () => { U.done = true; U.version++; });
  es.onopen = () => { U.error = null; U.lostAt = null; U.lostNoticed = false; };
  // 记下从什么时候开始连不上：服务退出了、或者被新服务接替（地址和口令都变了）时，浏览器会一直重连旧地址
  es.onerror = () => { U.error = es.readyState === 2 ? 'closed' : 'reconnecting'; U.lostAt ??= performance.now(); };
}

function disconnectUniverse() {
  if (U.es) { U.es.close(); U.es = null; }
  clearTimeout(U.stuckTimer); clearTimeout(U.askTimer); U.stuckTimer = U.askTimer = null; U.stuckNoticed = false;
  // 主动让出连接不算服务失联，飞进看板和后台暂停时都不能触发 serverLost。
  U.error = null; U.lostAt = null; U.lostNoticed = false;
}

// 对话按项目归组，组内按最后活动时间排，给布局和列表用
function sessionsByProject() {
  const out = new Map();
  for (const s of U.sessions.values()) {
    if (!out.has(s.project)) out.set(s.project, []);
    out.get(s.project).push(s);
  }
  for (const list of out.values()) list.sort((a, b) => b.last_at - a.last_at);
  return out;
}

'use strict';
// 模型名和接入方式 → 品牌图标和主题色。网页把 Codex 和 ChatGPT 分开显示。

const AVATAR_RULES = [
  ['claude', /claude|sonnet|opus|haiku|anthropic/],
  ['chatgpt', /gpt|codex|openai|(?:^|[^a-z0-9])o\d/],
  ['gemini', /gemini|gemma/],
  ['deepseek', /deepseek/],
  ['mimo', /mimo|xiaomi/],
  ['glm', /glm|zhipu/],
  ['kimi', /kimi|moonshot/],
  ['qwen', /qwen|qwq|qvq/],
  ['minimax', /minimax|abab/],
  ['grok', /grok|x-?ai/],
];
const LOOKS = {
  claude: { name: 'Claude', color: [232, 118, 64] },
  codex: { name: 'Codex', color: [236, 236, 236] },
  chatgpt: { name: 'ChatGPT', color: [236, 236, 236] },
  gemini: { name: 'Gemini', color: [96, 156, 250] },
  deepseek: { name: 'DeepSeek', color: [92, 120, 254] },
  mimo: { name: 'MiMo', color: [245, 140, 50] },
  glm: { name: 'GLM', color: [128, 104, 236] },
  kimi: { name: 'Kimi', color: [110, 170, 250] },
  qwen: { name: 'Qwen', color: [140, 116, 246] },
  minimax: { name: 'MiniMax', color: [240, 84, 84] },
  grok: { name: 'Grok', color: [236, 208, 140] },
  unknown: { name: '???', color: [150, 150, 150] },
};

function avatarFor(modelName, agentType) {
  if (agentType === 'host') return 'claude';
  const name = String(modelName || '').toLowerCase();
  for (const part of [name.split('/').pop(), name]) {
    let best = null;
    for (const [key, re] of AVATAR_RULES) {
      const m = re.exec(part);
      if (m && (!best || m.index < best.at)) best = { key, at: m.index };
    }
    if (best) return best.key === 'chatgpt' && (agentType === 'codex cli' || part.includes('codex')) ? 'codex' : best.key;
  }
  return agentType === 'codex cli' ? 'codex' : 'unknown';
}

const look = (key) => LOOKS[key] || LOOKS.unknown;
const rgba = (key, a = 1) => { const [r, g, b] = look(key).color; return `rgba(${r},${g},${b},${a})`; };
const avatarSrc = (key) => (window.__AVATARS__ || {})[key] || (window.__AVATARS__ || {}).unknown || '';

// ?copies=N：把整套场景复制 N 份（项目名加后缀、时间错开），压测几十个对话时的帧率
const DEMO_COPIES = Math.max(1, Math.min(10, Number(Q.get('copies')) || 1));
const DEMO_ALL = Array.from({ length: DEMO_COPIES }, (_, c) => c === 0 ? DEMO_SESSIONS : DEMO_SESSIONS.map((x) => ({
  ...x, id: `${x.id}~${c}`, project: `${x.project}-${c + 1}`, age: x.age + c * 600,
  think: (x.think || []).map(([a, b]) => [(a + c * 37) % DEMO_LEN, Math.min(DEMO_LEN, (a + c * 37) % DEMO_LEN + (b - a))]),
  runs: (x.runs || []).map((r) => ({ ...r, at: (r.at + c * 37) % (DEMO_LEN - 60), end: (r.at + c * 37) % (DEMO_LEN - 60) + (r.end - r.at) })),
}))).flat();
const demoProjects = () => [...new Set(DEMO_ALL.map((x) => x.project))].map((cwd) => [cwd, (DEMO_PROJECTS.find(([p]) => cwd.startsWith(p)) || [0, 0])[1]]);

const demoIn = (spans, s) => (spans || []).find(([a, b]) => s >= a && s < b);

// 第 k 轮里一个座位变成的运行（秒数换成记录时间）
function demoRun(sess, r, k) {
  const base = DEMO_T0 + k * DEMO_LEN * 1000, at = base + r.at * 1000, end = base + r.end * 1000;
  return { id: `${sess.id}-${k}-${r.at}-${r.seat}`, lane: `${sess.id}-${r.at}-${r.seat}`, kind: r.kind, agent: r.agent, model: DEMO_MODEL[r.agent],
    group: r.group, plan: r.group ? `${sess.id}-${k}-${r.at}` : null, seat: r.group ? r.seat : null, role: r.role, title: r.group ? `${r.group} #${r.seat}` : sess.title,
    status: 'running', started_at: at, ended_at: null, queued: false, _end: end, _final: r.status };
}

// 时刻 t（记录时间）的一个对话摘要
function demoSummary(sess, t) {
  const sec = (t - DEMO_T0) / 1000, k = Math.max(0, Math.floor(sec / DEMO_LEN)), s = sec - k * DEMO_LEN;
  const runs = [];
  let done = 0, failed = 0, alert = null, last = DEMO_T0 + (sess.last ?? -60) * 1000;
  for (let j = Math.max(0, k - 3); j <= k; j++) for (const r of sess.runs || []) {
    const run = demoRun(sess, r, j);
    if (run.started_at > t) continue;
    last = Math.max(last, run.started_at);
    if (run._end <= t) {
      Object.assign(run, { status: run._final, ended_at: run._end });
      last = Math.max(last, run._end);
      run._final === 'done' ? done++ : failed++;
      // 失败后用户又发过消息就不再标红；用户发消息的时刻默认是每轮第一段思考的开头
      const prompts = sess.prompts || (sess.think?.length ? [sess.think[0][0]] : []);
      const prompted = [j, j + 1].some((m) => prompts.some((a) => { const p = DEMO_T0 + (m * DEMO_LEN + a) * 1000; return p > run._end && p <= t; }));
      if (run._final !== 'done' && t - run._end < 1800000 && !prompted) alert = { kind: run._final, run: run.id, model: run.model, at: run._end };
      if (t - run._end > 600000) continue;
    } else if (j === k && demoIn(sess.queued, s)) run.queued = true;
    delete run._end; delete run._final;
    runs.push(run);
  }
  runs.sort((a, b) => b.started_at - a.started_at);
  const thinking = demoIn(sess.think, s), waiting = demoIn(sess.wait, s);
  for (const spans of [sess.think, sess.wait]) for (const [a, b] of spans || []) {
    const from = DEMO_T0 + (k * DEMO_LEN + a) * 1000;
    if (from <= t) last = Math.max(last, Math.min(t, DEMO_T0 + (k * DEMO_LEN + b) * 1000));
  }
  const running = runs.filter((r) => r.status === 'running').length;
  const state = waiting ? 'waiting' : running ? 'dispatching' : thinking ? 'thinking' : 'idle';
  const talk = (sess.think || []).reduce((n, [a, b]) => n + Math.max(0, Math.min(b, s) - a), 0) + k * 40;
  return { id: sess.id, project: sess.project.toLowerCase(), cwd: sess.project, title: sess.title, model: 'claude-opus-5-5', state,
    started_at: DEMO_T0 - sess.age * 1000, last_at: last,
    waiting: waiting ? { tool: 'AskUserQuestion', since: DEMO_T0 + (k * DEMO_LEN + waiting[0]) * 1000, header: waiting[2] } : null,
    runs: runs.slice(0, 16), counts: { running, done, failed },
    usage: { input: 900 + talk * 40, cached: 30000 + talk * 2600, cache_write: 2000 + talk * 90, output: 400 + talk * 55 },
    cost_usd: Math.round((0.4 + talk * 0.012 + done * 0.05) * 100) / 100, cost_partial: false, alert, detail: sess.detail || null };
}

function demoUniverse(t) {
  const sessions = DEMO_ALL.map((s) => demoSummary(s, t));
  const busy = new Map();
  for (const s of sessions) for (const r of s.runs) if (r.status === 'running') {
    if (!busy.has(r.agent)) busy.set(r.agent, { running: [], queued: [] });
    busy.get(r.agent).running.push({ run: r.id, session: s.id });
    if (r.queued) busy.get(r.agent).queued.push({ run: r.id, session: s.id, since: r.started_at });
  }
  const agents = DEMO_AGENTS.map(([id, type, max]) => ({ id, type, max_parallel: max, ...(busy.get(id) || { running: [], queued: [] }) }));
  const projects = demoProjects().map(([cwd, older]) => ({ key: cwd.toLowerCase(), cwd, name: cwd.split('/').pop(), older }));
  return { v: 3, now: t, window_h: 24, projects, sessions, agents };
}

// 播放：每 250 毫秒按 uNow() 重算一遍，只把变了的对话和名额发出去
